}
let myCmds=[],SNAP=null;
// fields that belong to this screen only (menus, what you've read, the end screen), never rewound
const LOCAL_KEYS=new Set(['healFx','ghost','dtFx','boomFx','fxEnd','ringAt','battleFx','coreFx','endWait','stomps','spectate','popup','sel','moveMode','hoverPath','unread','anim','splitOpen','notice','trade','result','modal','techSel','hits','flash','ver','modalAt','popupAt','techFor','rockets','shocks','pulses','pulseT0','treatySeen','resultSent','over','winner','online','seenTech','waiting','log','timeLeft','coreFell','goldCutLogged','room','lastFight','battleAt','squadOpen','iResigned','waitInfo']);
function takeSnapshot(){
  if(!G||!G.online)return;
  const g={};for(const k in G)if(!LOCAL_KEYS.has(k))g[k]=G[k];
  SNAP={g:structuredClone(g),uid:UID,rng:RNG};
}
function restoreSnapshot(){
  const keep={};for(const k in G)if(LOCAL_KEYS.has(k))keep[k]=G[k];
  G=Object.assign(SNAP.g,keep);UID=SNAP.uid;RNG=SNAP.rng;SNAP=null;
  G.moveMode=null;G.hoverPath=null;G.splitOpen=null;
}
// a short fingerprint of the match; every screen sends it after each turn so the server can spot a desync
function stateHash(){
  const parts=[G.turn,RNG,UID];
  for(const p of G.players)parts.push(p.alive,p.ai,p.energy,RES.map(r=>p.res[r]).join(','),p.gold,[...p.techs].join(','),p.workerQueue,JSON.stringify(p.squads||[]),!!p.loopQ);
  for(const n of G.nodes)parts.push(n.owner,n.coreHp,n.type,n.estore,JSON.stringify(n.store),n.stations.map(s=>s.type+s.state+s.hp+s.work+s.queue.join('')+(s.qprog||0)+!!s.off+CLS.map(c=>s.hangar[c].map(d=>d.hp+':'+d.en+(d.up?'u':'')+(d.upg?'g':'')).join(',')).join(';')).join('/'));
  for(const f of G.fleets)parts.push(f.id,f.owner,f.cls,f.count,Math.round(f.hp*100),f.node,f.en.join(','),!!f.settled,(f.dock||[]).map(d=>d.c+d.en).join(','),f.freeHop,f.path.join('>'),f.bombard,f.charge||0);
  for(const w of G.workers)parts.push(w.id,w.owner,w.node,w.task,JSON.stringify(w.diplo||null));
  for(const p of G.players)parts.push((p.met||[]).join(','));
  parts.push(JSON.stringify(G.gifts||[]),JSON.stringify(G.goldCap||null),JSON.stringify(G.peace||[]),JSON.stringify(G.treaties||[]));
  const s=parts.join('|');let h=5381;for(let i=0;i<s.length;i++)h=(Math.imul(h,33)^s.charCodeAt(i))>>>0;
  return h.toString(36);
}

  trade:{n:'Trade',r:'Торговля',workers:2,sum:['Trade turns what you have into what you need, in the Empire menu.','Торговля в меню «Империя» превращает то, что есть, в то, что нужно.'],

function buildHtml(n){
  const w=walletAt(ME,n.id);
  let h=`<details class="sec"${n.stations.filter(x=>!ST[x.type].noSlot).length<SLOTS||n.center?'':' hidden'}><summary>${L('Build a station here','Построить станцию')}</summary><div class="sec" style="margin-top:8px">`;
  for(const [k,s] of Object.entries(ST)){
    const why=canBuild(ME,n,k);
    if(s.tech&&!has(ME,s.tech))continue;
    if(!fitsHere(n,k))continue;
    if(k==='borehole'&&n.stations.some(x=>x.type==='borehole'))continue;
    if(k==='levi'&&G.mode==='conquest')continue;
    h+=`<div class="row"><div class="grow"><b>${sN(k)}</b> <span class="sub">${cnt(s.t,'worker-turn')}</span>${s.hp?` <span class="sub mono">${HEART}${s.hp}${s.dmg?' '+DMG+s.dmg:''}</span>`:''}<br><span class="sub">${sD(k)}</span><br>${s.gold?`<span class="cost"><span class="${P(ME).gold<s.gold?'bad':''}">${STARGOLD}${s.gold}</span></span>`:costHtml(stCost(ME,k),w)}</div><button class="btn small" type="button" data-a="start" data-t="${k}" ${why?'disabled':''} title="${esc(why)}">${L('Start','Начать')}</button></div>`;
  }
  return h+`</div></details>`;
}
// "Move to it": the nearest idle worker that can get here
function moveToHtml(n){
  const K=known(ME);let best=null;
  for(const w of G.workers){if(w.owner!==ME||w.path.length||w.task!=='idle')continue;const pth=findPath(w.node,n.id,K);if(pth&&(!best||pth.length<best.d))best={w,d:pth.length};}
  const coming=G.workers.find(w=>w.owner===ME&&w.path.length&&w.path.at(-1)===n.id);
  let h=`<div class="sec"><h3>${L('Move to it','Лететь сюда')}</h3>`;
  if(coming)h+=`<div class="row"><div class="grow"><b>${esc(coming.name)}</b> <span class="sub">${L(`on the way · ${plural(coming.path.length,'hop')} away`,`в пути · ${cnt(coming.path.length,'hop')}`)}</span></div><button class="btn small" type="button" data-a="wtask" data-t="idle" data-w="${coming.id}">${L('Stop','Стоп')}</button></div>`;
  else if(!best)h+=`<p class="sub" style="margin:0">${L('No idle workers.','Нет свободных рабочих.')}</p>`;
  else h+=`<div class="row"><div class="grow"><b>${esc(best.w.name)}</b> <span class="sub">${L(`${plural(best.d,'hop')} away`,`${cnt(best.d,'hop')} отсюда`)}</span></div><button class="btn small primary" type="button" data-a="wgo" data-w="${best.w.id}" data-n="${n.id}">${L('Assign','Назначить')}</button></div>`;
  return h+`</div>`;
}
function assignList(title,id,act,on,extra){
  const K=known(ME),ws=G.workers.filter(w=>w.owner===ME);
  const hops=w=>{if(w.node===id)return 0;const pth=findPath(w.node,id,K);return pth?pth.length:null;};
  const rows=ws.map(w=>({w,h:hops(w),on:on(w)})).filter(x=>x.h!=null).sort((a,b)=>(a.on-b.on)||((a.w.task==='idle'&&!a.w.path.length?0:1)-(b.w.task==='idle'&&!b.w.path.length?0:1))||a.h-b.h);
  let h=`<div class="sec"><h3>${title} · ${rows.length}</h3>`;
  if(!rows.length)h+=`<p class="sub" style="margin:0">${L('None of your workers has a known route here.','Ни у одного рабочего нет известного пути сюда.')}</p>`;
  for(const {w,h:d,on:x} of rows)h+=`<div class="row"><div class="grow"><b>${esc(w.name)}</b> <span class="sub mono">${d?L(`${plural(d,'hop')} away`,`${cnt(d,'hop')} отсюда`):L('here','здесь')}</span><br><span class="sub">${workerStatus(w)}</span></div>${x?`<button class="btn small" type="button" data-a="wtask" data-t="idle" data-w="${w.id}">${L('Stop','Стоп')}</button>`:`<button class="btn small primary" type="button" data-a="${act}" data-w="${w.id}" data-n="${id}" ${extra||''}>${L('Assign','Назначить')}</button>`}</div>`;
  return h+`</div>`;

  if(mine)h+=dis;
  return h;
}
// barracks: one card per drone (name opens its blueprint, then cost, stats, Queue and Launch)
function kazarmHtml(n,s){

// upgrade station: like a barrack, a card per type with Upgrade (a docked drone, done next turn) and Launch
function upgradeHtml(n,s){
  const w=walletAt(ME,n.id),list=dockKinds(s).filter(c=>dU(c)&&(DR[c].ground?s.hangar[c].length>0:canMake(ME,c))); // rovers show only while docked here

}
// small pop-up layer on top of menus: a drone's blueprint, a tech, or the list of docked drones of one type
function renderPopup(){
  const box=$('#popup');
  if(!G||!G.popup){box.hidden=true;return;}
  const m=G.popup,p=P(ME);let h=`<button class="x" type="button" data-a="pclose" aria-label="${L('Close','Закрыть')}">✕</button>`;

  }else if(m.type==='preview'){
    const r=m.res,n=G.nodes[m.to],win=r&&r.win.length===1&&r.win[0]===ME;

    h+=`<h2>${r?L(`If you move to this ${tileKind(n)}, you would ${win?'win':'lose'}`,`Если полететь на ${tileKind(n)}, вы ${win?'победите':'проиграете'}`):L('The result is hard to predict','Исход трудно предсказать')}</h2><p class="sub" style="margin:0">${L('An estimate from what you can see now, if nobody else moves.','Оценка по тому, что вы видите сейчас, если никто больше не сдвинется.')}</p>`;
    if(r){
      if(r.workersOnly)h+=`<div class="row"><div class="grow">${L(`The enemy has only workers there: ${plural(r.workersOnly,'worker')} would be destroyed.`,`Там только рабочие противника: будет уничтожено ${cnt(r.workersOnly,'worker')}.`)}</div></div>`;
      for(const sd of r.sides){const mine=sd.pid===ME,won=r.win.includes(sd.pid);if(!won&&!sd.saved.length)continue;
        h+=`<div class="row"><div class="grow"><b style="color:${P(sd.pid).color}">${mine?L('You','Вы'):esc(pShort(P(sd.pid)))}</b> ${won?L('would keep',mine?'сохраните':'сохранит'):''} ${won?desc(sd):''}${sd.saved.length?`<br><span class="sub">${L('Boomerangs would save','Бумеранги спасут')}: ${sd.saved.map(esc).join(', ')}</span>`:''}</div></div>`;}
    }

  }else if(m.type==='rival'){
    // send a treaty or break the peace: a worker at the core spends this turn on it
    const q=P(m.p),peace=atPeace(ME,m.p),ws=idleFirst(G.workers.filter(w=>w.owner===ME&&w.node===p.core&&!w.path.length));
    const can=peace||has(ME,'diplomacy');
    h+=`<h2>${peace?L(`Do you want to break the peace with ${esc(pName(q))}?`,`Разорвать мир с ${esc(pName(q))}?`):L(`Do you want to send a peace treaty to ${esc(pName(q))}?`,`Отправить мирный договор игроку ${esc(pName(q))}?`)}</h2>`;
    if(peace)h+=`<p class="sub" style="margin:0">${L("If you break it, all your squadrons on their tiles are destroyed. Theirs on your tiles are not.",'Если вы разорвёте мир, все ваши эскадрильи на их клетках будут уничтожены. Их эскадрильи на ваших клетках — нет.')}</p>`;
    if(!can)h+=`<p class="sub" style="margin:0">${L('Research Diplomacy (after Better rates) to send peace treaties.','Изучите Дипломатию (после «Выгодного курса»), чтобы отправлять мирные договоры.')}</p>`;
    else{
      h+=`<div class="sec"><h3>${L('Your workers at the core','Ваши рабочие в ядре')} · ${ws.length}</h3>`;
      if(!ws.length)h+=`<p class="sub" style="margin:0">${L('A worker standing at your core spends one turn on this. Move one there first.','Это занимает один ход рабочего в ядре. Сначала приведите туда рабочего.')}</p>`;

        h+=`<div class="row"><div class="grow"><b>${esc(w.name)}</b><br><span class="sub">${workerStatus(w)}</span></div>${here?`<button class="btn small" type="button" data-a="dstop" data-w="${w.id}">${L('Stop','Стоп')}</button>`:`<button class="btn small primary" type="button" data-a="dset" data-w="${w.id}" data-p="${m.p}" data-b="${peace?1:0}">${peace?L('Yes, break it','Да, разорвать'):L('Assign','Назначить')}</button>`}</div>`;}

    h+=`<div class="opts"><button class="btn" type="button" data-a="pclose">${peace?L('No','Нет'):L('Close','Закрыть')}</button></div>`;
  }else if(m.type==='treaty'){
    const q=P(m.from);
    h+=`<h2>${L(`${esc(pName(q))} wants to make peace with you`,`${esc(pName(q))} хочет заключить с вами мир`)}</h2><p class="sub" style="margin:0">${L("At peace you can't attack each other, you see each other's cores and spies, and your networks link where they touch. Either of you can break it later.",'В мире вы не можете нападать друг на друга, видите ядра и шпионов друг друга, а ваши сети соединяются там, где соприкасаются. Любой из вас может потом разорвать мир.')}</p>`;

  }else if(m.type==='tutskip'){
    h+=`<h2>${L('Skip the tutorial?','Пропустить обучение?')}</h2><p class="sub" style="margin:0">${L('You can replay it any time: Settings → Replay tutorial.','Его всегда можно пройти заново: Настройки → «Пройти обучение заново».')}</p><div class="opts"><button class="btn danger" type="button" data-a="tut-skip">${L('Skip tutorial','Пропустить')}</button><button class="btn primary" type="button" data-a="pclose">${L('Keep learning','Продолжить')}</button></div>`;
  }else if(m.type==='charge'){

    const f=G.fleets.find(x=>x.id===m.f);if(!f){G.popup=null;box.hidden=true;return;}

    h+=`<div class="opts" role="radiogroup">${Array.from({length:mx},(_,i)=>i+1).map(k=>`<button class="btn small ${k===m.cr?'primary':''}" type="button" role="radio" aria-checked="${k===m.cr}" data-a="chg" data-k="${k}" ${k>P(ME).res.xeno?'disabled':''} style="${k>5?'color:var(--bad)':''}">${rb('xeno')}${k}</button>`).join('')}</div>`;
    h+=`<p class="mono" style="margin:0">${L('Hits','Удары')}: ${dm.join(' → ')}${hops<m.cr?'':''}</p>`;
    h+=`<div class="opts"><button class="btn primary" type="button" data-a="chgfire">${L('Fire','Огонь')}</button><button class="btn" type="button" data-a="pclose">${L('Cancel','Отмена')}</button></div>`;
  }else if(m.type==='hangar'){

    else h+=`<div class="warnbox">${L("This tile isn't connected to your core, so <b>you get nothing back</b>.",'Эта клетка не подключена к ядру, поэтому <b>ничего не вернётся</b>.')}</div>`;

// workers who could start researching tech t right now: standing at the core, not already on t

  try{for(let pid=0;pid<G.players.length;pid++)for(const c of (m.cmds[pid]||[])){try{applyCmd(pid,c);}catch(e){console.warn('Colonio: order failed',c,e);}}}
  finally{REPLAY=false;}
  const gone=(m.dropped||[]).map(pid=>G.players[pid]).filter(q=>q&&!q.ai);
  gone.forEach(q=>{q.ai=true;});
  myCmds=[];G.waiting=false;G.waitInfo='';
  sfxTurn();resolve();
  for(const q of gone)log(L(`${pShort(q)} left the match; an AI took over their empire.`,`${pShort(q)} покинул матч, его империей теперь управляет ИИ.`),'warn',null,G.players.map(x=>x.id));
  takeSnapshot();
  Net.send({t:'hash',turn:m.turn,h:stateHash()});
  afterResolve();
  // out of the match: keep watching without holding up the people still playing.
  // Once no person is left in the match, nobody is waiting: watchers step through turns with Next turn.
  if(!P(ME).alive&&humansLeft()){G.waiting=true;Net.send({t:'end',turn:G.turn,cmds:[]});refresh();}
}
// is any person (not an AI) still playing?
const humansLeft=()=>G.players.some(p=>p.human&&!p.ai&&p.alive)&&G.players.filter(p=>p.alive).length>1;
function resignOnline(){
  if(!P(ME).alive)return;
  G.iResigned=true;
  if(G.waiting)Net.send({t:'resign',turn:G.turn});

  toast(L('You resigned. The match ends for you when this turn resolves.','Вы сдались. Матч для вас закончится, когда этот ход завершится.'));
}

    ov.innerHTML=`<div class="card"><h1>${L('Settings','Настройки')}</h1>${setTabs()}
      <div class="field"><div class="lab">${L('Language','Язык')}</div><span class="seg">${seg('s-lang','en',!RU(),'English')}${seg('s-lang','ru',RU(),'Русский')}</span></div>
      <div class="field"><div class="lab"><span>${L('Fleets follow drawn routes','Флоты летят по нарисованному пути')}</span><button type="button" class="switch ${settings.fleetRoute?'on':''}" role="switch" aria-checked="${settings.fleetRoute}" data-a="s-froute" aria-label="${L('Fleets follow drawn routes','Флоты летят по нарисованному пути')}"></button></div></div>
      <div class="field"><div class="lab"><span>${L('Continuous artillery fire','Непрерывный огонь артиллерии')}</span><button type="button" class="switch ${settings.keepFire?'on':''}" role="switch" aria-checked="${settings.keepFire}" data-a="s-fire" aria-label="${L('Continuous artillery fire','Непрерывный огонь артиллерии')}"><i></i></button></div><p class="sub" style="margin:0">${L('Catapults and ballistas keep firing every turn until you stop them.','Катапульты и баллисты стреляют каждый ход, пока вы их не остановите.')}</p></div>
      <div class="field"><div class="lab"><span>${L('Battle animations','Анимация боёв')}</span><button type="button" class="switch ${settings.battleFx?'on':''}" role="switch" aria-checked="${settings.battleFx}" data-a="s-bfx" aria-label="${L('Battle animations','Анимация боёв')}"></button></div></div>
      <div class="field"><div class="lab"><span>${L('Show important reports','Показывать важные отчёты')}</span><button type="button" class="switch ${settings.autoReport?'on':''}" role="switch" aria-checked="${settings.autoReport}" data-a="s-rep" aria-label="${L('Show important reports','Показывать важные отчёты')}"><i></i></button></div><p class="sub" style="margin:0">${L('Open the turn report by itself when something important happens, like losing your core.','Открывать отчёт за ход самостоятельно, когда происходит что-то важное, например падение ядра.')}</p></div>
      <div class="field"><div class="lab"><span>${L('Infinite queues','Бесконечные очереди')}</span><button type="button" class="switch ${settings.loopQ?'on':''}" role="switch" aria-checked="${settings.loopQ}" data-a="s-loop" aria-label="${L('Infinite queues','Бесконечные очереди')}"><i></i></button></div><p class="sub" style="margin:0">${L('Barracks and upgrade stations repeat the last drone, one a turn, whenever you can pay for it.','Казармы и станции улучшений повторяют последний дрон, по одному за ход, когда хватает ресурсов.')}</p></div>
      ${menuFrom==='game'?'':`<div class="field"><button class="btn" type="button" data-a="s-tut">${L('Tutorials','Обучение')}</button></div>`}
      <div class="opts"><button class="btn primary" type="button" data-a="m-back">${menuFrom==='game'?L('Back to game','Вернуться в игру'):L('Back','Назад')}</button></div></div>`;
  }else if(view==='closed'){
    ov.innerHTML=`<div class="card"><h1>${L('Colonio is closed','Колонио закрыт')}</h1><p>${L('The music has stopped. You can close this browser tab now.','Музыка остановлена. Теперь можно закрыть эту вкладку.')}</p><div class="opts"><button class="btn" type="button" data-a="m-reopen">${L('Back to main menu','В главное меню')}</button></div></div>`;
  }
}
// settings tabs: General and Keyboard (phones and tablets only get General)
let setTab='general',keyWait=null;
const touchOnly=()=>window.matchMedia&&matchMedia('(hover: none) and (pointer: coarse)').matches;
const setTabs=()=>`<div class="seg tabs" role="tablist">${[['general','General','Общие'],['sound','Sound','Звук'],...(touchOnly()?[]:[['keys','Keyboard','Клавиатура']])].map(([v,en,ru])=>`<button type="button" role="tab" aria-selected="${setTab===v}" class="${setTab===v?'on':''}" data-a="set-tab" data-v="${v}">${L(en,ru)}</button>`).join('')}</div>`;
const hostOpts={name:'',mode:'warfare',per:20,opp:3,timer:45};
const keepLobbyName=()=>{const el=$('#lobbyIn');if(el)hostOpts.name=el.value.trim();};
// the calm rocket (Draft 11): slow drifting stars, one gentle sway every 6 s, a soft flame.
// Used while waiting in a lobby and while signing in. On phones it flies higher so it never covers the text.
let lobbyAnim=null;
function startLobbyAnim(id){
  const cv=$(id||'#lobbycv');if(!cv)return;
  const d=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;
  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const st=Array.from({length:Math.round(w*h/2600)},()=>({x:Math.random()*w,y:Math.random()*h,l:3+Math.random()*9,v:.25+Math.random()*.6,a:.15+Math.random()*.5}));
  const ry=w<600||h>w?.26:.36;
  const me={};lobbyAnim=me;let last=performance.now();
  const frame=now=>{
    if(lobbyAnim!==me||!document.body.contains(cv))return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    x.fillStyle='#060911';x.fillRect(0,0,w,h);
    for(const p of st){p.y+=p.v*dt*60;if(p.y-p.l>h){p.y=-4;p.x=Math.random()*w;}x.fillStyle=`rgba(221,230,245,${p.a})`;x.fillRect(p.x,p.y-p.l,1.2,p.l);}
    const t=now/1000,ph=t*2*Math.PI/6,sway=Math.sin(ph),k=Math.max(.8,Math.min(w,h)/260);
    const cx=w/2+sway*10*k,cy=h*ry+Math.sin(t*2*Math.PI/4)*3*k,tilt=Math.cos(ph)*.07;
    x.save();x.translate(cx,cy);x.rotate(tilt);x.scale(k,k);
    const fl=1+.18*Math.sin(now/180)+.06*Math.sin(now/67);
    x.globalAlpha=.9;x.beginPath();x.moveTo(-6,28);x.lineTo(0,28+17*fl);x.lineTo(6,28);x.closePath();x.fillStyle='#ffb547';x.fill();
    x.beginPath();x.moveTo(-3.5,28);x.lineTo(0,28+9*fl);x.lineTo(3.5,28);x.closePath();x.fillStyle='#fff6dd';x.fill();x.globalAlpha=1;
    x.fillStyle='#4da3ff';
    x.beginPath();x.moveTo(-9,10);x.lineTo(-17,32);x.lineTo(-9,27);x.closePath();x.fill();
    x.beginPath();x.moveTo(9,10);x.lineTo(17,32);x.lineTo(9,27);x.closePath();x.fill();
    x.beginPath();x.moveTo(0,-34);x.bezierCurveTo(11,-20,11,6,9,28);x.lineTo(-9,28);x.bezierCurveTo(-11,6,-11,-20,0,-34);x.closePath();x.fillStyle='#dde6f5';x.fill();
    x.beginPath();x.arc(0,-8,5,0,Math.PI*2);x.fillStyle='#4da3ff';x.fill();x.strokeStyle='#0b1020';x.lineWidth=1.2;x.stroke();
    x.restore();requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
document.addEventListener('change',e=>{
  if(e.target.id==='picIn'&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      // square crop, 128 px, small enough to keep on the device
      const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
      const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);
      profile.pic=c.toDataURL('image/jpeg',.85);saveProfile();if(Acc.state==='in')Acc.setPic(profile.pic).catch(()=>toast(L("Couldn't save the picture.",'Не удалось сохранить фото.'),true));showMenu('profile');
    };im.src=fr.result;};
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='nameIn'&&Acc.state!=='in'){profile.name=e.target.value.trim().slice(0,16)||'Player';saveProfile();}
  if(e.target.id==='hperR'){hostOpts.per=+e.target.value;$('#hperV').textContent=e.target.value;}
});
// the server applied this match's Elo: roll the digits from the old value to the new one
let ELO_RES=null;
function eloResult(m){ELO_RES=m;profile.elo=m.after;profile.games=m.games;saveProfile();if(ov.dataset.view==='end')showEnd();}
function eloRoll(){
  const r=ELO_RES;if(!r)return Acc.state==='in'?`<p class="sub" style="text-align:center">${L('Updating Elo…','Обновляем Elo…')}</p>`:'';
  const up=r.after>=r.before,d=r.after-r.before,a=String(r.before).padStart(4,' '),b=String(r.after).padStart(4,' ');
  return `<div class="eloroll" data-from="${r.before}" data-to="${r.after}"><div class="edigs">${[...b].map((ch,i)=>`<span class="dg"><span class="rl" data-f="${a[i]}" data-t="${ch}">${ch}</span></span>`).join('')}</div><div class="ebar"><i class="${up?'up':'down'}"></i></div><div class="${up?'good':'bad'}">${up?'+':'−'}${Math.abs(d)} Elo${r.first?L(' · your first rated game',' · ваша первая рейтинговая игра'):''}</div></div>`;
}
function animateElo(){
  const box=ov.querySelector('.eloroll');if(!box||box.dataset.done)return;box.dataset.done=1;
  const up=+box.dataset.to>=+box.dataset.from;
  box.querySelectorAll('.rl').forEach((el,i)=>{const f=el.dataset.f,t=el.dataset.t;if(f===t||t===' ')return;
    const seq=[];let x=f===' '?0:+f;const step=up?1:-1;for(let k=0;k<10*(1+i);k++){seq.push(x);x=(x+step+10)%10;}while(x!==+t){seq.push(x);x=(x+step+10)%10;}seq.push(+t);
    el.innerHTML=seq.map(n=>`<span>${n}</span>`).join('');
    el.animate([{transform:'translateY(0)'},{transform:`translateY(-${(seq.length-1)*1.3}em)`}],{duration:900+i*300,delay:350,easing:'cubic-bezier(.2,.7,.2,1)',fill:'forwards'});});
  const bar=box.querySelector('.ebar i');if(bar)bar.animate([{width:'50%'},{width:up?'62%':'38%'}],{duration:1400,delay:600,easing:'ease-out',fill:'forwards'});
}
function endGame(result){
  if(G&&G.tut){if(result==='won'&&TUT){const w=animWait();if(w>0){const k=TUT.key;setTimeout(()=>{if(TUT&&TUT.key===k)tutFinish();},w);}else tutFinish();}return;}
  G.over=true;G.result=result;G.moveMode=null;
  // after a defeat (or resigning) the whole map opens up and you can keep pressing Next turn to watch the AIs
  // the winner also gets the whole map, with no fog, to look around
  G.spectate=true;
  if(result==='resigned'&&P(ME).alive)coreFall(G.nodes[P(ME).core]);
  if(result==='resigned')log(L('You resigned.','Вы сдались.'),'battle',null,[0]);
  closeModal();refresh();
  const w=animWait();if(w>0){G.endWait=true;setTimeout(()=>{if(G&&G.over&&G.endWait){G.endWait=false;showEnd();}},w);}else showEnd();
}
function showEnd(){
  const r=G.result;
  const gw=G.winner!=null&&G.mode==='conquest'&&P(G.winner).gold>=GOLD_WIN?P(G.winner):null;
  const title=r==='draw'?L('Stalemate','Пат'):r==='won'?(gw?L('Starium secured','Стариум добыт'):L('Belt secured','Пояс ваш')):r==='lost'?(gw?L(`${pShort(gw)} wins`,`Победа: ${pShort(gw)}`):L('Core lost','Ядро потеряно')):L('You resigned','Вы сдались');
  const text=r==='draw'?L('Turn 1000 was reached and nobody won. The match is a draw.','Достигнут 1000-й ход, никто не победил. Ничья.'):r==='won'?(gw?L(`You mined ${gw.gold} starium on turn ${G.turn-1}.`,`Вы добыли ${gw.gold} стариума на ходу ${G.turn-1}.`):L(`Every rival has been shut down. You control the belt after ${G.turn-1} turns.`,`Все соперники отключены. За ${cnt(G.turn-1,'turn')} вы взяли пояс под контроль.`)):r==='lost'?(gw?L(`${pName(gw)} reached ${GOLD_WIN} starium on turn ${G.turn-1}.`,`${pName(gw)} набрал ${GOLD_WIN} стариума на ходу ${G.turn-1}.`):L(`Your core was destroyed on turn ${G.turn-1}.`,`Ваше ядро уничтожено на ходу ${G.turn-1}.`)):L(`You left the match on turn ${G.turn}.`,`Вы покинули матч на ходу ${G.turn}.`);
  ov.hidden=false;ov.className='dim';ov.dataset.view='end';
  requestAnimationFrame(()=>fitText(ov));
  ov.innerHTML=`<div class="card"><button class="x" type="button" data-a="e-close" aria-label="${L('Close and watch the map','Закрыть и смотреть карту')}">✕</button><h1>${title}</h1><p>${text}</p>${G.online?eloRoll():''}<div class="opts">${G.online?'':`<button class="btn primary" type="button" data-a="e-next">${L('Next game','Следующая игра')}</button>`}${r==='won'?`<button class="btn" type="button" data-a="e-close">${L('Observe the map','Осмотреть карту')}</button>`:''}${r!=='won'&&G.spectate&&!gw&&G.players.filter(p=>p.alive).length>1?`<button class="btn" type="button" data-a="e-close">${G.online?L('Keep watching','Смотреть дальше'):L('Watch the AIs','Смотреть за ИИ')}</button>`:''}<button class="btn" type="button" data-a="e-menu">${L('Back to menu','В меню')}</button></div></div>`;
  requestAnimationFrame(animateElo);
}
ov.addEventListener('click',e=>{if(e.target===ov&&ov.dataset.view==='end'){sfxClick();closeOverlay();}});
function menuAct(a,d){
  switch(a){
    case 'm-play':showMenu('play');break;
    case 'm-host':showMenu('host');break;
    case 'm-join':LOBBIES=null;netError='';showMenu('join');Net.send({t:'list'});break;
    case 'm-board':BOARD=null;showMenu('board');if(Acc.state==='in'||Acc.state==='out')Acc.board().then(b=>{BOARD=b;if(ov.dataset.view==='board')showMenu('board');}).catch(e=>{console.warn(e);BOARD={err:L("Couldn't load the leaderboard.",'Не удалось загрузить таблицу.')};if(ov.dataset.view==='board')showMenu('board');});break;
    case 'acc-in':Acc.signIn();break;
    case 'tut-lang':settings.lang=d.v;saveSettings();beginTutorial('starter');break;
    case 'tut-go':beginTutorial(d.v);break;
    case 'tut-list':leaveGame();showMenu('tutmenu');break;
    case 'tut-menu':leaveGame();showMenu('main');break;
    case 'acc-out':Acc.signOut();break;
    case 'acc-name':{const v=($('#nameIn')||{}).value||'';Acc.rename(v.trim()).then(err=>{nameMsg=err?{t:err,ok:false}:{t:L('Saved.','Сохранено.'),ok:true};showMenu('profile');});break;}
    case 'm-profile':nameMsg='';showMenu('profile');break;
    case 'm-pic':{const f=$('#picIn');if(f)f.click();break;}
    case 'm-picdel':profile.pic='';saveProfile();if(Acc.state==='in')Acc.setPic('');showMenu('profile');break;
    case 'h-mode':hostOpts.mode=d.v;keepLobbyName();showMenu('host');break;
    case 'h-opp':hostOpts.opp=+d.v;keepLobbyName();showMenu('host');break;
    case 'h-timer':hostOpts.timer=+d.v;keepLobbyName();showMenu('host');break;
    case 'h-go':keepLobbyName();LOBBY=null;netError='';showMenu('lobby');
      Net.send({t:'host',who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''},name:hostOpts.name||L(`${profile.name}'s lobby`,`Лобби ${profile.name}`),mode:hostOpts.mode,per:hostOpts.per,opp:hostOpts.opp,timer:hostOpts.timer});break;
    case 'm-leave':Net.leaveRoom();showMenu('main');break;
    case 'l-start':if(LOBBY&&LOBBY.players.length<LOBBY.need){LCONF=true;showMenu('lobby');}else Net.send({t:'start'});break;
    case 'l-go':LCONF=false;Net.send({t:'start'});break;
    case 'l-cancel':LCONF=false;showMenu('lobby');break;
    case 'j-go':Net.send({t:'join',code:d.c,who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''}});break;
    case 'j-code':{const v=(($('#codeIn')||{}).value||'').trim().toUpperCase();if(v)Net.send({t:'join',code:v,who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''}});break;}
    case 'j-refresh':LOBBIES=null;netError='';showMenu('join');Net.send({t:'list'});break;
    case 'm-setup':showMenu('setup');break;
    case 'm-settings':menuFrom='main';showMenu('settings');break;
    case 'm-main':showMenu('main');break;
    case 'm-back':if(menuFrom==='game'&&G)closeOverlay();else showMenu('main');break;
    case 'm-close':gameClosed=true;try{window.close();}catch(e){}showMenu('closed');break;
    case 'm-reopen':gameClosed=false;audioInit();showMenu('main');break;
    case 's-bots':setupOpts.bots=+d.v;showMenu('setup');break;
    case 's-timer':setupOpts.timer=+d.v;showMenu('setup');break;
    case 's-mode':setupOpts.mode=d.v;showMenu('setup');break;
    case 's-loop':settings.loopQ=!settings.loopQ;saveSettings();showMenu('settings');if(G&&P(ME).alive)order({t:'loopq',v:settings.loopQ});break;
    case 's-rep':settings.autoReport=!settings.autoReport;saveSettings();showMenu('settings');break;
    case 's-bfx':settings.battleFx=!settings.battleFx;saveSettings();showMenu('settings');break;
    case 's-froute':settings.fleetRoute=!settings.fleetRoute;saveSettings();showMenu('settings');break;
    case 's-fire':settings.keepFire=!settings.keepFire;saveSettings();showMenu('settings');break;
    case 's-tut':showMenu('tutmenu');break;
    case 'set-tab':setTab=d.v;keyWait=null;showMenu('settings');break;
    case 'k-chg':keyWait={a:d.k,i:+d.i};showMenu('settings');break;
    case 'k-reset':settings.keys=defaultKeys();keyWait=null;saveSettings();showMenu('settings');toast(L('Keys reset to default.','Клавиши сброшены.'));break;
    case 's-lang':settings.lang=d.v==='ru'?'ru':'en';saveSettings();document.documentElement.lang=settings.lang;showMenu('settings');if(G){renderTop();refresh();}break;
    case 's-diff':setupOpts.diff=d.v;showMenu('setup');break;
    case 's-go':newGame({...setupOpts});break;
    case 'e-close':closeOverlay();break;
    case 'e-next':newGame({...setupOpts});break;
    case 'e-menu':leaveGame();showMenu('main');break;
  }
}

$('#ver').textContent=GAME_VERSION;
resize();showMenu(Acc.state==='guest'?(profile.tut?'main':'tutlang'):'signing');Acc.init();if(document.fonts)document.fonts.ready.then(()=>{fitText(ov);if(G)refresh();});requestAnimationFrame(draw);
</script>
