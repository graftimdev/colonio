  if(p.workerQueue>0){
    const names=[];
    p.workersBuilt+=p.workerQueue-p.freeQ;
    for(;p.workerQueue>0;p.workerQueue--){const w=newWorker(pid,p.core);G.workers.push(w);names.push(w.name);}
    p.freeQ=0;
    log(L(`New worker${names.length>1?'s':''} ${names.join(', ')} left your core.`,`Нов${names.length>1?'ые рабочие':'ый рабочий'} ${names.join(', ')} покинул${names.length>1?'и':''} ядро.`),'good',p.core,[pid]);
  }
  p.energy=Math.max(0,Math.min(energyCap(pid),Math.round(avail*10)/10));
  for(const cl of new Set(clusters.values())){let e=cl.energy;for(const x of cl.ids){x.estore=0;const cap=30*live(x,'estorage').length;const t=Math.min(cap,e);x.estore=t;e-=t;}}
}

/* ---------- computer opponents ---------- */
// rovers guard their planet: chase enemies on it, shell neighbours with ballistas, otherwise hold the centre
function aiRover(f,pid){
  const g=groundSet(f.node),n=G.nodes[f.node],KV=known(pid);
  const foe=id=>KV.has(id)&&G.fleets.some(x=>x.node===id&&x.owner!==pid&&x.cls!=='spy')||G.workers.some(w=>w.node===id&&w.owner!==pid);
  if(f.cls==='ballista'){const t=n.nbr.find(foe);if(t!=null&&!foe(f.node)){f.bombard=t;return;}}
  const d=distMap(f.node,g);let tgt=null,bd=Infinity;
  for(const [id,dd] of d)if(foe(id)&&dd<bd){bd=dd;tgt=id;}
  if(tgt==null){const pl=G.planets[n.planet];if(pl&&G.nodes[pl.center].owner===pid&&!G.nodes[pl.center].stations.some(x=>x.type==='levi'))tgt=pl.center;}
  if(tgt!=null&&tgt!==f.node&&tileCount(pid,tgt,f.cls,f)+f.count<=tileCap(pid))f.path=findPath(f.node,tgt,g)||[];
}
const AI_TECH=['generator','barrack','turret','deepscan','trade','drills','planetmove','utility','fleet10','chain','xray','thrusters','estorage','borehole','upgradest','rovers','radio','barrier','rates','death','xtrade'];
const aiNextTech=p=>AI_TECH.find(t=>techOpen(p,TECH[t])&&researchersOn(p.id,t)<techLeft(p,t))||null;
// difficulty: Hard is the full AI; Normal and Easy hesitate, build less, research less and attack later
const AI_DIFF={
  hard:  {reserve:4,workers:12,skip:0,  idle:0,  research:2,attackAt:5, react:true, death:true, upgrade:true, catapult:true, queue:1,think:1,resAt:3},
  normal:{reserve:10,workers:7, skip:.4, idle:.3, research:1,attackAt:10,react:true, death:false,upgrade:true, catapult:true, queue:.55,think:.8,resAt:5},
  easy:  {reserve:15,workers:5, skip:.65,idle:.55,research:1,attackAt:16,react:false,death:false,upgrade:false,catapult:false,queue:.3,think:.55,resAt:10}
};
function aiTurn(p){
  const pid=p.id,conn=G.conn[pid],K=known(pid),DF=AI_DIFF[G.diff]||AI_DIFF.hard;
  const ws=G.workers.filter(w=>w.owner===pid);
  const core=G.nodes[p.core];
  for(const w of ws)if(w.task==='research'&&(!w.tech||p.techs.has(w.tech))){w.tech=aiNextTech(p);if(!w.tech)w.task='idle';}
  if(workerTotal(p)<DF.workers&&rnd()<DF.think){const c=workerCost(p);if(canPayAt(pid,p.core,c)&&p.res.iron>=c.iron+DF.reserve){payAt(pid,p.core,c);p.workerQueue++;}}
  if(has(pid,'trade')){
    const [give,get]=has(pid,'rates')?[4,3]:[3,2];const base=has(pid,'xtrade')?RES:RES.filter(r=>r!=='xeno');
    for(let i=0;i<4;i++){const hi=base.reduce((a,b)=>p.res[a]>=p.res[b]?a:b),lo=base.reduce((a,b)=>p.res[a]<=p.res[b]?a:b);if(hi===lo||p.res[hi]<30||p.res[hi]-p.res[lo]<15)break;p.res[hi]-=give;addRes(p,lo,get);}
  }
  const net=energyProd(pid)-energyUse(pid);
  const unfinished=[];G.nodes.forEach(n=>{if(n.owner===pid)n.stations.forEach(s=>{if(s.state==='build')unfinished.push({n,s});});});
  if(!unfinished.length&&rnd()>=DF.skip){
    const count=t=>G.nodes.reduce((a,n)=>a+(n.owner===pid?n.stations.filter(s=>s.type===t&&s.state!=='destroyed').length:0),0);
    const full=resTotal(p)>=resCap(pid)-5;
    // wishes in priority order; the first one that fits a free slot somewhere gets built
    const wants=[];
    if(G.turn>=2&&count('generator')<1)wants.push('generator');
    if(G.turn>=4&&count('kazarm')<1)wants.push('kazarm');
    if(full&&count('storage')<3)wants.push('storage');
    if(net<6&&count('generator')<6)wants.push('generator');
    if(has(pid,'turret')&&count('turret')<1)wants.push('turret');
    if(has(pid,'chain')&&count('chain')<1)wants.push('chain');
    if(has(pid,'xray')&&count('xray')<1)wants.push('xray');
    if(DF.upgrade&&G.turn>=14&&count('kazarm')>=1&&count('upgrade')<1&&p.res.silicon>=12)wants.push('upgrade');
    if(G.turn>=16&&has(pid,'turret')&&count('turret')<2)wants.push('turret');
    if(G.turn>=18&&count('barrier')<1&&p.res.xeno>=2)wants.push('barrier');
    if(DF.death&&has(pid,'death')&&count('death')<1)wants.push('death');
    if(G.mode!=='conquest'&&p.gold>=ST.levi.gold)wants.unshift('levi');
    // conquest: a borehole on every owned planet centre, and rover barracks to hold the planet
    const myPlanet=G.nodes.filter(n=>n.owner===pid&&n.planet!=null);
    if(myPlanet.some(n=>n.center&&!n.stations.some(s=>s.type==='borehole')))wants.unshift('borehole');
    if(myPlanet.length&&G.turn>=8&&count('rbarracks')<1)wants.splice(myPlanet.some(n=>n.center&&n.stations.some(s=>s.type==='borehole'))?0:Math.min(2,wants.length),0,'rbarracks');
    const sites=[core,...[...conn].map(id=>G.nodes[id]).filter(n=>n!==core)];
    const kazSites=sites.filter(n=>n.stations.some(s=>s.type==='kazarm'));
    // death turrets go on the frontier: an owned asteroid next to someone else's territory
    const frontier=sites.filter(n=>n.nbr.some(x=>G.nodes[x].owner!=null&&G.nodes[x].owner!==pid));
    const poolFor=want=>want==='borehole'||want==='levi'?myPlanet.filter(n=>n.center):want==='rbarracks'?myPlanet.sort((a,b)=>b.center-a.center):want==='turret'||want==='chain'||want==='xray'||want==='barrier'?[core,...kazSites,...sites]:want==='upgrade'?kazSites:want==='death'?[...frontier,core]:sites;
    const standing=id=>ws.some(w=>w.node===id&&!w.path.length);
    for(const want of wants){
      const fit=poolFor(want).filter(n=>!canBuild(pid,n,want));
      const site=fit.find(n=>standing(n.id));
      if(!site&&fit[0]&&!p.aiGo){p.aiGo=fit[0].id;}
      if(site){const pc=stCost(pid,want);payAt(pid,site.id,pc);if(ST[want].gold)p.gold-=ST[want].gold;const s=newStation(site,want,{paid:pc,gold:ST[want].gold||0});site.stations.push(s);unfinished.push({n:site,s});break;}
    }
  }
  const cap=tileCap(pid);
  let future=0;
  for(const n of G.nodes)if(n.owner===pid)for(const s of live(n,'kazarm'))future+=[...s.queue,...CLS.flatMap(c=>s.hangar[c].map(()=>c))].reduce((a,c)=>a+DR[c].up,0);
  const myArmed=G.fleets.filter(f=>f.owner===pid&&DR[f.cls].dmg>0).length;
  const turretsSeen=G.nodes.some(n=>K.has(n.id)&&n.owner!=null&&n.owner!==pid&&liveTurrets(n).length);
  for(const n of G.nodes){if(n.owner!==pid)continue;for(const s of live(n,'kazarm')){
    if(s.queue.length<2&&rnd()<DF.queue){
      const extra=[];if(p.res.xeno>=1&&rnd()<.3)extra.push('siege');
      if(G.turn>=8&&!G.fleets.some(f=>f.owner===pid&&f.cls==='spy')&&!s.hangar.spy.length&&!s.queue.includes('spy')&&rnd()<.15)extra.unshift('spy');if(myArmed>=2&&rnd()<.15)extra.push('repair');if(DF.catapult&&turretsSeen&&rnd()<.2)extra.push('catapult');if(rnd()<.15)extra.push('boomerang');
      const order=extra.filter(c=>canMake(pid,c)).concat(shuffle(['frigate','bomber','interceptor']).sort((a,b)=>s.hangar[b].length-s.hangar[a].length));
      const c=order.find(c=>canPayAt(pid,n.id,DR[c].cost)&&net-future>=DR[c].up);
      if(c){payAt(pid,n.id,DR[c].cost);s.queue.push(c);future+=DR[c].up;}
    }
    for(const c of SPACE){const need=c==='spy'?1:c==='repair'||c==='catapult'?2:3;if(s.hangar[c].length>=Math.min(need,capFor(pid,c))&&!leviHere(pid,n.id)){const k=Math.min(s.hangar[c].length,capFor(pid,c)-tileCount(pid,n.id,c));if(k>0)launchDrones(pid,c,n.id,s.hangar[c].splice(0,k));}}
  }
  for(const s of live(n,'rbarracks')){
    if(s.queue.length<2&&rnd()<DF.queue){
      const c=shuffle(['tank','tank','stomper','ballista']).find(c=>canPayAt(pid,n.id,DR[c].cost)&&net-future>=DR[c].up);
      if(c){payAt(pid,n.id,DR[c].cost);s.queue.push(c);future+=DR[c].up;}
    }
    for(const c of ROVERS)if(s.hangar[c].length>=Math.min(2,cap)&&!leviHere(pid,n.id)){const k=Math.min(s.hangar[c].length,cap-tileCount(pid,n.id,c));if(k>0)launchDrones(pid,c,n.id,s.hangar[c].splice(0,k));}
  }}
  // upgrade stations: dock a drone and upgrade it (ready next turn), and launch the ones that are done
  for(const n of G.nodes){if(n.owner!==pid)continue;for(const st of live(n,'upgrade')){
    for(const c of CLS){const ready=st.hangar[c].filter(d=>!d.upg);if(ready.length&&!leviHere(pid,n.id)){const k=Math.min(ready.length,capFor(pid,c)-tileCount(pid,n.id,c));if(k>0){const go=ready.slice(0,k);st.hangar[c]=st.hangar[c].filter(d=>!go.includes(d));launchDrones(pid,c,n.id,go);}}}
    if(!DF.upgrade)continue;
    const f=G.fleets.find(f=>f.owner===pid&&f.node===n.id&&!f.up&&!f.path.length&&dU(f.cls)&&dockKinds(st).includes(f.cls));
    if(f&&p.res.iron>=30&&RES.every(r=>p.res[r]>=(DR[f.cls].cost[r]||0)+8)){payAt(pid,n.id,DR[f.cls].cost);const d=takeDrone(f);d.upg=true;st.hangar[f.cls].push(d);}
  }}
  // death turrets fire at a neighbour full of enemies, never at their own units (each shot needs 10 Xenocrystal and 5 energy)
  for(const n of G.nodes){if(n.owner!==pid||p.res.xeno<10||p.energy<5)continue;for(const s of n.stations){
    if(s.type!=='death'||s.state!=='done'||s.charge>0||s.aim!=null)continue;
    let best=null,bs=3;
    for(const id of n.nbr){const t=G.nodes[id];
      if(t.owner===pid||G.fleets.some(f=>f.node===id&&f.owner===pid)||G.workers.some(w=>w.node===id&&w.owner===pid))continue;
      const sc=G.fleets.filter(f=>f.node===id&&f.cls!=='spy').reduce((a,f)=>a+f.count,0)+G.workers.filter(w=>w.node===id).length+(t.owner!=null?2*t.stations.filter(x=>x.state!=='destroyed').length:0);
      if(sc>bs){bs=sc;best=id;}}
    if(best!=null)s.aim=best;
  }}
  const V=vis(pid);
  // spies fly towards the nearest enemy core and watch it
  for(const f of G.fleets.filter(f=>f.owner===pid&&f.cls==='spy'&&!f.path.length)){
    const RS=routeSet(f,pid),d=distMap(f.node,RS);let tgt=null,bd=Infinity;
    for(const q of G.players)if(q.alive&&q.id!==pid&&RS.has(q.core)){const c=d.get(q.core);if(c!=null&&c<bd){bd=c;tgt=q.core;}}
    if(tgt==null){for(const [id,dd] of d)if(!p.explored.has(id)&&dd>0&&dd<bd){bd=dd+1;tgt=id;}}
    if(tgt!=null&&bd>1){const path=findPath(f.node,tgt,RS);if(path)f.path=path.slice(0,-1);}
  }
  const mine=G.fleets.filter(f=>f.owner===pid);
  for(const f of mine)for(const g of mine){if(f===g||f.hp<=0||g.hp<=0||f.cls!==g.cls||f.up!==g.up||f.node!==g.node||f.path.length||g.path.length||f.cls==='charger'||f.cls==='leviathan')continue;if(f.count+g.count>capFor(pid,f.cls))continue;mergeFleets(f,g);g.hp=0;}
  // drones with empty batteries blow up so the rest of their fleet can move again
  // a fleet that is completely empty and off the network can never recharge: scrap it
  G.fleets=G.fleets.filter(f=>!(f.owner===pid&&stuck(f)&&f.count===emptyDrones(f)&&!fleetOnGrid(f)));
  for(const f of G.fleets.filter(f=>f.owner===pid&&stuck(f)&&f.count>emptyDrones(f))){const k=emptyDrones(f),per=f.hp/f.count;f.en=f.en.filter(e=>e>0);f.count-=k;f.hp-=per*k;}
  const myF=G.fleets.filter(f=>f.owner===pid);
  // a leviathan counts as ten drones when deciding whether to attack
  const total=myF.filter(f=>DR[f.cls].dmg>0).reduce((a,f)=>a+(f.cls==='leviathan'?10:f.count),0);
  const threat=DF.react&&G.fleets.find(f=>f.owner!==pid&&f.cls!=='spy'&&V.has(f.node)&&(f.node===p.core||core.nbr.includes(f.node)));
  // fighting strength, roughly damage times health; for a tile, everything hostile to us that we can see there
  const pw=(dmg,hp)=>dmg*hp;
  const ownPower=id=>{let d=0,h=0;for(const f of G.fleets)if(f.owner===pid&&f.node===id&&f.cls!=='spy'){d+=DR[f.cls].dmg*poweredDrones(f);h+=f.hp;}return pw(d,h);};
  const enemyPower=id=>{let d=0,h=0;const n=G.nodes[id];
    for(const f of G.fleets)if(f.owner!==pid&&f.node===id&&f.cls!=='spy'&&V.has(id)){d+=DR[f.cls].dmg*poweredDrones(f);h+=f.hp;}
    if(n.owner!=null&&n.owner!==pid){for(const t of liveTurrets(n)){d+=ST[t.type].dmg||(t.type==='chain'?2:0);h+=t.hp;}if(n.type==='core'&&n.coreHp>0){d+=2;h+=n.coreHp;}}
    return pw(d,h);};
  const homeOf=f=>{const RS=routeSet(f,pid);const d=distMap(f.node,RS);let best=null,bd=Infinity;for(const [id,dd] of d)if(G.conn[pid].has(id)&&dd<bd&&!leviBlocks(f,id)){bd=dd;best=id;}return best;};
  // enough battery to get there (0.5 a turn off the network) with a point to spare
  const canReach=(f,path)=>{if(f.cls==='leviathan'||!path)return !!path;const off=path.filter(id=>!G.conn[pid].has(id)).length;const turns=Math.ceil(off/Math.max(1,DR[f.cls].spd));return Math.min(...f.en)>=turns*.5+1;};
  const nearestEnemy=(f,needTurret)=>{const RS=routeSet(f,pid),d=distMap(f.node,RS);let best=null,bd=Infinity;for(const [id,dd] of d){const m=G.nodes[id];if(m.owner!=null&&m.owner!==pid&&(!needTurret||liveTurrets(m).length)&&dd<bd){best=id;bd=dd;}}return best;};
  for(const f of myF){
    if(f.path.length||f.cls==='spy'||f.settled||stuck(f))continue;
    const n=G.nodes[f.node],RS=routeSet(f,pid);
    if(DR[f.cls].ground){aiRover(f,pid);continue;}
    // low batteries off the network: head home to recharge
    if(f.cls!=='leviathan'&&!fleetOnGrid(f)&&Math.min(...f.en)<=2){const h=homeOf(f);if(h!=null){f.path=findPath(f.node,h,RS)||[];f.bombard=null;}continue;}
    // a stronger enemy next door: fall back towards the core
    const danger=n.nbr.filter(id=>enemyPower(id)>ownPower(f.node)*1.2);
    if(danger.length&&f.node!==p.core&&f.cls!=='leviathan'){f.path=findPath(f.node,p.core,RS)||[];f.bombard=null;continue;}
    if(f.cls==='repair'){const lead=myF.filter(g=>g.cls!=='repair'&&g.cls!=='charger').sort((a,b)=>b.count-a.count)[0];if(lead&&lead.node!==f.node)f.path=findPath(f.node,lead.node,RS)||[];continue;}
    if(f.cls==='charger')continue;
    if(threat&&f.node!==p.core){f.path=findPath(f.node,p.core,RS)||[];f.bombard=null;continue;}
    if(f.cls==='catapult'){
      const t=nearestEnemy(f,true);if(t==null)continue;
      if(n.nbr.includes(t)){f.bombard=t;continue;}
      const path=findPath(f.node,t,RS);if(path&&path.length>1&&canReach(f,path))f.path=path.slice(0,-1);
      continue;
    }
    if(n.owner!=null&&n.owner!==pid)continue;
    if(threat||total<DF.attackAt)continue;
    // attack the nearest enemy tile we expect to beat; otherwise explore
    const d=distMap(f.node,RS);let t=null,bd=Infinity;
    for(const [id,dd] of d){const m=G.nodes[id];if(dd===0||dd>=bd)continue;
      const hostile=(m.owner!=null&&m.owner!==pid)||G.fleets.some(g=>g.owner!==pid&&g.node===id&&g.cls!=='spy'&&V.has(id));
      if(!hostile)continue;
      if(enemyPower(id)*1.4>=pw(myF.filter(g=>g.node===f.node&&g.cls!=='spy').reduce((a,g)=>a+DR[g.cls].dmg*poweredDrones(g),0),myF.filter(g=>g.node===f.node).reduce((a,g)=>a+g.hp,0)))continue;
      bd=dd;t=id;}
    if(t==null){for(const [id,dd] of d)if(!p.explored.has(id)&&dd>0&&dd<bd&&tileCount(pid,id,f.cls,f)+f.count<=capFor(pid,f.cls)){bd=dd;t=id;}}
    if(t!=null){const path=findPath(f.node,t,RS);if(canReach(f,path))f.path=path;}
  }
  // keep a planet centre clear of our fleets while our leviathan is being built on it
  for(const n of G.nodes)if(n.owner===pid&&n.stations.some(x=>x.type==='levi'))for(const f of G.fleets.filter(f=>f.owner===pid&&f.node===n.id&&!f.settled)){
    const to=n.nbr.find(id=>routeSet(f,pid).has(id)&&!G.fleets.some(g=>g.owner===pid&&g.node===id&&g.cls===f.cls));if(to!=null){f.path=[to];f.bombard=null;}}
  // workers keep away from enemy war fleets: on or next to one without an escort or a turret, they pull back
  const dangerW=new Set();for(const f of G.fleets)if(f.owner!==pid&&f.cls!=='spy'&&DR[f.cls].dmg>0&&V.has(f.node)){dangerW.add(f.node);if(!DR[f.cls].ground)for(const x of G.nodes[f.node].nbr)dangerW.add(x);}
  const guardedW=id=>G.fleets.some(f=>f.owner===pid&&f.node===id&&DR[f.cls].dmg>0)||(G.nodes[id].owner===pid&&armed(G.nodes[id]));
  for(const w of ws){
    const at=w.path.length?w.path[w.path.length-1]:w.node;
    if(!dangerW.has(at)||guardedW(at)||(w.task==='research'&&w.node===p.core))continue;
    const d=distMap(w.node,K);let best=null,bd=Infinity;
    for(const [id,dd] of d)if(!dangerW.has(id)&&G.conn[pid].has(id)&&dd<bd){bd=dd;best=id;}
    if(best==null)best=p.core;
    const path=best===w.node?[]:findPath(w.node,best,K);
    if(path){w.path=path;w.task='idle';w.then=null;w.ref=null;w.tech=null;}
  }
  const targeted=new Set(ws.filter(w=>w.then||w.path.length).map(w=>w.path.length?w.path[w.path.length-1]:w.node));
  const minedHere=id=>ws.some(w=>w.node===id&&(w.task==='mine'||(w.then&&w.then.task==='mine')));
  const researchers=ws.filter(w=>w.task==='research'||(w.then&&w.then.task==='research')).length;
  const send=(w,id,task,ref,tech)=>{if(dangerW.has(id)&&!guardedW(id))return false;if(w.node===id){w.task=task;w.ref=ref??null;w.tech=tech||null;w.then=null;w.path=[];}else{const path=findPath(w.node,id,K);if(!path)return false;w.path=path;w.task='idle';w.then={task,ref:ref??null,tech:tech||null};}targeted.add(id);return true;};
  const miningOf=r=>ws.some(w=>(w.task==='mine'&&G.nodes[w.node].res===r)||(w.then&&w.then.task==='mine'&&G.nodes[w.path.at(-1)??w.node].res===r));
  const scarce=['iron','copper','silicon'].find(r=>p.res[r]<12&&!miningOf(r));
  if(scarce&&!ws.some(w=>w.task==='idle'&&!w.path.length)){
    const rich=ws.filter(w=>w.task==='mine'&&!w.path.length).sort((a,b)=>p.res[G.nodes[b.node].res]-p.res[G.nodes[a.node].res])[0];
    if(rich&&p.res[G.nodes[rich.node].res]>(DF.reserve<10?18:40))rich.task='idle';
  }
  // stop mining resources that are already full
  for(const w of ws)if(w.task==='mine'&&!G.nodes[w.node].center&&resTotal(p)>=resCap(pid))w.task='idle';
  // conquest: claim every reachable planet centre and keep one worker mining stargold on each one we own
  for(const pl of G.planets||[]){
    const c=G.nodes[pl.center];
    if(!K.has(c.id)||targeted.has(c.id)||warFleetsAt(pid,c.id).length)continue;
    const mining=ws.some(w=>(w.node===c.id&&w.task==='mine')||(w.then&&w.then.task==='mine'&&w.path.at(-1)===c.id));
    if(c.owner===pid&&mining)continue;
    if(c.owner!=null&&c.owner!==pid)continue;
    const d=distMap(c.id,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research'&&!(G.nodes[w.node].center&&w.task==='mine')).sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=12)send(w,c.id,c.owner===pid?'mine':'claim');
  }
  // link owned planet centres to the core network by claiming the free tiles on the shortest route
  for(const pl of G.planets||[]){
    const c=G.nodes[pl.center];if(c.owner!==pid||conn.has(c.id))continue;
    const route=findPath(p.core,c.id,new Set(G.nodes.filter(n=>K.has(n.id)&&(n.owner==null||n.owner===pid)).map(n=>n.id)));if(!route)continue;
    const gap=route.find(id=>G.nodes[id].owner==null&&!targeted.has(id)&&!warFleetsAt(pid,id).length);if(gap==null)continue;
    const d=distMap(gap,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research'&&!(G.nodes[w.node].center&&w.task==='mine')).sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=10)send(w,gap,'claim');
  }
  // pull the nearest worker off its job to claim a fallen core within 8 hops
  for(const n of G.nodes){
    if(n.type!=='deadcore'||!K.has(n.id)||targeted.has(n.id)||warFleetsAt(pid,n.id).length)continue;
    const d=distMap(n.id,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research').sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=8)send(w,n.id,'claim');
  }
  const idle=ws.filter(w=>!w.path.length&&!w.then&&(w.task==='idle'||w.task==='claim')&&rnd()<DF.think);
  // a planned build site needs a worker standing on it before the station can be started
  if(p.aiGo!=null){
    const g=p.aiGo;
    if(ws.some(w=>w.node===g&&!w.path.length)||G.nodes[g].owner!==pid)p.aiGo=null;
    else if(!targeted.has(g)){
      const d=distMap(g,K);
      const pool=idle.length?idle:ws.filter(w=>!w.path.length&&!w.then&&w.task==='mine');
      const w=pool.sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
      if(w&&send(w,g,'idle')){const k=idle.indexOf(w);if(k>=0)idle.splice(k,1);}
    }
  }
  if(researchers<(G.turn>=12?DF.research:1)&&G.turn>=DF.resAt){const t=aiNextTech(p);const w=t&&(idle.shift()||null);if(w)send(w,p.core,'research',null,t);}
  for(const {n,s} of unfinished){while(idle.length&&buildersOn(s.uid)<s.work){if(!send(idle.shift(),n.id,'build',s.uid))break;}}
  for(const n of G.nodes){if(n.owner!==pid)continue;for(const s of n.stations)if(s.state==='destroyed'&&idle.length&&!ws.some(w=>w.ref===s.uid||(w.then&&w.then.ref===s.uid)))send(idle.shift(),n.id,'fix',s.uid);}
  for(const w of idle){
    if(rnd()<DF.idle)continue;
    const d=distMap(w.node,K);
    let best=null,bd=Infinity,task=null;
    for(const [id,dd] of distMap(w.node,K)){
      const n=G.nodes[id];
      if(n.owner!=null&&n.owner!==pid&&(n.type==='res'||n.type==='empty'||n.type==='captured')&&!liveTurrets(n).length&&G.fleets.some(f=>f.node===id&&f.owner===pid&&DR[f.cls].dmg>0)&&!warFleetsAt(pid,id).length&&dd<bd){best=id;bd=dd;task='claim';}
      // a fallen core is a prize: claim it before anyone else does
      if(n.type==='deadcore'&&!warFleetsAt(pid,id).length&&!targeted.has(id)&&dd-6<bd){best=id;bd=dd-6;task='claim';}
    }
    if(best==null)for(const [id,dd] of d){
      const n=G.nodes[id];if(!n.res||targeted.has(id)||warFleetsAt(pid,id).length)continue;
      const full=resTotal(p)>=resCap(pid);
      const dw=dd+(full?6:p.res[n.res]<12?-4:p.res[n.res]<25?-1.5:0);
      if(n.owner===pid&&!minedHere(id)&&dw<bd){best=id;bd=dw;task='mine';}
      else if(n.owner==null&&dw+.5<bd){best=id;bd=dw+.5;task='claim';}
    }
    const guarded=id=>{const m=G.nodes[id];return m.owner!=null&&m.owner!==pid&&liveTurrets(m).length>0;};
    if(best==null)for(const [id,dd] of d){if(!p.explored.has(id)&&!targeted.has(id)&&!guarded(id)&&dd<bd){best=id;bd=dd;task='idle';}}
    if(best!=null)send(w,best,task);
  }
}

/* ---------- player orders ---------- */
const humanWorkersAt=(id,pid=ME)=>G.workers.filter(w=>w.owner===pid&&w.node===id);
function setTask(w,task,ref){w.path=[];w.then=null;w.task=task;w.ref=ref??null;if(task!=='research')w.tech=null;}
function startStation(pid,nid,type){
  const n=G.nodes[nid];if(!n||!ST[type])return false;
  const why=canBuild(pid,n,type);if(why)return deny(why);
  const ws=humanWorkersAt(nid,pid).filter(w=>!w.path.length);if(!ws.length)return deny(L('You need a worker on this asteroid to build.','Для строительства нужен рабочий на этом астероиде.'));
  const pc=stCost(pid,type);payAt(pid,nid,pc);if(ST[type].gold)P(pid).gold-=ST[type].gold;const s=newStation(n,type,{paid:pc,gold:ST[type].gold||0});n.stations.push(s);
  setTask(ws.find(w=>w.task==='idle')||ws[0],'build',s.uid);
  toast(L(`${sN(type)} started.`,`Стройка начата: ${sN(type)}.`));
  return true;
}
// rovers can only travel across the tiles of the planet they are on
function groundSet(id){const pl=G.nodes[id].planet;return new Set(pl==null?[id]:G.planets[pl].ids);}
// tiles a fleet may route through: known tiles; planets only with Planet movement (rovers stay on their planet);
// and never through a tile where it would end up next to its own leviathan (or, for a leviathan, its own fleets)
const routeSet=(f,pid)=>{const k=known(pid);let r;
  if(!DR[f.cls].ground){r=f.cls==='leviathan'||has(pid,'planetmove')?k:new Set([...k].filter(x=>x===f.node||G.nodes[x].planet==null));}
  else{const g=groundSet(f.node);r=new Set([...g].filter(x=>k.has(x)||P(pid).ai));}
  return new Set([...r].filter(x=>x===f.node||!leviBlocks(f,x)));};
// a route traced by hand: each tile next to the one before, no tile twice, only tiles in `allowed`
function checkPath(from,path,allowed){
  if(!Array.isArray(path)||!path.length||path.length>60)return null;
  let cur=from;const seen=new Set([from]),out=[];
  for(const x of path){const id=+x;if(!G.nodes[id]||!G.nodes[cur].nbr.includes(id)||seen.has(id)||(allowed&&!allowed.has(id)))return null;seen.add(id);out.push(id);cur=id;}
  return out;
}
function orderFleetMove(f,id,manual){
  const pid=f.owner;if(!G.nodes[id])return false;f.sync=null;
  if(DR[f.cls].ground&&!groundSet(f.node).has(id))return deny(L('Rovers cannot leave their planet.','Роверы не могут покинуть свою планету.'));
  const path=manual?checkPath(f.node,manual,routeSet(f,pid)):findPath(f.node,id,routeSet(f,pid));
  if(!path||(manual&&path[path.length-1]!==id))return deny(L('No known route to that asteroid.','Нет известного пути к этому астероиду.'));
  if(id!==f.node&&leviBlocks(f,id))return deny(f.cls==='leviathan'?L("Your leviathan can't share a tile with your other fleets.",'Левиафан не может стоять на одной клетке с вашими флотами.'):L("Your fleets can't share a tile with your leviathan.",'Ваши флоты не могут стоять на одной клетке с левиафаном.'));
  if(id!==f.node&&tileCount(pid,id,f.cls,f)+f.count>capFor(pid,f.cls))return deny(L(`That asteroid can hold only ${tileCap(pid)} of your ${dCount(2,f.cls).replace(/^\d+ /,'')}. Split the fleet first.`,`На этом астероиде поместится не больше: ${dCount(tileCap(pid),f.cls)}. Сначала разделите флот.`));
  f.path=path;f.bombard=null;f.mergeInto=null;return true;
}
function orderMerge(pid,srcId,tgtId){
  const s=G.fleets.find(f=>f.id===srcId&&f.owner===pid),t=G.fleets.find(f=>f.id===tgtId&&f.owner===pid);
  if(!s||!t||s===t)return false;
  if(s.cls!==t.cls)return deny(L('Only fleets of the same drone type can merge.','Объединять можно только флоты одного типа.'));
  if(s.up!==t.up)return deny(L('Upgraded drones cannot merge with regular ones.','Улучшенные дроны нельзя объединить с обычными.'));
  if(s.node===t.node){mergeFleets(t,s);toast(L(`${dN(t.cls)} fleets merged: ${t.count} drones.`,`Флоты объединены: ${dCount(t.count,t.cls)}.`));return true;}
  const path=findPath(s.node,t.node,routeSet(s,pid));if(!path)return deny(L('No known route to that fleet.','Нет известного пути к этому флоту.'));
  if(tileCount(pid,t.node,t.cls,s)+s.count>tileCap(pid))return deny(L(`Merging would put more than ${tileCap(pid)} ${dCount(2,t.cls).replace(/^\d+ /,'')} on one asteroid. Split the fleet first.`,`После объединения на астероиде будет больше ${tileCap(pid)}. Сначала разделите флот.`));
  s.path=path;s.bombard=null;s.mergeInto=t.id;
  toast(L(`The fleet will fly ${plural(path.length,'hop')} and merge on arrival.`,`Флот пролетит ${cnt(path.length,'hop')} и объединится на месте.`));
  return true;
}
function upgradeOne(f){
  const n=G.nodes[f.node],pid=f.owner,human=pid===ME&&!REPLAY;
  if(f.up||!dU(f.cls))return false;
  if(!live(n,'upgrade').length||n.owner!==pid)return human?deny(L('Fleets can only be upgraded on an asteroid with your upgrade station.','Улучшать флоты можно только на астероиде с вашей станцией улучшений.')):false;
  if(!canPayAt(pid,n.id,DR[f.cls].cost))return human?deny(L('Not enough resources for the upgrade.','Не хватает ресурсов на улучшение.')):false;
  payAt(pid,n.id,DR[f.cls].cost);
  const per=f.hp/f.count;
  let u=G.fleets.find(g=>g.owner===pid&&g.node===f.node&&g.cls===f.cls&&g.up&&!g.path.length);
  if(!u){u=newFleet(pid,f.cls,0,f.node,true);u.hp=0;G.fleets.push(u);}
  u.count+=1;u.hp+=per;u.en.push(f.en.length?f.en.pop():BATT);f.count-=1;f.hp-=per;
  if(f.count<=0)G.fleets=G.fleets.filter(g=>g!==f);
  if(human)toast(L(`One ${dN(f.cls).toLowerCase()} upgraded.`,`Улучшен один дрон: ${dN(f.cls)}.`));
  return true;
}

/* ---------- orders as messages (online play) ---------- */
// Every change a player makes to the match goes through order(). It is applied at once on this screen and,
// online, also recorded. When everyone has ended the turn, each screen rewinds to the start of the turn,
// replays every player's orders in seat order, then resolves. Same start + same orders + same seed = same match.
function applyCmd(pid,c){
  const p=P(pid);if(!p||!c||(!p.alive&&c.t!=='resign'))return false;
  const Wk=id=>G.workers.find(w=>w.id===+id&&w.owner===pid),F=id=>G.fleets.find(f=>f.id===+id&&f.owner===pid);
  const S=uid=>{const f=findStation(+uid);return f&&f.n.owner===pid?f:null;};
  switch(c.t){
    case 'research':{const w=Wk(c.w),t=c.tech;if(!w||!TECH[t]||!techOpen(p,TECH[t])||w.node!==p.core||w.path.length)return false;
      if(researchersOn(pid,t,w)>=techLeft(p,t))return deny(L('Enough workers are already researching this.','Это уже исследует достаточно рабочих.'));
      setTask(w,'research');w.tech=t;return true;}
    case 'task':{const w=Wk(c.w);if(!w||!['idle','mine','claim','build','fix'].includes(c.task))return false;
      if(c.task==='build'){const f=S(c.ref);if(!f)return false;if(buildersOn(f.s.uid,w)>=f.s.work)return deny(L('Enough workers are already building this.','Это уже строит достаточно рабочих.'));}
      setTask(w,c.task,c.task==='build'||c.task==='fix'?+c.ref:null);return true;}
    case 'wtech':{const w=Wk(c.w);if(!w)return false;w.tech=TECH[c.tech]?c.tech:null;return true;}
    case 'wmove':{const w=Wk(c.w);if(!w||!G.nodes[c.to])return false;const path=c.path?checkPath(w.node,c.path,known(pid)):findPath(w.node,+c.to,known(pid));
      if(!path)return deny(L('No known route to that asteroid.','Нет известного пути к этому астероиду.'));
      w.path=path;w.task='idle';w.ref=null;w.then=null;w.tech=null;return true;}
    case 'freew':if(p.freeOffer&&!p.workerQueue){p.workerQueue++;p.freeQ++;p.freeOffer=false;return true;}return false;
    case 'hire':{const c2=workerCost(p);if(workerTotal(p)<12&&canPayAt(pid,p.core,c2)){payAt(pid,p.core,c2);p.workerQueue++;return true;}return false;}
    case 'trade':{
      if(!has(pid,'trade')||!RES.includes(c.give)||!RES.includes(c.get))return false;
      if((c.give==='xeno'||c.get==='xeno')&&!has(pid,'xtrade'))return false;
      const [give,get]=has(pid,'rates')?[4,3]:[3,2];
      if(c.give===c.get)return deny(L('Pick two different resources.','Выберите два разных ресурса.'));
      if(p.res[c.give]<give)return deny(L(`You need ${give} ${rN(c.give)} to trade.`,`Для обмена нужно ${give} ед. (${lc(rN(c.give))}).`));
      p.res[c.give]-=give;if(addRes(p,c.get,get)<get)toast(L('Part of the trade was lost: your storage is full.','Часть обмена потеряна: хранилище заполнено.'),true);return true;}
    case 'fmove':{const f=F(c.f);if(!f)return false;if(f.settled)return deny(L('The charger is settled. Stand it up first.','Зарядчик сидит. Сначала поднимите его.'));if(stuck(f))return deny(L(`${plural(emptyDrones(f),'drone')} in this fleet ${emptyDrones(f)>1?'have':'has'} no energy, so the fleet can't move. Bring it back to your network, or blow up the empty drones.`,`В этом флоте без энергии: ${cnt(emptyDrones(f),'drone')}. Флот не может двигаться. Верните его в сеть или взорвите пустые дроны.`));return orderFleetMove(f,+c.to,c.path);}
    case 'bomb':{const f=F(c.f);if(!f||!ARTY(f.cls))return false;if(stuck(f))return deny(L("Drones in this fleet have no energy, so it can't fire.",'В этом флоте есть дроны без энергии, он не может стрелять.'));if(!G.nodes[f.node].nbr.includes(+c.to))return deny(L('Artillery can only fire at a neighbouring tile.','Артиллерия стреляет только по соседней клетке.'));
      f.bombard=+c.to;f.keep=!!c.keep;f.path=[];f.mergeInto=null;return true;}
    case 'fstop':{const f=F(c.f);if(!f)return false;f.path=[];f.bombard=null;f.mergeInto=null;return true;}
    case 'merge':return orderMerge(pid,+c.src,+c.tgt);
    case 'split':{const f=F(c.f),k=Math.floor(+c.k);if(!f||!(k>=1&&k<f.count))return false;
      const ph=f.hp/f.count,g=newFleet(pid,f.cls,k,f.node,f.up);g.hp=ph*k;g.en=f.en.splice(f.en.length-k,k);f.hp-=ph*k;f.count-=k;G.fleets.push(g);return true;}
    case 'disf':{const f=F(c.f);if(!f)return false;const n=G.nodes[f.node];if(n.owner!==pid||!live(n,DR[f.cls].ground?'rbarracks':'kazarm').length)return false;
      const r=oneEach(DR[f.cls].cost);for(const k in r)r[k]*=f.count;refundAt(pid,f.node,r);G.fleets=G.fleets.filter(g=>g!==f);return true;}
    case 'build':return startStation(pid,+c.n,c.type);
    case 'stcancel':{const f=S(c.s);if(!f||f.s.state!=='build')return false;refundAt(pid,f.n.id,f.s.paid||ST[f.s.type].cost);p.gold+=f.s.gold||0;f.n.stations=f.n.stations.filter(x=>x!==f.s);G.workers.forEach(w=>{if(w.ref===f.s.uid){w.task='idle';w.ref=null;}});return true;}
    case 'stdis':{const f=S(c.s);if(!f||f.s.state==='build')return false;refundAt(pid,f.n.id,oneEach(ST[f.s.type].cost));f.n.stations=f.n.stations.filter(x=>x!==f.s);G.workers.forEach(w=>{if(w.ref===f.s.uid){w.task='idle';w.ref=null;}});return true;}
    case 'aim':{const f=S(c.s);if(!f||f.s.type!=='death'||f.s.state!=='done'||f.s.charge>0)return false;
      if(!f.n.nbr.includes(+c.to))return deny(L('The death turret can only hit an asteroid 1 hop away.','Турель смерти бьёт только по астероиду в 1 прыжке.'));f.s.aim=+c.to;return true;}
    case 'unaim':{const f=S(c.s);if(!f)return false;f.s.aim=null;return true;}
    case 'queue':{const f=S(c.s);if(!f||f.s.state!=='done'||!DR[c.c])return false;
      const ok=(f.s.type==='rbarracks'?ROVERS.includes(c.c):f.s.type==='kazarm'?SPACE.includes(c.c):false)&&canMake(pid,c.c);
      if(!ok||!canPayAt(pid,f.n.id,DR[c.c].cost))return false;payAt(pid,f.n.id,DR[c.c].cost);f.s.queue.push(c.c);return true;}
    case 'unqueue':{const f=S(c.s);if(!f)return false;const x=f.s.queue.splice(+c.i,1)[0];if(!x)return false;refundAt(pid,f.n.id,DR[x].cost);return true;}
    case 'launch':{
      // c.s = station uid, or c.ch = settled charger; c.c = type; c.i = which docked drone, or -1 for all of that type
      let list,node;
      if(c.ch!=null){const ch=F(c.ch);if(!ch||ch.cls!=='charger')return false;list=(ch.dock||[]).filter(d=>d.c===c.c);node=ch.node;}
      else{const f=S(c.s);if(!f||!DR[c.c]||f.s.state!=='done')return false;list=f.s.hangar[c.c]||[];node=f.n.id;}
      if(leviHere(pid,node))return deny(L('Nothing can launch while your leviathan stands on this tile.','Нельзя выпускать, пока на этой клетке стоит ваш левиафан.'));
      let pick=(+c.i<0?list:[list[+c.i]]).filter(d=>d&&!d.upg);
      const room=capFor(pid,c.c)-tileCount(pid,node,c.c);
      if(!pick.length)return false;
      if(room<=0)return deny(L(`This tile already holds ${capFor(pid,c.c)} of your ${dCount(2,c.c).replace(/^\d+ /,'')}. Move them out first.`,`На этой клетке уже ${dCount(capFor(pid,c.c),c.c)}. Сначала уведите их.`));
      pick=pick.slice(0,room);
      if(c.ch!=null){const ch=F(c.ch);ch.dock=ch.dock.filter(d=>!pick.includes(d));}
      else{const f=S(c.s);f.s.hangar[c.c]=f.s.hangar[c.c].filter(d=>!pick.includes(d));}
      launchDrones(pid,c.c,node,pick);
      toast(L(`${dCount(pick.length,c.c)} launched.`,`Выпущено: ${dCount(pick.length,c.c)}.`));return true;}
    case 'dockone':{
      const f=F(c.f);if(!f||f.cls==='leviathan'||f.settled)return false;
      if(c.ch!=null){const ch=F(c.ch);if(!ch||ch.cls!=='charger'||!ch.settled||ch.node!==f.node||f.cls==='charger')return false;(ch.dock=ch.dock||[]).push({c:f.cls,...takeDrone(f)});return true;}
      const st=S(c.s);if(!st||st.s.state!=='done'||st.n.id!==f.node||!dockKinds(st.s).includes(f.cls))return false;
      st.s.hangar[f.cls].push(takeDrone(f));return true;}
    case 'upgrade':{
      const st=S(c.s);if(!st||st.s.type!=='upgrade'||st.s.state!=='done'||!DR[c.c]||!dU(c.c))return false;
      const d=st.s.hangar[c.c].find(d=>!d.up&&!d.upg);if(!d)return deny(L('Dock a drone of this type here first.','Сначала пристыкуйте сюда дрона этого типа.'));
      if(!canPayAt(pid,st.n.id,DR[c.c].cost))return deny(L('Not enough resources for the upgrade.','Не хватает ресурсов на улучшение.'));
      payAt(pid,st.n.id,DR[c.c].cost);d.upg=true;st.s.last=c.c;return true;}
    case 'loopq':p.loopQ=!!c.v;return true;
    case 'squad':{
      const ids=[...new Set((c.ids||[]).map(Number))].filter(id=>F(id));if(ids.length<2)return false;
      p.squads=(p.squads||[]).map(q=>({...q,ids:q.ids.filter(x=>!ids.includes(x))})).filter(q=>q.ids.length>1);
      p.sqN=(p.sqN||0)+1;p.squads.push({id:p.sqN,ids});return true;}
    case 'squaddel':p.squads=(p.squads||[]).filter(q=>q.id!==+c.q);return true;
    case 'squadmove':{
      const q=(p.squads||[]).find(q=>q.id===+c.q);if(!q)return false;
      const fl=q.ids.map(F).filter(f=>f&&!f.settled);const to=+c.to;if(!fl.length||!G.nodes[to])return false;
      if(fl.some(stuck))return deny(L("Some fleets in this squadron have drones with no energy, so the squadron can't move.",'В эскадрилье есть флоты с дронами без энергии, она не может двигаться.'));
      const by={};for(const f of fl)if(f.node!==to)by[f.cls]=(by[f.cls]||0)+f.count;
      for(const cl in by){const there=G.fleets.filter(g=>g.owner===pid&&g.node===to&&g.cls===cl&&!fl.includes(g)).reduce((a,g)=>a+g.count,0);
        if(there+by[cl]>capFor(pid,cl))return deny(L(`That tile can't hold that many ${dCount(2,cl).replace(/^\d+ /,'')}.`,`На этой клетке не поместится столько: ${dN(cl)}.`));}

function previewBattle(f,to){

    const n=G.nodes[to],enemyW=G.workers.filter(w=>w.node===to&&w.owner!==ME).length;

  // a worker can't claim an asteroid while one of its owner's workers stands on it
  const guarded=n.owner!=null&&n.owner!==ME&&G.workers.some(x=>x.node===n.id&&x.owner===n.owner);
  if(here&&n.owner!==ME&&n.type!=='core'&&n.type!=='wreck')b.push(btn('wtask',L('Claim','Захватить'),`data-t="claim" title="${guarded?L("The owner's worker is here","Здесь рабочий владельца"):''}"`,w.task==='claim'||guarded));
  if(here&&n.id===p.core)b.push(btn('wresearch',w.task==='research'&&w.tech?L('Research: ','Исследует: ')+esc(tN(w.tech)):L('Research…','Исследовать…')));
  if(here&&n.owner===ME){
    for(const s of n.stations.filter(s=>s.state==='build')){const on=w.task==='build'&&w.ref===s.uid;if(!on&&buildersOn(s.uid,w)>=s.work)continue;b.push(btn('wbuild',L('Build ','Строить: ')+lc(sN(s.type)),`data-s="${s.uid}"`,on));}
    for(const s of n.stations.filter(s=>s.state==='destroyed')){const on=w.task==='fix'&&w.ref===s.uid;const taken=!on&&G.workers.some(x=>x!==w&&x.task==='fix'&&x.ref===s.uid);b.push(btn('wfix',L('Repair ','Чинить: ')+lc(sN(s.type)),`data-s="${s.uid}"`,on||taken));}
  }
  b.push(btn('wmove',L('Move','Лететь')));
  if(workerBusy(w))b.push(btn('wtask',L('Stop','Стоп'),'data-t="idle"',false,'quiet'));
  return b.join('');
}

function buildHtml(n){

  for(const [k,s] of Object.entries(ST)){

  const Wk=id=>G.workers.find(w=>w.id===+id),F=id=>G.fleets.find(f=>f.id===+id),S=uid=>findStation(+uid);
  switch(a){
    case 'close':closeModal();return;
    case 'cancel':cancelMode();return;
    case 'open':G.modal&&G.modal.type===d.m?closeModal():openModal({type:d.m});return;
    case 'openst':openModal({type:'station',uid:+d.s});return;
    case 'gonode':G.sel=+d.n;centerOn(G.nodes[+d.n],false);openModal({type:'node',id:+d.n});return;
    case 'dinfo':G.popup={type:'drone',c:d.c};G.popupAt=performance.now();break;
    case 'pclose':G.popup=null;break;
    case 'sqmake':{if(G.popup&&G.popup.type==='squad'&&order({t:'squad',ids:G.popup.ids}))toast(L('Squadron made. Find it in the Empire menu.','Эскадрилья создана. Она в меню «Империя».'));G.popup=null;break;}
    case 'sqmove':{closeModal();const q=(P(ME).squads||[]).find(q=>q.id===+d.q);const f=q&&q.ids.map(id=>G.fleets.find(f=>f.id===id)).find(Boolean);if(f){G.moveMode={squad:q.id,u:{},mode:'move',from:f.node};refresh();}return;}
    case 'sqsee':G.squadOpen=G.squadOpen===+d.q?null:+d.q;break;
    case 'sqdel':order({t:'squaddel',q:+d.q});break;

    case 'wresearch':{const w=Wk(d.w);G.techFor=w?w.id:null;G.techSel=w&&w.task==='research'&&w.tech?w.tech:G.techSel;openModal({type:'tech'});return;}
    case 'tadd':{

      const w=researchCandidates(t)[0];if(!w){deny(L('Only workers standing at your core can research.','Исследовать могут только рабочие в ядре.'));break;}
      if(!order({t:'research',w:w.id,tech:t}))break;if(G.techFor===w.id)G.techFor=null;toast(L(`${w.name} is researching ${tN(t)}.`,`${w.name} исследует: ${tN(t)}.`));break;
    }
    case 'trem':{const t=G.techSel;const w=G.workers.filter(x=>x.owner===ME&&x.task==='research'&&x.tech===t).pop();if(w&&order({t:'task',w:w.id,task:'idle'})){toast(L(`${w.name} stopped researching.`,`${w.name} прекратил исследование.`));}break;}
    case 'freew':{if(order({t:'freew'})){toast(L('A free worker will leave your core at the end of this turn.','Бесплатный рабочий покинет ядро в конце хода.'));}break;}
    case 'wtask':order({t:'task',w:+d.w,task:d.t});break;
    case 'wbuild':order({t:'task',w:+d.w,task:'build',ref:+d.s});break;
    case 'wfix':order({t:'task',w:+d.w,task:'fix',ref:+d.s});break;
    case 'wmove':{const w=Wk(d.w);if(w){closeModal();selectUnit(w);}return;}
    case 'fmove':{const f=F(d.f);if(f){closeModal();selectUnit(f);}return;}
    case 'fbomb':{const f=F(d.f);if(f){closeModal();G.moveMode={u:f,mode:'bombard',from:f.node};refresh();}return;}
    case 'fstop':order({t:'fstop',f:+d.f});break;
    case 'fsplit':{const f=F(d.f);if(f)G.splitOpen=G.splitOpen===f.id?null:f.id;break;}
    case 'fsplitgo':{
      const f=F(d.f),k=+($('#splitN')||{}).value;
      if(f&&order({t:'split',f:f.id,k})){G.splitOpen=null;toast(L(`Split into ${f.count} and ${k}.`,`Разделено на ${f.count} и ${k}.`));}
      break;
    }
    case 'fdock':order({t:'dock',f:+d.f});break;
    case 'fdis':{const f=F(d.f);if(!f||!order({t:'disf',f:f.id}))break;toast(L(`${dCount(f.count,f.cls)} disassembled.`,`Разобрано: ${dCount(f.count,f.cls)}.`));break;}
    case 'fupg':order({t:'upg',f:+d.f});break;
    case 'start':order({t:'build',n:G.sel,type:d.t});break;
    case 'stcancel':{const f=S(d.s);if(f&&order({t:'stcancel',s:f.s.uid})){toast(L('Build cancelled; full cost refunded.','Стройка отменена, стоимость возвращена.'));openModal({type:'node',id:f.n.id});return;}break;}
    case 'stdis':{const f=S(d.s);if(f&&order({t:'stdis',s:f.s.uid})){toast(L(`${sN(f.s.type)} disassembled.`,`Разобрано: ${sN(f.s.type)}.`));openModal({type:'node',id:f.n.id});return;}break;}
    case 'aim':{const f=S(d.s);if(f){closeModal();G.moveMode={mode:'aim',s:f.s,from:f.n.id,u:{}};refresh();}return;}
    case 'unaim':order({t:'unaim',s:+d.s});break;
    case 'kbuild':order({t:'queue',s:+d.s,c:d.c});break;
    case 'kcancel':order({t:'unqueue',s:+d.s,i:+d.i});break;
    case 'hangar':G.popup={type:'hangar',c:d.c,s:d.s!=null?+d.s:null,ch:d.ch!=null?+d.ch:null};G.popupAt=performance.now();break;
    case 'hlaunch':{order({t:'launch',c:d.c,i:+d.i,s:d.s!=null?+d.s:undefined,ch:d.ch!=null?+d.ch:undefined});if(+d.i<0)G.popup=null;break;}
    case 'dockone':order({t:'dockone',f:+d.f,s:d.s!=null?+d.s:undefined,ch:d.ch!=null?+d.ch:undefined});break;
    case 'kupg':order({t:'upgrade',s:+d.s,c:d.c});break;
    case 'bar':order({t:'barrier',s:+d.s,on:d.v==='1'});break;
    case 'fsettle1':order({t:'settle',f:+d.f,v:true});break;
    case 'fsettle0':order({t:'settle',f:+d.f,v:false});break;
    case 'fboom':order({t:'selfdestruct',f:+d.f});break;
    case 'hire':order({t:'hire'});break;
    case 'trade':order({t:'trade',give:G.trade.give,get:G.trade.get});break;
  }
  refresh();
}

function endTurn(auto){
  if(!G||(G.over&&!G.spectate))return;
  if(G.online&&(G.waiting||(!P(ME).alive&&humansLeft())))return;
  const pending=G.workers.filter(w=>w.owner===ME&&w.task==='research'&&!w.tech&&!w.path.length);
  if(pending.length){
    if(!auto){
      sfxError();
      G.notice=L(`You can't end the turn yet: ${pending.map(w=>w.name).join(', ')} ${pending.length===1?'is':'are'} set to Research without a tech. Pick a tech for ${pending.length===1?'it':'each one'}, or give ${pending.length===1?'it':'them'} another order.`,`Нельзя завершить ход: у ${pending.map(w=>w.name).join(', ')} не выбрана технология для исследования. Выберите технологию или дайте другой приказ.`);
      openModal({type:'report'});return;
    }
    pending.forEach(w=>order({t:'task',w:w.id,task:'idle'}));
  }
  const clash=leviClashes(ME);
  if(clash.length){
    if(!auto){sfxError();G.notice=L(`You can't end the turn like this: a leviathan would be finished at ${clash.map(n=>lc(nodeName(n))).join(', ')}, where your fleets are or are heading. Move the fleets elsewhere, or stop the build.`,`Нельзя так завершить ход: левиафан достроится на ${clash.map(n=>lc(nodeName(n))).join(', ')}, где стоят или куда летят ваши флоты. Уведите флоты или остановите стройку.`);openModal({type:'report'});return;}
    // the timer ran out: the build is cancelled and the stargold comes back
    for(const n of clash)for(const st of n.stations.filter(x=>x.type==='levi'))order({t:'stcancel',s:st.uid});
  }
  if(G.online){submitTurn();return;}
  G.moveMode=null;G.hoverPath=null;G.splitOpen=null;
  sfxTurn();resolve();
  afterResolve();
}
// planet centres where your leviathan would be finished this turn while your fleets stand there or are flying there
function leviClashes(pid){
  const out=[];
  for(const n of G.nodes)for(const st of n.stations){
    if(st.type!=='levi'||n.owner!==pid||st.state!=='build')continue;
    if(buildersOn(st.uid)<st.work)continue;
    if(G.fleets.some(f=>f.owner===pid&&!(f.cls==='charger'&&f.settled)&&(f.node===n.id&&!f.path.length||f.path[f.path.length-1]===n.id)))out.push(n);
  }
  return out;
}

/* ---------- online play: connection to the game server ---------- */
// The server only relays orders between players; every screen runs the match itself (see applyCmd).
// Where the server lives: ?server=wss://... in the page address wins; a page served by the game server itself
// (your PC, or the hosting service) talks to that same address; anything else (itch.io) uses DEFAULT_SERVER.
const DEFAULT_SERVER='wss://jopium-server.onrender.com';
const SERVER_URL=(()=>{
  try{const q=new URLSearchParams(location.search).get('server');if(q)return q;}catch(e){}
  const h=location.hostname||'';
  if(/^(localhost|127\.0\.0\.1|\[::1\])$/.test(h)||h.endsWith('.onrender.com')||h.endsWith('.fly.dev')||h.endsWith('.up.railway.app'))
    return (location.protocol==='https:'?'wss://':'ws://')+location.host;
  return DEFAULT_SERVER;
})();
const PIC_OK=/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/;
let LOBBY=null,LOBBIES=null,netError='';
const Net={
  ws:null,ready:false,queue:[],
  connect(){
    if(this.ws)return;
    let ws;try{ws=new WebSocket(SERVER_URL);}catch(e){netError=L("Can't reach the game server.",'Не удаётся связаться с игровым сервером.');onNetClose();return;}
    this.ws=ws;netError='';
    ws.onopen=()=>{this.ready=true;this.raw({t:'hello',name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:'',ver:GAME_VERSION});for(const m of this.queue.splice(0))this.raw(m);};
    ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}onNet(m);};
    ws.onclose=()=>{const was=this.ready;this.ready=false;this.ws=null;this.queue=[];if(!was&&!netError)netError=L("Can't reach the game server. Check your internet connection and try again.",'Не удаётся связаться с игровым сервером. Проверьте подключение к интернету и попробуйте снова.');onNetClose();};
  },
  raw(m){try{this.ws.send(JSON.stringify(m));}catch(e){}},
  send(m){if(this.ready)this.raw(m);else{this.queue.push(m);this.connect();}},
  leaveRoom(){if(this.ready)this.raw({t:'leave'});LOBBY=null;}
};
function onNetClose(){
  if(G&&G.online&&!G.over){G.waiting=true;G.notice=L('Connection to the game server was lost. This match cannot continue; open the game menu to leave.','Связь с игровым сервером потеряна. Матч не может продолжиться; откройте меню игры, чтобы выйти.');toast(L('Connection lost.','Связь потеряна.'),true);openModal({type:'report'});refresh();return;}
  if(LOBBY){LOBBY=null;showMenu('play');}
  const v=ov.dataset.view;
  if(!G&&(v==='join'||v==='play'||v==='host'))showMenu(v);
}
function onNet(m){
  switch(m.t){
    case 'lobbies':LOBBIES=m.list||[];if(!G&&ov.dataset.view==='join')showMenu('join');break;
    case 'lobby':{const same=LOBBY&&LOBBY.code===m.room.code;LOBBY=m.room;if(G)break;if(same&&ov.dataset.view==='lobby')renderLobbyParts();else showMenu('lobby');break;}
    case 'closed':LOBBY=null;if(!G){showMenu('play');toast(m.msg||L('The lobby was closed.','Лобби закрыто.'),true);}break;
    case 'error':toast(m.msg||L('Something went wrong.','Что-то пошло не так.'),true);if(!G&&ov.dataset.view==='join')showMenu('join');break;
    case 'start':
      LOBBY=null;
      newGame({mode:m.opts.mode,per:m.opts.per,timer:m.opts.timer,diff:'normal',online:{seed:m.seed,seats:m.seats,you:m.you,room:m.code}});
      toast(L('Match started. Good luck!','Матч начался. Удачи!'));
      break;
    case 'progress':if(G&&G.online){G.waitInfo=`${m.done}/${m.need}`;renderTop();}break;
    case 'turn':onlineTurn(m);break;
    case 'desync':if(G&&G.online)toast(L(`Warning: players' games went out of sync on turn ${m.turn}. Please report this.`,`Внимание: игры игроков рассинхронизировались на ходу ${m.turn}. Сообщите об этом.`),true);break;
  }
}
// send this turn's orders and wait for everyone else
function submitTurn(){
  if(!G||!G.online||G.waiting)return;
  G.waiting=true;G.waitInfo='';G.moveMode=null;G.hoverPath=null;G.splitOpen=null;
  Net.send({t:'end',turn:G.turn,cmds:myCmds});
  refresh();
}
// everyone has ended the turn: rewind to the start of the turn, replay all orders in seat order, then resolve
function onlineTurn(m){
  if(!G||!G.online||!SNAP||m.turn!==G.turn)return;
  restoreSnapshot();
  REPLAY=true;
  try{for(let pid=0;pid<G.players.length;pid++)for(const c of (m.cmds[pid]||[])){try{applyCmd(pid,c);}catch(e){console.warn('Jopium: order failed',c,e);}}}
  finally{REPLAY=false;}
  const gone=(m.dropped||[]).map(pid=>G.players[pid]).filter(q=>q&&!q.ai);
  gone.forEach(q=>{q.ai=true;});
  myCmds=[];G.waiting=false;G.waitInfo='';
  sfxTurn();resolve();
  for(const q of gone)log(L(`${pShort(q)} left the match; an AI took over their empire.`,`${pShort(q)} покинул матч, его империей теперь управляет ИИ.`),'warn',null,G.players.map(x=>x.id));
  takeSnapshot();
  Net.send({t:'hash',turn:m.turn,h:stateHash()});
  afterResolve();
  // out of the match: keep watching without holding up the people still playing.
  // Once no person is left in the match, nobody is waiting: watchers step through turns with Next turn.
  if(!P(ME).alive&&humansLeft()){G.waiting=true;Net.send({t:'end',turn:G.turn,cmds:[]});refresh();}
}
// is any person (not an AI) still playing?
const humansLeft=()=>G.players.some(p=>p.human&&!p.ai&&p.alive)&&G.players.filter(p=>p.alive).length>1;
function resignOnline(){
  if(!P(ME).alive)return;
  G.iResigned=true;
  if(G.waiting)Net.send({t:'resign',turn:G.turn});
  else{order({t:'resign'});G.waiting=false;submitTurn();}
  toast(L('You resigned. The match ends for you when this turn resolves.','Вы сдались. Матч для вас закончится, когда этот ход завершится.'));
}

function joinHtml(){
  let list;

const hostOpts={name:'',mode:'warfare',per:20,opp:3,timer:45};
const keepLobbyName=()=>{const el=$('#lobbyIn');if(el)hostOpts.name=el.value.trim();};
// waiting-room animation: a small ship cruising through stars that rush towards the screen
let lobbyAnim=null;
function startLobbyAnim(){
  const cv=$('#lobbycv');if(!cv)return;
  const d=Math.min(1.5,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;cv.width=w*d;cv.height=h*d;
  const x=cv.getContext('2d');x.setTransform(d,0,0,d,0,0);
  const pts=Array.from({length:140},()=>({x:Math.random()*2-1,y:Math.random()*2-1,z:Math.random(),a:Math.random()*.5+.15}));
  const me={};lobbyAnim=me;let last=performance.now();
  const frame=now=>{
    if(lobbyAnim!==me||!document.body.contains(cv))return;
    const dt=Math.min(.05,(now-last)/1000);last=now;
    x.fillStyle='#060911';x.fillRect(0,0,w,h);
    const cx=w/2,cy=h/2;
    for(const p of pts){
      p.z-=dt*.28;if(p.z<=.02){p.x=Math.random()*2-1;p.y=Math.random()*2-1;p.z=1;}
      const k=.35/p.z,sx=cx+p.x*k*w*.5,sy=cy+p.y*k*h*.5;
      if(sx<0||sy<0||sx>w||sy>h){p.z=1;p.x=Math.random()*2-1;p.y=Math.random()*2-1;continue;}
      const r=Math.min(2.2,(1-p.z)*2+.2);
      x.fillStyle=`rgba(200,215,255,${Math.min(1,p.a*(1.4-p.z))})`;x.fillRect(sx,sy,r,r);
    }
    // the ship: a minimal outline with a flickering engine, bobbing gently
    const bob=Math.sin(now/600)*3,sxp=cx,syp=cy+bob;
    x.save();x.translate(sxp,syp);const shipK=Math.max(1,Math.min(w,h)/260);x.scale(shipK,shipK);
    const fl=10+Math.sin(now/45)*3;
    const g=x.createRadialGradient(0,20,0,0,20,fl+6);g.addColorStop(0,'rgba(120,190,255,.9)');g.addColorStop(1,'rgba(77,163,255,0)');
    x.fillStyle=g;x.beginPath();x.ellipse(0,22,6,fl,0,0,Math.PI*2);x.fill();
    x.beginPath();x.moveTo(0,-22);x.lineTo(13,14);x.lineTo(5,10);x.lineTo(0,16);x.lineTo(-5,10);x.lineTo(-13,14);x.closePath();
    x.fillStyle='rgba(77,163,255,.18)';x.fill();x.strokeStyle='#4da3ff';x.lineWidth=1.8;x.lineJoin='round';x.stroke();
    x.beginPath();x.arc(0,-6,3,0,Math.PI*2);x.strokeStyle='#dde6f5';x.lineWidth=1.2;x.stroke();
    x.restore();
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
}
document.addEventListener('change',e=>{
  if(e.target.id==='picIn'&&e.target.files[0]){
    const fr=new FileReader();
    fr.onload=()=>{const im=new Image();im.onload=()=>{
      // square crop, 128 px, small enough to keep on the device
      const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d');
      const m=Math.min(im.width,im.height);x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,128,128);
      profile.pic=c.toDataURL('image/jpeg',.85);saveProfile();showMenu('profile');
    };im.src=fr.result;};
    fr.readAsDataURL(e.target.files[0]);
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='nameIn'){profile.name=e.target.value.trim().slice(0,18)||'Player';saveProfile();}
  if(e.target.id==='hperR'){hostOpts.per=+e.target.value;$('#hperV').textContent=e.target.value;}
});
function endGame(result){
  G.over=true;G.result=result;G.moveMode=null;
  // after a defeat (or resigning) the whole map opens up and you can keep pressing Next turn to watch the AIs
  if(result!=='won'){G.spectate=true;if(result==='resigned'&&P(ME).alive){coreFall(G.nodes[P(ME).core]);}}
  if(result==='resigned')log(L('You resigned.','Вы сдались.'),'battle',null,[0]);
  closeModal();refresh();showEnd();
}
function showEnd(){
  const r=G.result;
  const gw=G.winner!=null&&G.mode==='conquest'&&P(G.winner).gold>=GOLD_WIN?P(G.winner):null;
  const title=r==='won'?(gw?L('Stargold secured','Звёздное золото добыто'):L('Belt secured','Пояс ваш')):r==='lost'?(gw?L(`${pShort(gw)} wins`,`Победа: ${pShort(gw)}`):L('Core lost','Ядро потеряно')):L('You resigned','Вы сдались');
  const text=r==='won'?(gw?L(`You mined ${gw.gold} stargold on turn ${G.turn-1}.`,`Вы добыли ${gw.gold} звёздного золота на ходу ${G.turn-1}.`):L(`Every rival has been shut down. You control the belt after ${G.turn-1} turns.`,`Все соперники отключены. За ${cnt(G.turn-1,'turn')} вы взяли пояс под контроль.`)):r==='lost'?(gw?L(`${pName(gw)} reached ${GOLD_WIN} stargold on turn ${G.turn-1}.`,`${pName(gw)} набрал ${GOLD_WIN} звёздного золота на ходу ${G.turn-1}.`):L(`Your core was destroyed on turn ${G.turn-1}.`,`Ваше ядро уничтожено на ходу ${G.turn-1}.`)):L(`You left the match on turn ${G.turn}.`,`Вы покинули матч на ходу ${G.turn}.`);
  ov.hidden=false;ov.className='dim';ov.dataset.view='end';
  requestAnimationFrame(()=>fitText(ov));
  ov.innerHTML=`<div class="card"><button class="x" type="button" data-a="e-close" aria-label="${L('Close and watch the map','Закрыть и смотреть карту')}">✕</button><h1>${title}</h1><p>${text}</p><div class="opts">${G.online?'':`<button class="btn primary" type="button" data-a="e-next">${L('Next game','Следующая игра')}</button>`}${G.spectate&&!gw&&G.players.filter(p=>p.alive).length>1?`<button class="btn" type="button" data-a="e-close">${G.online?L('Keep watching','Смотреть дальше'):L('Watch the AIs','Смотреть за ИИ')}</button>`:''}<button class="btn" type="button" data-a="e-menu">${L('Back to menu','В меню')}</button></div></div>`;
}
ov.addEventListener('click',e=>{if(e.target===ov&&ov.dataset.view==='end'){sfxClick();closeOverlay();}});
function menuAct(a,d){
  switch(a){
    case 'm-play':showMenu('play');break;
    case 'm-host':showMenu('host');break;
    case 'm-join':LOBBIES=null;netError='';showMenu('join');Net.send({t:'list'});break;
    case 'm-board':showMenu('board');break;
    case 'm-profile':showMenu('profile');break;
    case 'm-pic':{const f=$('#picIn');if(f)f.click();break;}
    case 'm-picdel':profile.pic='';saveProfile();showMenu('profile');break;
    case 'h-mode':hostOpts.mode=d.v;keepLobbyName();showMenu('host');break;
    case 'h-opp':hostOpts.opp=+d.v;keepLobbyName();showMenu('host');break;
    case 'h-timer':hostOpts.timer=+d.v;keepLobbyName();showMenu('host');break;
    case 'h-go':keepLobbyName();LOBBY=null;netError='';showMenu('lobby');
      Net.send({t:'host',who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''},name:hostOpts.name||L(`${profile.name}'s lobby`,`Лобби ${profile.name}`),mode:hostOpts.mode,per:hostOpts.per,opp:hostOpts.opp,timer:hostOpts.timer});break;
    case 'm-leave':Net.leaveRoom();showMenu('main');break;
    case 'l-start':Net.send({t:'start'});break;
    case 'j-go':Net.send({t:'join',code:d.c,who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''}});break;
    case 'j-code':{const v=(($('#codeIn')||{}).value||'').trim().toUpperCase();if(v)Net.send({t:'join',code:v,who:{name:profile.name,pic:PIC_OK.test(profile.pic)?profile.pic:''}});break;}
    case 'j-refresh':LOBBIES=null;netError='';showMenu('join');Net.send({t:'list'});break;
    case 'm-setup':showMenu('setup');break;
    case 'm-settings':menuFrom='main';showMenu('settings');break;
    case 'm-main':showMenu('main');break;
    case 'm-back':if(menuFrom==='game'&&G)closeOverlay();else showMenu('main');break;
    case 'm-close':gameClosed=true;try{window.close();}catch(e){}showMenu('closed');break;
    case 'm-reopen':gameClosed=false;audioInit();showMenu('main');break;
    case 's-bots':setupOpts.bots=+d.v;showMenu('setup');break;
    case 's-timer':setupOpts.timer=+d.v;showMenu('setup');break;
    case 's-mode':setupOpts.mode=d.v;showMenu('setup');break;
    case 's-loop':settings.loopQ=!settings.loopQ;saveSettings();showMenu('settings');if(G&&P(ME).alive)order({t:'loopq',v:settings.loopQ});break;
    case 's-fire':settings.keepFire=!settings.keepFire;saveSettings();showMenu('settings');break;
    case 's-lang':settings.lang=d.v==='ru'?'ru':'en';saveSettings();document.documentElement.lang=settings.lang;showMenu('settings');if(G){renderTop();refresh();}break;
    case 's-diff':setupOpts.diff=d.v;showMenu('setup');break;
    case 's-go':newGame({...setupOpts});break;
    case 'e-close':closeOverlay();break;
    case 'e-next':newGame({...setupOpts});break;
    case 'e-menu':leaveGame();showMenu('main');break;
  }
}

$('#ver').textContent=GAME_VERSION;
resize();showMenu('main');if(document.fonts)document.fonts.ready.then(()=>{fitText(ov);if(G)refresh();});requestAnimationFrame(draw);
