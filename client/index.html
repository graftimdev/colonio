<style>
/* Layout: full-screen tactical map with a slim top bar, a dock of icon buttons on the right and modal sheets for every menu. Deliberately single dark theme (deep space). */
:root{

/* tech web */

.web svg{position:absolute;inset:0;width:100%;height:100%}
.tn{position:absolute;transform:translate(-50%,-50%);width:14%;aspect-ratio:1;border-radius:50%;border:2px solid #39486a;background:#0f1628;color:var(--muted);font:600 clamp(8px,1.7vw,11px)/1.15 var(--f-display);letter-spacing:.02em;display:grid;place-items:center;text-align:center;padding:4px;box-sizing:border-box}
.tn.avail{border-color:var(--accent);color:var(--fg)}

'use strict';
const $=s=>document.querySelector(s);
// longer Russian words never stretch a button or wrap it onto two lines: the text shrinks a little until it fits
function fitText(root){
  if(!root)return;
  for(const el of root.querySelectorAll('.btn,.seg button,.dname,h3,#hint span')){
    if(el.offsetParent===null)continue;
    el.style.fontSize='';
    const cs=getComputedStyle(el),room=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const rg=document.createRange();rg.selectNodeContents(el);
    let fs=parseFloat(cs.fontSize),min=Math.max(8,fs*.7);
    while(rg.getBoundingClientRect().width>room-.5&&fs>min){fs-=.5;el.style.fontSize=fs+'px';}
  }
}

function musicTick(){
  const now=performance.now(),dt=Math.min(.25,(now-musicLast)/1000);musicLast=now;
  const want=gameClosed||pageHidden||settings.music<=0?null:G?'game':'menu';
  if(curTrack&&curTrack.name!==want){curTrack.target=0;curTrack.rate=1/2;if(curTrack.g<=0){curTrack.el.pause();curTrack=null;}}
  if(!curTrack&&want){curTrack=TRACKS[want];curTrack.g=0;try{curTrack.el.currentTime=0;}catch(e){}curTrack.el.play().catch(()=>{});}
  if(curTrack&&curTrack.name===want){
    const el=curTrack.el,left=(el.duration||Infinity)-el.currentTime;
    curTrack.rate=1/1.5;curTrack.target=left<1.5?0:1;
    if(el.paused&&audioReady)el.play().catch(()=>{});
  }
  for(const t of Object.values(TRACKS)){
    if(t.g<t.target)t.g=Math.min(t.target,t.g+t.rate*dt);else if(t.g>t.target)t.g=Math.max(t.target,t.g-t.rate*dt);
    t.el.volume=Math.max(0,Math.min(1,t.g*settings.music*duck));
  }
}

function tone(type,f0,f1,dur,vol,delay){
  if(!AC||settings.sfx<=0)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain(),f=AC.createBiquadFilter();
  o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  f.type='lowpass';f.frequency.value=1800;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol*settings.sfx,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(f).connect(g).connect(AC.destination);o.start(t);o.stop(t+dur+.03);
}

}

/* ---------- map ---------- */
const key=(q,r)=>q+','+r;
// target share of nodes by neighbour count (1..6): 3 and 4 common, 2 and 5 rare, 1 and 6 very rare
const DEG_TARGET=[0,.03,.12,.35,.35,.12,.03];
function growShape(target){
  // branching growth that favours cells touching 2-3 existing ones, so the map sprawls into
  // arms, thin chains and clumps with gaps, instead of one round blob
  const cells=new Map([[key(0,0),{q:0,r:0}]]);
  const nCount=(q,r)=>DIRS.reduce((a,[x,y])=>a+(cells.has(key(q+x,r+y))?1:0),0);
  const WK=[0,.8,1.8,.8,.2,.06,.03];
  const front=new Map();
  const addFront=(q,r)=>{for(const [x,y] of DIRS){const k=key(q+x,r+y);if(!cells.has(k))front.set(k,{q:q+x,r:r+y});}};
  addFront(0,0);
  while(cells.size<target){
    const list=[...front.values()];let tot=0;
    const w=list.map(c=>{const v=WK[nCount(c.q,c.r)]*(.4+rnd());tot+=v;return v;});
    let pick=rnd()*tot,i=0;while(i<w.length-1&&pick>w[i]){pick-=w[i];i++;}
    const c=list[i];const k=key(c.q,c.r);cells.set(k,c);front.delete(k);addFront(c.q,c.r);
  }
  return cells;
}
function degScore(cells){
  const h=[0,0,0,0,0,0,0];
  for(const {q,r} of cells.values())h[DIRS.reduce((a,[x,y])=>a+(cells.has(key(q+x,r+y))?1:0),0)]++;
  return h.reduce((a,v,i)=>a+Math.abs(v/cells.size-DEG_TARGET[i])*(i===1||i===6?2:1),0);
}
// conquest planets: 7 tiles each (a centre and 6 sections around it)
const PLANETS=[
  {name:'Stormus',r:'Стормус',c:'#c4483c',c2:'#7a1f1a',kind:'cracks'},
  {name:'Aqua',r:'Аква',c:'#3b8fd8',c2:'#164a85',kind:'bands'},
  {name:'Tauron',r:'Таурон',c:'#8d5f3c',c2:'#4a2d18',kind:'rift'},
  {name:'Regium',r:'Региум',c:'#9298a3',c2:'#4d525c',kind:'craters'},
  {name:'Urum',r:'Урум',c:'#4ea95c',c2:'#1f5b2b',kind:'patches'}
];
const GOLD_WIN=100;
const hexDist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;
// a jagged line across the planet, in ring-radius units around its centre
function jag(x0,y0,x1,y1,n,amp){const pts=[[x0,y0]];for(let i=1;i<n;i++){const t=i/n;pts.push([x0+(x1-x0)*t+(rnd()-.5)*amp,y0+(y1-y0)*t+(rnd()-.5)*amp]);}pts.push([x1,y1]);return pts;}
function planetLook(kind){
  const outline=[];for(let i=0;i<36;i++)outline.push(1.5+.1*Math.sin(i*.9+rnd())+rnd()*.06);
  const f={outline,lines:[],dots:[],blobs:[]};
  const rp=()=>{const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*1.15;return [Math.cos(a)*r,Math.sin(a)*r];};
  if(kind==='cracks')for(let i=0;i<6;i++){const [x,y]=rp(),a=rnd()*Math.PI*2,l=.4+rnd()*.5;f.lines.push({w:1.4,pts:jag(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l,5,.12)});}
  if(kind==='rift'){const a=rnd()*Math.PI;f.lines.push({w:4,pts:jag(-Math.cos(a)*1.3,-Math.sin(a)*1.3,Math.cos(a)*1.3,Math.sin(a)*1.3,9,.22)});}
  if(kind==='craters')for(let i=0;i<10;i++){const [x,y]=rp();f.dots.push([x,y,.07+rnd()*.13]);}
  if(kind==='bands')for(let i=0;i<4;i++)f.blobs.push([(rnd()-.5)*1.4,-1+i*.6+rnd()*.2,.9+rnd()*.4,.12+rnd()*.08]);
  if(kind==='patches')for(let i=0;i<7;i++){const [x,y]=rp();f.blobs.push([x,y,.18+rnd()*.22,.14+rnd()*.14]);}
  return f;
}
function genMap(np,per,mode){
  const nPl=Math.min(5,np-1),target=per*np+np;
  for(let attempt=0;attempt<60;attempt++){
    // make many candidate shapes and keep the one closest to the target neighbour-count spread
    let cells=null,best=Infinity;
    for(let t=0;t<24;t++){const c=growShape(target+7*nPl);const s=degScore(c);if(s<best){best=s;cells=c;}}
    // planets: pick well-spread centres and complete the ring of 6 sections around each
    const plan=[];
    if(nPl){
      const filled=c=>DIRS.reduce((a,[x,y])=>a+(cells.has(key(c.q+x,c.r+y))?1:0),0);
      const cand=shuffle([...cells.values()]).sort((a,b)=>filled(b)-filled(a));
      for(const c of cand){
        if(plan.length===nPl)break;
        if(plan.some(p=>hexDist(p,c)<5))continue;
        plan.push(c);
      }
      if(plan.length<nPl)continue;
      for(const c of plan)for(const [x,y] of DIRS){const k=key(c.q+x,c.r+y);if(!cells.has(k))cells.set(k,{q:c.q+x,r:c.r+y});}
      // planets never count as asteroids: trim or grow the free cells until exactly target remain
      const pk=new Set();for(const c of plan){pk.add(key(c.q,c.r));for(const [x,y] of DIRS)pk.add(key(c.q+x,c.r+y));}
      const nb=(q,r)=>DIRS.map(([x,y])=>key(q+x,r+y)).filter(k=>cells.has(k));
      const connected=()=>{const first=cells.keys().next().value;const seen=new Set([first]);const st=[first];while(st.length){const k=st.pop();const c=cells.get(k);for(const m of nb(c.q,c.r))if(!seen.has(m)){seen.add(m);st.push(m);}}return seen.size===cells.size;};
      let free=cells.size-pk.size,guard=0;
      while(free>target&&guard++<4000){
        const cand=shuffle([...cells.keys()].filter(k=>!pk.has(k))).sort((a,b)=>nb(cells.get(a).q,cells.get(a).r).length-nb(cells.get(b).q,cells.get(b).r).length);
        let done=false;
        for(const k of cand.slice(0,12)){const c=cells.get(k);cells.delete(k);if(connected()){done=true;free--;break;}cells.set(k,c);}
        if(!done)break;
      }
      while(free<target&&guard++<8000){
        const fr=[];for(const c of cells.values())for(const [x,y] of DIRS){const k=key(c.q+x,c.r+y);if(!cells.has(k))fr.push({q:c.q+x,r:c.r+y});}
        const c=fr[Math.floor(rnd()*fr.length)];cells.set(key(c.q,c.r),c);free++;
      }
      if(free!==target)continue;
    }
    const nodes=[];const idx=new Map();
    for(const [k,{q,r}] of cells){const n={id:nodes.length,q,r,x:R*(q+r/2),y:R*(SQ3/2)*r,nbr:[],type:'empty',res:null,owner:null,coreOf:null,coreHp:0,stations:[],store:{},estore:0,cut:0,planet:null,center:false};n.shape=Array.from({length:7},()=>.75+rnd()*.45);idx.set(k,n.id);nodes.push(n);}
    for(const n of nodes)for(const [a,b] of DIRS){const k=key(n.q+a,n.r+b);if(idx.has(k))n.nbr.push(idx.get(k));}
    const looks=shuffle([0,1,2,3,4]).slice(0,nPl);
    const planets=plan.map((c,i)=>{
      const ci=idx.get(key(c.q,c.r));const ids=[ci,...DIRS.map(([x,y])=>idx.get(key(c.q+x,c.r+y)))];
      ids.forEach(id=>{const n=nodes[id];n.type='planet';n.planet=i;n.center=id===ci;});
      return {...PLANETS[looks[i]],center:ci,ids,look:planetLook(PLANETS[looks[i]].kind)};
    });
    const hops=from=>{const d=new Map([[from,0]]);const q=[from];while(q.length){const id=q.shift();for(const nb of nodes[id].nbr)if(!d.has(nb)){d.set(nb,d.get(id)+1);q.push(nb);}}return d;};
    const plD=planets.map(pl=>hops(pl.center));
    // cores: random asteroids at least 3 hops from each other and from planet centres, never on a dead end
    let cores=[];
    const coreOk=n=>n.nbr.length>=3&&n.planet==null&&plD.every(d=>d.get(n.id)>=3);
    const nearPl=id=>Math.min(...plD.map(d=>d.get(id)??99));
    for(let tries=0;tries<(nPl?60:1);tries++){
      cores=[];
      for(const n of shuffle(nodes.filter(coreOk))){
        if(cores.length===np)break;
        const d=hops(n.id);if(cores.every(c=>d.get(c)>=3))cores.push(n.id);
      }
      if(cores.length<np)break;
      if(!nPl)break;
      const ds=cores.map(nearPl);if(Math.max(...ds)-Math.min(...ds)<=1)break;
      cores=[];
    }
    if(cores.length<np)continue;
    const near=new Set();cores.forEach(c=>nodes[c].nbr.forEach(x=>near.add(x)));
    const free=nodes.filter(n=>!cores.includes(n.id)&&n.planet==null);
    const xenoN=Math.max(np,Math.round(free.length*.1));
    // crystal asteroids are never next to each other
    const xenoSpots=[];
    for(const n of shuffle(free.filter(n=>!near.has(n.id)))){if(xenoSpots.length>=xenoN)break;if(n.nbr.some(x=>nodes[x].res==='xeno'))continue;n.type='res';n.res='xeno';xenoSpots.push(n);}
    const rest=shuffle(free.filter(n=>n.res!=='xeno'));
    const empties=Math.round(free.length*.25);
    rest.forEach((n,i)=>{if(i<empties){n.type='empty';n.res=null;}else{n.type='res';n.res=['iron','copper','silicon'][i%3];}});
    cores.forEach((c,pid)=>{
      const core=nodes[c];core.type='core';core.coreOf=pid;core.owner=pid;core.coreHp=CORE_HP;
      // fairness: every core gets iron and copper within 2 hops
      const d=hops(c);
      for(const r of ['iron','copper']){
        if([...d].some(([id,h])=>h>0&&h<=2&&nodes[id].res===r))continue;
        const cand=shuffle([...d].filter(([id,h])=>h>0&&h<=2&&!cores.includes(id)&&nodes[id].planet==null&&nodes[id].res!=='xeno'&&nodes[id].res!==(r==='iron'?'copper':'iron')).map(([id])=>nodes[id]));
        if(cand[0]){cand[0].type='res';cand[0].res=r;}
      }
      // every core starts with at least one iron, copper or silicon asteroid right next to it
      const basic=x=>['iron','copper','silicon'].includes(nodes[x].res);
      if(!core.nbr.some(basic)){
        const cand=shuffle(core.nbr.filter(x=>!cores.includes(x)&&nodes[x].planet==null&&nodes[x].res!=='xeno').map(x=>nodes[x]));
        if(cand[0]){cand[0].type='res';cand[0].res=['iron','copper','silicon'][Math.floor(rnd()*3)];}
      }
    });
    // a core never touches a planet tile
    if(cores.some(c=>nodes[c].nbr.some(x=>nodes[x].planet!=null)))continue;
    return {nodes,cores,planets};
  }
  throw new Error('Could not build a map');
}

// every worker gets a name no other living worker on the map is using
function freshName(){
  const used=new Set(G.workers.map(w=>w.name));
  while(G.names.length){const n=G.names.pop();if(!used.has(n))return n;}
  const free=shuffle(NAMES.filter(n=>!used.has(n)));if(free.length)return free[0];
  for(let k=2;;k++){const n=NAMES.find(b=>!used.has(b+' '+k));if(n)return n+' '+k;}
}

function explore(pid,id){const p=P(pid);p.explored.add(id);if(has(pid,'deepscan'))G.nodes[id].nbr.forEach(x=>p.explored.add(x));}
function distMap(from,allowed,maxD){const d=new Map([[from,0]]);const q=[from];while(q.length){const id=q.shift();if(maxD!=null&&d.get(id)>=maxD)continue;for(const nb of G.nodes[id].nbr){if(d.has(nb)||(allowed&&!allowed.has(nb)))continue;d.set(nb,d.get(id)+1);q.push(nb);}}return d;}
function fleetSight(pid){const s=new Set();for(const f of G.fleets)if(f.owner===pid)distMap(f.node,null,f.cls==='spy'?2:1).forEach((d,id)=>s.add(id));return s;}
function vis(pid){if(pid===ME&&G.spectate)return new Set(G.nodes.map(n=>n.id));const p=P(pid);const s=new Set(p.explored);p.explored.forEach(id=>G.nodes[id].nbr.forEach(x=>s.add(x)));fleetSight(pid).forEach(id=>s.add(id));
  for(const q of G.players)if(q.alive&&atPeace(pid,q.id)){s.add(q.core);G.nodes[q.core].nbr.forEach(x=>s.add(x));}
  return s;}
const known=vis;
// a settled, upgraded charger on an unclaimed tile links that tile into its owner's network
const chargerLink=(pid,id)=>G.nodes[id].owner==null&&G.fleets.some(f=>f.owner===pid&&f.cls==='charger'&&f.up&&f.settled&&f.node===id);
function bfsOwned(pid,start){const s=new Set([start]);const q=[start];while(q.length){const id=q.shift();for(const nb of G.nodes[id].nbr)if(!s.has(nb)&&(G.nodes[nb].owner===pid||chargerLink(pid,nb))){s.add(nb);q.push(nb);}}return s;}
function connSet(pid){const p=P(pid);if(!p.alive)return new Set();return bfsOwned(pid,p.core);}
function findPath(from,to,allowed){
  if(from===to)return [];
  const prev=new Map([[from,-1]]);const q=[from];
  while(q.length){const id=q.shift();if(id===to)break;for(const nb of G.nodes[id].nbr){if(prev.has(nb))continue;if(allowed&&!allowed.has(nb))continue;prev.set(nb,id);q.push(nb);}}
  if(!prev.has(to))return null;
  const path=[];let c=to;while(c!==from){path.unshift(c);c=prev.get(c);}return path;
}
const tileCap=pid=>has(pid,'fleet10')?10:6;
function tileCount(pid,node,cls,ex){let k=0;for(const f of G.fleets)if(f.owner===pid&&f.node===node&&f.cls===cls&&f!==ex)k+=f.count;return k;}
const live=(n,t)=>n.stations.filter(s=>s.state==='done'&&s.type===t);
const liveTurrets=n=>n.stations.filter(s=>s.state==='done'&&isTurret(s.type)&&s.hp>0);
function armed(n){return (n.type==='core'&&n.coreHp>0)||liveTurrets(n).some(s=>s.type!=='death');}
const warFleetsAt=(pid,id)=>G.fleets.filter(f=>f.node===id&&isFoe(pid,f.owner)&&f.cls!=='spy');
function hostileAt(pid,id){const n=G.nodes[id];return warFleetsAt(pid,id).length>0||(isFoe(pid,n.owner)&&armed(n));}
const enemyXray=(pid,id)=>{const n=G.nodes[id];return isFoe(pid,n.owner)&&live(n,'xray').some(s=>s.hp>0);};
function findStation(uid){for(const n of G.nodes)for(const s of n.stations)if(s.uid===uid)return {n,s};return null;}
function nodeName(n){
  const sh=q=>pShort(P(q));
  if(n.type==='core')return n.coreOf===ME?L('Your core','Ваше ядро'):L(sh(n.coreOf)+' core','Ядро '+sh(n.coreOf));
  if(n.type==='wreck')return L('Core wreck','Обломки ядра');
  if(n.type==='deadcore')return L('Fallen '+sh(n.coreOf)+' core','Павшее ядро '+sh(n.coreOf));
  if(n.type==='captured')return L('Captured '+sh(n.coreOf)+' core','Захваченное ядро '+sh(n.coreOf));
  if(n.planet!=null){const pl=G.planets[n.planet];return RU()?(n.center?'Центр планеты ':'Участок планеты ')+pl.r:pl.name+(n.center?' centre':' section');}
  if(n.res)return L(RINFO[n.res].n+' asteroid',RINFO[n.res].ra+' астероид');
  return L('Empty asteroid','Пустой астероид');
}
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function log(text,kind,node,pids){G.log.push({text,kind,node:node??null,pids:pids||[]});}

/* ---------- economy ---------- */
// Draft 9: the core holds 100 resources in total; each storage adds 30 and a captured core adds 100
function sharedCap(pid){let k=0;for(const id of G.conn[pid]||[]){const n=G.nodes[id];k+=30*live(n,'storage').length+(n.type==='captured'?100:0);}return k;}
const resTotal=p=>RES.reduce((a,r)=>a+p.res[r],0);
const resCap=pid=>BASE_RES+sharedCap(pid);
const overflow=p=>Math.max(0,resTotal(p)-resCap(p.id));
function addRes(p,r,amt){const room=Math.max(0,resCap(p.id)-resTotal(p));const a=Math.max(0,Math.min(amt,room));p.res[r]+=a;return a;}
function clipRes(p){const lost={};let over=resTotal(p)-resCap(p.id);while(over>0){const r=RES.reduce((a,b)=>p.res[a]>=p.res[b]?a:b);p.res[r]--;lost[r]=(lost[r]||0)+1;over--;}return lost;}
function energyCap(pid){let c=BASE_ENERGY;for(const id of G.conn[pid]||[])c+=30*live(G.nodes[id],'estorage').length;return c;}
// the core makes 10, each generator 5 and each captured core 10
function energyProd(pid){if(!P(pid).alive)return 0;let e=10;for(const id of G.conn[pid]||[]){const n=G.nodes[id];e+=5*live(n,'generator').length+(n.type==='captured'?10:0);}return e;}
// energy one drone of this squadron uses a turn: 0.5, or 1 for a war drone on a planet tile; leviathans and settled chargers use none
const droneUse=f=>f.cls==='leviathan'||f.settled||(f.cls==='tank'&&f.up&&!G.nodes[f.node].center&&!f.path.length&&!(f.trail&&f.trail.length>1))?0:(!DR[f.cls].ground&&G.nodes[f.node].planet!=null?1:.5);
// squadrons on their owner's connected network are powered by the core; spies always are
// at peace, two players' networks link where their tiles are one hop apart, so squadrons on a partner's network stay powered
const peaceLinked=(a,b)=>atPeace(a,b)&&G.conn[a]&&G.conn[b]&&[...G.conn[a]].some(id=>G.nodes[id].nbr.some(x=>G.conn[b].has(x)));
const fleetOnGrid=f=>f.cls==='spy'||(G.conn[f.owner]&&G.conn[f.owner].has(f.node))||(G.peace||[]).some(x=>{const q=x.a===f.owner?x.b:x.b===f.owner?x.a:null;return q!=null&&G.conn[q]&&G.conn[q].has(f.node)&&peaceLinked(f.owner,q);});
const emptyDrones=f=>(f.en||[]).filter(e=>e<=0).length;
const poweredDrones=f=>f.cls==='leviathan'?f.count:f.count-emptyDrones(f);
// a squadron with an empty drone can't move or fire until it is recharged, or the empty drones blow themselves up
const stuck=f=>f.cls!=='leviathan'&&emptyDrones(f)>0;
const avgEn=f=>f.en&&f.en.length?Math.round(f.en.reduce((a,e)=>a+e,0)/f.en.length*10)/10:0;
function energyUse(pid){
  let u=0;const conn=G.conn[pid];
  for(const f of G.fleets)if(f.owner===pid&&fleetOnGrid(f))u+=droneUse(f)*f.count;
  for(const w of G.workers){if(w.owner!==pid||w.path.length||!conn.has(w.node))continue;
    if(w.task==='build')u+=1;if(w.task==='mine')u+=has(pid,'drills')?.5:1;}
  for(const id of conn)for(const st of live(G.nodes[id],'barrier'))if(!st.off)u+=1;
  return u;
}
// pay energy for something standing on tile id: from the core's grid, or from a cut-off cluster's own batteries
// a cut-off cluster's own energy: what its batteries hold, what it makes and what it uses a turn
function clusterEnergy(pid,id){
  const cl=clusterOf(pid,id),ids=new Set(cl.map(x=>x.id));
  const prod=cl.reduce((a,x)=>a+5*live(x,'generator').length+(x.type==='captured'?10:0),0);
  let use=0;for(const w of G.workers)if(w.owner===pid&&ids.has(w.node)&&!w.path.length){if(w.task==='build')use+=1;if(w.task==='mine')use+=has(pid,'drills')?.5:1;}
  for(const x of cl)for(const st of live(x,'barrier'))if(!st.off)use+=1;
  for(const f of G.fleets)if(f.owner===pid&&ids.has(f.node)&&!fleetOnGrid(f))use+=droneUse(f)*f.count;
  return {stored:cl.reduce((a,x)=>a+x.estore,0),cap:cl.reduce((a,x)=>a+30*live(x,'estorage').length,0),prod,use};
}
function payEnergy(pid,id,amt){
  const p=P(pid);if(G.conn[pid].has(id)){if(p.energy<amt)return false;p.energy=Math.round((p.energy-amt)*10)/10;return true;}
  if(G.nodes[id].owner!==pid)return false;
  const cl=clusterOf(pid,id);if(cl.reduce((a,x)=>a+x.estore,0)<amt)return false;
  let need=amt;for(const x of cl){const t=Math.min(need,x.estore);x.estore-=t;need-=t;if(need<=0)break;}return true;
}
const storeCap=n=>30*live(n,'storage').length+(n.type==='captured'?100:0);
const storeHeld=n=>Object.values(n.store).reduce((a,v)=>a+v,0);
function clusterOf(pid,id){return [...bfsOwned(pid,id)].map(x=>G.nodes[x]).filter(x=>x.owner===pid);}
function walletAt(pid,id){
  if(G.conn[pid].has(id))return {...P(pid).res};
  const t=Object.fromEntries(RES.map(r=>[r,0]));
  for(const n of clusterOf(pid,id))for(const r in n.store)t[r]+=n.store[r];
  return t;
}
const canPayAt=(pid,id,c)=>{const w=walletAt(pid,id);return Object.entries(c).every(([k,v])=>w[k]>=v);};
function payAt(pid,id,c){
  if(G.conn[pid].has(id)){const p=P(pid);for(const k in c)p.res[k]-=c[k];return;}
  for(const k in c){let need=c[k];for(const n of clusterOf(pid,id)){const t=Math.min(need,n.store[k]||0);n.store[k]=(n.store[k]||0)-t;need-=t;if(!need)break;}}
}
function refundAt(pid,id,c){
  if(G.conn[pid].has(id)){const p=P(pid);for(const k in c)addRes(p,k,c[k]);return;}
  for(const k in c){let left=c[k];for(const n of clusterOf(pid,id)){const room=storeCap(n)-storeHeld(n);const t=Math.min(left,room);if(t>0){n.store[k]=(n.store[k]||0)+t;left-=t;}}}
}
// disassembling returns 1 of each resource in the cost, except Xenocrystal
const oneEach=c=>Object.fromEntries(Object.keys(c).filter(k=>k!=='xeno').map(k=>[k,1]));
function workerCost(p){const k=Math.pow(1.25,p.workersBuilt+p.workerQueue-p.freeQ);return {iron:Math.ceil(6*k),copper:Math.ceil(4*k)};}
const workerTotal=p=>G.workers.filter(w=>w.owner===p.id).length+p.workerQueue;
function stCost(pid,type){
  const base=ST[type].cost;if(type!=='borehole')return base;
  return Object.fromEntries(Object.entries(base).map(([r,v])=>[r,v*(boreholes(pid)+1)]));
}
const boreholes=pid=>G.nodes.reduce((a,n)=>a+(n.owner===pid?n.stations.filter(s=>s.type==='borehole'&&s.state!=='destroyed').length:0),0);
const fitsHere=(n,type)=>ST[type].where==='planet'?n.planet!=null:ST[type].where==='centre'?!!n.center:true;
function canBuild(pid,n,type){
  if(n.owner!==pid)return L('Not your asteroid','Не ваш астероид');
  if(ST[type].tech&&!has(pid,ST[type].tech))return L(`Needs the ${tN(ST[type].tech)} tech`,`Нужна технология «${tN(ST[type].tech)}»`);
  if(!fitsHere(n,type))return ST[type].where==='centre'?L('Only on a planet centre','Только в центре планеты'):L('Only on a planet section','Только на участке планеты');
  if(type==='borehole'&&n.stations.some(x=>x.type==='borehole'))return L('Only one borehole per planet centre','Только одна скважина на центр планеты');
  if(type==='borehole'&&boreholes(pid)>=5)return L('You already have 5 boreholes','У вас уже 5 скважин');
  if(type==='levi'){
    if(G.mode==='conquest')return L('No leviathans in Conquest','В «Завоевании» левиафанов нет');
    if(P(pid).gold<ST.levi.gold)return L('Needs 100 starium','Нужно 100 стариума');
    if(n.stations.some(x=>x.type==='levi'))return L('A leviathan is already being built here','Здесь уже строится левиафан');
  }
  if(!ST[type].noSlot&&n.stations.filter(x=>!ST[x.type].noSlot).length>=SLOTS)return L('All 4 build slots are used','Все 4 места для станций заняты');
  if(!canPayAt(pid,n.id,stCost(pid,type)))return G.conn[pid].has(n.id)?L('Not enough resources','Не хватает ресурсов'):L('Not enough resources in this cut-off cluster','Не хватает ресурсов в этом отрезанном скоплении');
  return '';
}
const buildersOn=(uid,ex)=>G.workers.filter(w=>w!==ex&&((w.task==='build'&&w.ref===uid&&!w.path.length)||(w.then&&w.then.task==='build'&&w.then.ref===uid))).length;
const researchersOn=(pid,t,ex)=>G.workers.filter(w=>w!==ex&&w.owner===pid&&((w.task==='research'&&w.tech===t)||(w.then&&w.then.task==='research'&&w.then.tech===t))).length;
// what a trade costs and gives: 2 of a resource buys 1 crystal, 2 crystals buy 1 resource; Better rates (4→3) only for the rest
const tradeRate=(pid,give,get)=>give==='xeno'||get==='xeno'?[2,1]:has(pid,'rates')?[4,3]:[3,2];
const techOpen=(p,t)=>!p.techs.has(t.id)&&(!t.req||p.techs.has(t.req))&&(!t.req2||p.techs.has(t.req2));
const techLeft=(p,t)=>TECH[t].c-(p.prog[t]||0);
function mergeFleets(t,s){t.count+=s.count;t.hp+=s.hp;t.en=(t.en||[]).concat(s.en||[]);G.fleets=G.fleets.filter(f=>f!==s);}
// one charger per tile; everything else up to the squadron size limit
const capFor=(pid,cls)=>cls==='charger'||cls==='leviathan'?1:tileCap(pid);
// what each station takes in: barrack = drones (not chargers), rover station = rovers, upgrade station = both
const dockKinds=st=>st.type==='kazarm'?SPACE:st.type==='rbarracks'?ROVERS:st.type==='upgrade'?[...SPACE,...ROVERS]:[];
// a leviathan can't enter a tile with your squadrons (a settled charger is fine), and your squadrons can't enter a leviathan's tile
const leviBlocks=(f,id)=>f.cls==='leviathan'?G.fleets.some(g=>g!==f&&g.owner===f.owner&&g.node===id&&!(g.cls==='charger'&&g.settled)):G.fleets.some(g=>g.owner===f.owner&&g.node===id&&g.cls==='leviathan');
const leviHere=(pid,node)=>G.fleets.some(g=>g.owner===pid&&g.node===node&&g.cls==='leviathan');
const stationBusy=st=>st.queue.length>0||CLS.some(c=>(st.hangar[c]||[]).some(d=>d.upg));
// take one drone out of a squadron, with its share of the fleet's health and its own battery
function takeDrone(f){const hp=f.hp/f.count,en=f.en.length?f.en.pop():BATT;f.hp-=hp;f.count--;if(f.count<=0)G.fleets=G.fleets.filter(g=>g!==f);return {hp,en,up:!!f.up};}
// docked drones go back on the map, joining a squadron of the same kind standing there
function launchDrones(pid,c,node,drones){
  for(const d of drones){
    let f=G.fleets.find(g=>g.owner===pid&&g.node===node&&g.cls===c&&g.up===!!d.up&&!g.path.length&&!g.settled);
    if(!f){f=newFleet(pid,c,0,node,!!d.up);f.hp=0;G.fleets.push(f);}
    f.count++;f.hp+=d.hp;f.en.push(d.en);
  }
}
// keep one battery entry per drone after the drone count changes
function fixEn(f){f.en=f.en||[];while(f.en.length>f.count)f.en.pop();while(f.en.length<f.count)f.en.push(BATT);}

/* ---------- combat ---------- */
function fleetMax(f){return f.count*DR[f.cls].hp;}
function syncFleet(f){if(f.hp>0){f.count=Math.ceil(f.hp/DR[f.cls].hp-1e-6);fixEn(f);}}
// Draft 9 damage order, first hit first. Turrets, workers and the core take their place in it.
const HIT_ORDER=['leviathan','stomper','tank','ballista','frigate','catapult','bomber','interceptor','siege','t:chain','t:turret','t:xray','t:death','boomerang','spy','repair','charger','worker','core'];
// the free tile next to n closest to pid's core, where a boomerang sends a rescued unit
function rescueTile(pid,n){
  const d=distMap(P(pid).core);let best=null,bd=Infinity;
  for(const id of n.nbr){if(hostileAt(pid,id))continue;const x=d.get(id)??99;if(x<bd){bd=x;best=id;}}
  return best;
}
function fight(n,fleets,where){
  // sides: each player present with war drones, plus the tile owner's turrets and core
  const sides=new Map();
  const side=pid=>{if(!sides.has(pid))sides.set(pid,{pid,fleets:[],turrets:[],core:null,workers:[],boom:0,rescued:false,saved:[]});return sides.get(pid);};
  for(const f of fleets)if(f.cls!=='spy')side(f.owner).fleets.push(f);
  const owner=n?n.owner:null;
  if(n&&owner!=null&&[...sides.keys()].some(p=>isFoe(p,owner))){
    const t=liveTurrets(n);const core=n.type==='core'&&n.coreHp>0?n:null;
    if(t.length||core){const s=side(owner);s.turrets=t;s.core=core;
      // each turret uses 1 energy per battle; without it, it can't fire
      for(const x of t)x.pw=x.type!=='death'&&payEnergy(owner,n.id,1);}
  }
  if(sides.size<2)return false;
  // workers on the tile take part for their side: 1 health, no damage
  if(n)for(const w of G.workers)if(w.node===n.id&&sides.has(w.owner))side(w.owner).workers.push({w,hp:1});
  for(const s of sides.values())s.boom=s.fleets.filter(f=>f.cls==='boomerang').reduce((a,f)=>a+f.count,0);
  const before=[...sides.values()].map(s=>({pid:s.pid,f:s.fleets.map(f=>[f,f.count]),t:s.turrets.map(t=>t),core:s.core?s.core.coreHp:null}));
  // barrier (first round only), minus barriers switched off by upgraded siege drones
  let barrier=0,off=0;
  if(n&&owner!=null&&sides.has(owner)){
    const b=live(n,'barrier').filter(x=>x.pw).length;
    const up=fleets.filter(f=>f.owner!==owner&&f.cls==='siege'&&f.up).reduce((a,f)=>a+f.count,0);
    off=Math.min(b,up);barrier=10*(b-off);
  }
  // upgraded frigates that held their ground this turn get extra health
  for(const s of sides.values())for(const f of s.fleets)if(f.cls==='frigate'&&f.up&&(!f.trail||f.trail.length<=1))f.buf=f.count;
  const alive=s=>s.fleets.some(f=>f.hp>0)||s.turrets.some(t=>t.hp>0)||(s.core&&s.core.coreHp>0);
  // a boomerang side that has lost every boomerang sends one unit per fallen boomerang to safety
  const rescue=s=>{
    const dest=rescueTile(s.pid,n);if(dest==null)return;
    for(let i=0;i<s.boom;i++){
      let ok=false;
      for(const c of ['charger','repair']){const f=s.fleets.find(f=>f.cls===c&&f.hp>0&&f.count>0);if(f){const d=takeDrone(f);f.saved=(f.saved||0)+1;if(f.count<=0)f.hp=0;launchDrones(s.pid,c,dest,[d]);s.saved.push(dN(c));if(c==='charger'&&s.pid===ME)achUnlock(2);ok=true;break;}}
      if(!ok){const w=s.workers.find(x=>x.hp>0);if(w){w.hp=0;w.saved=true;w.w.node=dest;w.w.path=[];w.w.task='idle';w.w.then=null;s.saved.push(w.w.name);ok=true;}}
      if(!ok){const f=G.fleets.find(f=>f.owner===s.pid&&f.node===n.id&&f.cls==='spy'&&f.count>0);if(f){const d=takeDrone(f);launchDrones(s.pid,'spy',dest,[d]);s.saved.push(dN('spy'));ok=true;}}
      if(!ok)break;
    }
  };
  const bfx=n&&!REPLAY?{node:n.id,core:null,sides:[...sides.values()].map(s=>{
      const ent=[...s.fleets.map(f=>({k:f.cls==='leviathan'?'L':'d',cls:f.cls,up:!!f.up,ref:f,o:HIT_ORDER.indexOf(f.cls),c:[f.count]})),...s.turrets.map(t=>({k:'t',type:t.type,ref:t,o:HIT_ORDER.indexOf('t:'+t.type),c:[1]}))].sort((a,b)=>a.o-b.o);
      return {pid:s.pid,ent};}),got:[]}:null;
  if(bfx){const cs=[...sides.values()].find(s=>s.core);if(cs)bfx.core={pid:cs.pid,hp:[cs.core.coreHp]};}
  let rounds=0;
  for(;rounds<60;rounds++){
    const act=[...sides.values()].filter(alive);
    if(!act.some(a=>act.some(b=>isFoe(a.pid,b.pid))))break;
    const inc=new Map(act.map(s=>[s.pid,{gen:0,str:0,chain:0}]));
    let any=false;
    for(const s of act){
      const enemies=act.filter(o=>isFoe(s.pid,o.pid));
      const maxEnemy=Math.max(0,...enemies.flatMap(o=>o.fleets.filter(f=>f.hp>0).map(f=>f.count)));
      let gen=0,str=0,chain=0;
      for(const f of s.fleets){if(f.hp<=0)continue;const D=DR[f.cls];let d=D.dmg;if(f.cls==='bomber'&&maxEnemy>0&&f.count>maxEnemy)d=3;if(f.cls==='boomerang'&&f.up&&f.viaFree)d+=2;const k=poweredDrones(f);gen+=d*k;if(f.cls==='siege')str+=(D.sdmg-D.dmg)*k;}
      for(const t of s.turrets){if(t.hp<=0||!t.pw)continue;gen+=ST[t.type].dmg||0;if(t.type==='chain')chain++;}
      if(s.core&&s.core.coreHp>0)gen+=2;
      if(gen+str+chain>0)any=true;
      for(const o of enemies){const x=inc.get(o.pid);x.gen+=gen/enemies.length;x.str+=str/enemies.length;x.chain+=chain;}
    }
    if(!any)break;
    for(const s of act){
      const x=inc.get(s.pid);let gen=x.gen,str=x.str;
      if(rounds===0&&s.pid===owner&&barrier>0){const a=Math.min(barrier,gen);gen-=a;const b=Math.min(barrier-a,str);str-=b;}
      // chain turrets: 1 damage to each enemy squadron per chain turret
      if(x.chain)for(const f of s.fleets)if(f.hp>0){const d=Math.min(f.buf,x.chain);f.buf-=d;f.hp-=x.chain-d;}
      // everything on this side, in the order it takes damage; siege bonus damage only lands on turrets and the core
      const tg=[];
      for(const f of s.fleets)if(f.hp>0)tg.push({k:HIT_ORDER.indexOf(f.cls),f});
      for(const t of s.turrets)if(t.hp>0)tg.push({k:HIT_ORDER.indexOf('t:'+t.type),t});
      for(const w of s.workers)if(w.hp>0)tg.push({k:HIT_ORDER.indexOf('worker'),w});
      if(s.core&&s.core.coreHp>0)tg.push({k:HIT_ORDER.length-1,c:s.core});
      tg.sort((a,b)=>a.k-b.k);
      for(const t of tg){
        if(gen<=1e-9&&str<=1e-9)break;
        if(t.f){const f=t.f;if(gen<=0)continue;if(f.buf>0){const d=Math.min(f.buf,gen);f.buf-=d;gen-=d;}const d=Math.min(f.hp,gen);f.hp-=d;gen-=d;}
        else if(t.w){if(gen<=0)continue;const d=Math.min(t.w.hp,gen);t.w.hp-=d;gen-=d;}
        else{const o=t.t||t.c,hp=t.t?o.hp:o.coreHp,a=Math.min(hp,str);str-=a;const b=Math.min(hp-a,gen);gen-=b;if(t.t)o.hp-=a+b;else o.coreHp-=a+b;}
      }
      s.fleets.forEach(syncFleet);
      // repair drones patch the front-line squadron each round
      const rep=s.fleets.filter(f=>f.cls==='repair'&&f.hp>0).reduce((a,f)=>a+f.count,0);
      if(rep){const front=s.fleets.filter(f=>f.hp>0).sort((a,b)=>DRONE_PRI.indexOf(a.cls)-DRONE_PRI.indexOf(b.cls))[0];if(front)front.hp=Math.min(fleetMax(front),front.hp+rep);}
      if(s.boom>0&&!s.rescued&&!s.fleets.some(f=>f.cls==='boomerang'&&f.hp>0)){s.rescued=true;if(n)rescue(s);}
    }

const REV_PRI=DRONE_PRI.filter(c=>c!=='spy').reverse();

function bombardAll(){

    const turrets=foe(tn.owner)?liveTurrets(tn).sort((a,b)=>TURRET_PRI.indexOf(a.type)-TURRET_PRI.indexOf(b.type)):[];

    const drones=G.fleets.filter(g=>g.node===tn.id&&foe(g.owner)&&g.cls!=='spy').sort((a,b)=>DRONE_PRI.indexOf(a.cls)-DRONE_PRI.indexOf(b.cls));

    if(!shots){log(L(`${who} ran out of Iron and could not fire at ${lc(nodeName(tn))}.`,`${who}: не хватило железа для обстрела: ${lc(nodeName(tn))}.`),'warn',f.node,[f.owner]);continue;}

      tn.stations=tn.stations.filter(s=>!(isTurret(s.type)&&s.state==='done'&&s.hp<=0));
    }else if(drones.length){

    }else if(core){

    for(const s of spies){pids.add(s.owner);lost.push(L(`${plural(s.count,pShort(P(s.owner))+' spy').replace('spys','spies')}`,`${cnt(s.count,'spy')} (${pShort(P(s.owner))})`));}
    if(spies.length)G.fleets=G.fleets.filter(g=>!spies.includes(g));

/* ---------- underdog gifts ----------
   Every 5 turns from turn 15, with 3+ players alive: strength = 0.35 army + 0.25 land + 0.15 resources + 0.15 starium + 0.10 cores,
   each part compared with the best alive player. The weakest player is the underdog when their strength is at most 60% of
   everyone else's average; they get ceil((0.6·avg − S)/0.1) gifts (1–3) on their own empty asteroids / planet sections.
   A gift lasts 5 turns, is seen only by players who see its tile, and goes to whoever reaches it first (see claimGifts). */
const GIFT_SPACE=['frigate','siege','boomerang','catapult'],GIFT_ROVER=['tank','stomper','ballista'];
function strengthParts(pid){
  const p=P(pid);
  return {army:G.fleets.filter(f=>f.owner===pid&&DR[f.cls].dmg>0).reduce((a,f)=>a+f.count*(DR[f.cls].hp+DR[f.cls].dmg),0),
    land:G.nodes.filter(n=>n.owner===pid).length,res:RES.reduce((a,r)=>a+p.res[r],0),gold:p.gold,
    cores:1+G.nodes.filter(n=>n.type==='captured'&&n.owner===pid).length};
}
function strengths(){
  const alive=G.players.filter(p=>p.alive),parts=new Map(alive.map(p=>[p.id,strengthParts(p.id)]));
  const W={army:.35,land:.25,res:.15,gold:.15,cores:.10},best={};
  for(const k in W)best[k]=Math.max(0,...[...parts.values()].map(x=>x[k]));
  const out=new Map();for(const [pid,x] of parts){let v=0;for(const k in W)v+=W[k]*(best[k]>0?x[k]/best[k]:1);out.set(pid,v);}
  return out;
}
const giftSpot=(pid,n)=>n.owner===pid&&(n.type==='empty'||(n.planet!=null&&!n.center))&&!n.stations.length&&
  !G.fleets.some(f=>f.node===n.id)&&!G.workers.some(w=>w.node===n.id)&&!(G.gifts||[]).some(g=>g.node===n.id);
function updateGifts(){
  G.gifts=(G.gifts||[]).filter(g=>G.turn-g.t<5);
  if(G.gifts.length||G.turn<15||G.turn%5)return;
  const alive=G.players.filter(p=>p.alive);if(alive.length<3)return;
  const st=strengths(),ranked=[...st].sort((a,b)=>a[1]-b[1]),[uid,S]=ranked[0];
  const avg=ranked.slice(1).reduce((a,x)=>a+x[1],0)/(ranked.length-1);
  if(S>.6*avg)return;
  (G.underdogs=G.underdogs||{})[uid]=true;
  const k=Math.max(1,Math.min(3,Math.ceil((.6*avg-S)/.1-1e-9)));
  const spots=shuffle(G.nodes.filter(n=>giftSpot(uid,n))).slice(0,k);
  if(!spots.length)return;
  for(const n of spots){const rover=n.planet!=null,list=rover?GIFT_ROVER:GIFT_SPACE;
    G.gifts.push({node:n.id,cls:list[Math.floor(rnd()*list.length)],up:!rover,t:G.turn,for:uid});hitPulse(n.id,[],[],'gift');}
  log(L(`Supplies were dropped on ${spots.length} of your tile${spots.length>1?'s':''}. Reach them within 5 turns to collect them, before someone else does.`,
        `На ваших клетках появились припасы: ${spots.length}. Доберитесь до них за 5 ходов, пока их не забрал кто-то другой.`),'info',spots[0].id,[uid]);
}
// whoever reaches a gift takes it at once. Two players' workers together: only the underdog's can take it, otherwise nobody

function claimGifts(){

    const n=G.nodes[g.node];

    if(!owners.size)continue;

/* ---------- diplomacy ----------
   G.peace: [{a,b}] pairs at peace (a<b). G.treaties: [{from,to,t}] waiting for an answer.
   A worker at the core prepares treaties (w.task 'diplo', w.diplo = [{to,brk}]): at the end of the turn they are sent,
   and breaks take effect. Answers ('peaceans') take effect at the end of the turn they are given. */
function metOf(pid){return new Set(P(pid).met||[]);}
// you meet a rival once you have seen their territory or drones
function updateMet(){
  for(const p of G.players){if(!p.alive)continue;const V=vis(p.id),m=new Set(p.met||[]);
    for(const id of V){const n=G.nodes[id];if(n.owner!=null&&n.owner!==p.id)m.add(n.owner);}
    for(const f of G.fleets)if(f.owner!==p.id&&V.has(f.node)&&(f.cls!=='spy'||atPeace(p.id,f.owner)))m.add(f.owner);
    for(const w of G.workers)if(w.owner!==p.id&&V.has(w.node))m.add(w.owner);
    p.met=[...m].sort((a,b)=>a-b);}
}
function makePeace(a,b){if(atPeace(a,b))return;(G.peace=G.peace||[]).push({a:Math.min(a,b),b:Math.max(a,b)});G.treaties=(G.treaties||[]).filter(t=>!((t.from===a&&t.to===b)||(t.from===b&&t.to===a)));
  log(L(`${pShort(P(a))} and ${pShort(P(b))} made peace. They can't attack each other, see each other's cores and spies, and their networks link where they touch.`,`${pShort(P(a))} и ${pShort(P(b))} заключили мир: они не нападают друг на друга, видят ядра и шпионов друг друга, а их сети соединяются там, где соприкасаются.`),'info',null,[a,b]);}
// the one who breaks the peace loses every squadron standing on the other's tiles
function breakPeace(by,other){
  if(!atPeace(by,other))return;
  G.peace=G.peace.filter(x=>!(x.a===Math.min(by,other)&&x.b===Math.max(by,other)));
  const lost=G.fleets.filter(f=>f.owner===by&&G.nodes[f.node].owner===other);
  G.fleets=G.fleets.filter(f=>!lost.includes(f));
  const k=lost.reduce((a,f)=>a+f.count,0);
  log(L(`${pShort(P(by))} broke the peace with ${pShort(P(other))}${k?` and lost ${plural(k,'drone')} on ${pShort(P(other))}'s tiles`:''}.`,`${pShort(P(by))} разорвал мир с ${pShort(P(other))}${k?` и потерял дронов на его клетках: ${k}`:''}.`),'battle',null,[by,other]);

function diploTurn(){
  // answers given this turn
  for(const t of [...(G.treaties||[])]){
    if(!P(t.to).alive||!P(t.from).alive){G.treaties=G.treaties.filter(x=>x!==t);continue;}
    // the computer never accepts
    if(P(t.to).ai){G.treaties=G.treaties.filter(x=>x!==t);log(L(`${pShort(P(t.to))} declined your peace treaty.`,`${pShort(P(t.to))} отклонил ваш мирный договор.`),'warn',null,[t.from]);continue;}

    G.treaties=G.treaties.filter(x=>x!==t);
    if(t.ans)makePeace(t.from,t.to);else log(L(`${pShort(P(t.to))} declined your peace treaty.`,`${pShort(P(t.to))} отклонил ваш мирный договор.`),'warn',null,[t.from]);
  }

  for(const w of G.workers){if(w.task!=='diplo'||w.path.length)continue;const p=P(w.owner);

      else if(has(w.owner,'diplomacy')&&P(d.to).alive&&!atPeace(w.owner,d.to)&&metOf(w.owner).has(d.to)&&!(G.treaties||[]).some(t=>t.from===w.owner&&t.to===d.to)){
        (G.treaties=G.treaties||[]).push({from:w.owner,to:d.to,t:G.turn});
        log(L(`${w.name} sent a peace treaty to ${pShort(P(d.to))}.`,`${w.name} отправил мирный договор игроку ${pShort(P(d.to))}.`),'info',null,[w.owner]);
        log(L(`${pShort(P(w.owner))} wants to make peace with you.`,`${pShort(P(w.owner))} хочет заключить с вами мир.`),'info',null,[d.to]);}
    }

function hitPulse(id,att,win,kind){(G.pulses=G.pulses||[]).push({node:id,att,win,kind});}
// does tile id hold anything of an enemy of pid that a ballista bolt can hurt?
function boltTargets(pid,id){
  const n=G.nodes[id],tg=[];
  for(const g of G.fleets)if(g.node===id&&g.hp>0&&isFoe(pid,g.owner))tg.push({k:HIT_ORDER.indexOf(g.cls),f:g});
  if(isFoe(pid,n.owner))for(const t of liveTurrets(n))tg.push({k:HIT_ORDER.indexOf('t:'+t.type),t});
  for(const w of G.workers)if(w.node===id&&isFoe(pid,w.owner))tg.push({k:HIT_ORDER.indexOf('worker'),w});
  if(n.type==='core'&&n.coreHp>0&&isFoe(pid,n.coreOf))tg.push({k:HIT_ORDER.length-1,c:n});
  return tg.sort((a,b)=>a.k-b.k);
}
// the bolt's route after the first hit: as many different enemy tiles as it can reach in up to `left` jumps;
// ties go to the jump closer to an enemy core, then at random
function boltRoute(pid,from,seen,left){
  if(left<=0)return [];
  const opts=G.nodes[from].nbr.filter(id=>!seen.has(id)&&boltTargets(pid,id).length);
  if(!opts.length)return [];
  const cores=G.players.filter(q=>q.alive&&isFoe(pid,q.id)).map(q=>G.nodes[q.core]);
  const coreD=id=>cores.length?Math.min(...cores.map(c=>hexDist(G.nodes[id],c))):0;
  let best=null;
  for(const id of opts){const s2=new Set(seen);s2.add(id);const r=[id,...boltRoute(pid,id,s2,left-1)];
    if(!best||r.length>best[0].length)best=[r];else if(r.length===best[0].length)best.push(r);}
  const dmin=Math.min(...best.map(r=>coreD(r[0])));best=best.filter(r=>coreD(r[0])===dmin);
  return best[Math.floor(rnd()*best.length)];
}
// one hit of the bolt on a tile, in the usual damage order; a powered enemy barrier soaks 10 of it
function boltHit(f,id,dmg,lost){
  const n=G.nodes[id];
  const bar=isFoe(f.owner,n.owner)?10*live(n,'barrier').filter(x=>x.pw).length:0;
  let d=Math.max(0,dmg-bar);const soaked=dmg-d;
  for(const t of boltTargets(f.owner,id)){
    if(d<=1e-9)break;
    if(t.f){const g=t.f,before=g.count;const a=Math.min(g.hp,d);g.hp-=a;d-=a;syncFleet(g);const k=g.hp<=0?before:before-g.count;
      if(k>0)lost.push(L(`${k} ${pShort(P(g.owner))} ${dCount(k,g.cls).replace(/^\d+ /,'')}`,`${dCount(k,g.cls)} (${pShort(P(g.owner))})`));
      if(g.cls==='leviathan'&&g.hp<=0&&g.pilot)lost.push(L(`pilot ${g.pilot}`,`пилот ${g.pilot}`));}
    else if(t.t){const a=Math.min(t.t.hp,d);t.t.hp-=a;d-=a;if(t.t.hp<=0)lost.push(lc(sN(t.t.type)));}
    else if(t.w){d-=1;G.workers=G.workers.filter(w=>w!==t.w);lost.push(L(`worker ${t.w.name}`,`рабочий ${t.w.name}`));}
    else{const a=Math.min(t.c.coreHp,d);t.c.coreHp-=a;d-=a;if(a>0)lost.push(L(`${Math.round(a*10)/10} core health`,`${Math.round(a*10)/10} здоровья ядра`));}
  }
  G.fleets=G.fleets.filter(g=>g.hp>0);
  n.stations=n.stations.filter(s=>!(isTurret(s.type)&&s.state==='done'&&s.hp<=0));
  G.flash.add(id);hitPulse(id,[f.owner],[]);
  if(n.type==='core'&&n.coreHp<=0){if(f.owner===ME)achUnlock(1);coreFall(n);}
  return soaked;
}
// a ballista squadron fires one bolt: charged crystals decide how far it jumps (0.5, 1, 2, 4, 8),
// crystals past the 5th add +0.5 each to the last hit (one per extra ballista)
const BOLT_MAX=20;
// stompers: each one that moved deals 0.5 to every enemy on the neighbouring tiles of its planet; upgraded ones also 1 on their own tile
function stompAll(){
  for(const f of G.fleets.filter(f=>f.cls==='stomper'&&f.hp>0&&f.trail&&f.trail.length>1)){
    const n=G.nodes[f.node],k=f.count,lines=[],pids=new Set([f.owner]);
    const hits=n.nbr.filter(id=>G.nodes[id].planet!=null&&G.nodes[id].planet===n.planet).map(id=>[id,.5*k]);
    if(f.up)hits.unshift([n.id,k]);
    const fx={node:n.id,owner:f.owner,hits:[]};if(!REPLAY)(G.stomps=G.stomps||[]).push(fx);
    for(const [id,d] of hits){if(!boltTargets(f.owner,id).length)continue;const lost=[];fx.hits.push([id,d]);
      if(G.nodes[id].owner!=null)pids.add(G.nodes[id].owner);for(const g of G.fleets)if(g.node===id)pids.add(g.owner);
      const soaked=boltHit(f,id,d,lost);
      lines.push(L(`${lc(nodeName(G.nodes[id]))} ${d}${soaked?` (${soaked} soaked by a barrier)`:''}${lost.length?': '+lost.join(', '):''}`,`${lc(nodeName(G.nodes[id]))} ${String(d).replace('.',',')}${soaked?` (барьер поглотил ${soaked})`:''}${lost.length?': '+lost.join(', '):''}`));}
    if(!lines.length)continue;
    const who=RU()?'Топтуны ('+(f.owner===ME?'ваши':pShort(P(f.owner)))+')':(f.owner===ME?'Your':pShort(P(f.owner)))+' stompers';
    log(L(`${who} stomped at ${lc(nodeName(n))}: ${lines.join(', ')}.`,`${who} топнули на ${lc(nodeName(n))}: ${lines.join(', ')}.`),'battle',n.id,[...pids]);
  }
}
function ballistaFire(f,tn){
  const p=P(f.owner),who=RU()?'Баллисты ('+(f.owner===ME?'ваши':pShort(p))+')':(f.owner===ME?'Your':pShort(p))+' ballistas';
  const want=Math.min(f.charge||1,maxCharge(f)),cr=Math.min(want,Math.floor(p.res.xeno),poweredDrones(f)>0?maxCharge(f):0);
  if(cr<1){log(L(`${who} had no crystals to fire at ${lc(nodeName(tn))}.`,`${who}: нет кристаллов для выстрела по: ${lc(nodeName(tn))}.`),'warn',f.node,[f.owner]);if(!f.keep)f.bombard=null;return;}
  p.res.xeno-=cr;
  const hops=Math.min(cr,5),extra=Math.max(0,cr-5);
  // the first hit always lands on the chosen tile; the bolt only jumps on from a tile that had an enemy
  const route=[tn.id];
  if(hops>1&&boltTargets(f.owner,tn.id).length)route.push(...boltRoute(f.owner,tn.id,new Set([f.node,tn.id]),hops-1));
  // upgraded ballistas (Draft 12): a full 5-hop bolt keeps jumping to new enemy tiles at the 5th hit's damage (20 hits at most)
  if(f.up&&hops===5&&route.length===5){const seen=new Set([f.node,...route]);
    const cores=G.players.filter(q=>q.alive&&isFoe(f.owner,q.id)).map(q=>G.nodes[q.core]);
    const coreD=id=>cores.length?Math.min(...cores.map(c=>hexDist(G.nodes[id],c))):0;
    while(route.length<BOLT_MAX){const opts=G.nodes[route.at(-1)].nbr.filter(id=>!seen.has(id)&&boltTargets(f.owner,id).length);if(!opts.length)break;
      const dmin=Math.min(...opts.map(coreD)),best=opts.filter(id=>coreD(id)===dmin),nx=best[Math.floor(rnd()*best.length)];seen.add(nx);route.push(nx);}}
  const lines=[],pids=new Set([f.owner]);
  route.forEach((id,i)=>{
    const dmg=CHAIN[Math.min(i,4)]+(i===route.length-1?.5*extra:0),lost=[];
    if(G.nodes[id].owner!=null)pids.add(G.nodes[id].owner);
    for(const g of G.fleets)if(g.node===id)pids.add(g.owner);
    const soaked=boltHit(f,id,dmg,lost);
    lines.push(L(`${lc(nodeName(G.nodes[id]))} ${dmg}${soaked?` (${soaked} soaked by a barrier)`:''}${lost.length?': '+lost.join(', '):''}`,`${lc(nodeName(G.nodes[id]))} ${String(dmg).replace('.',',')}${soaked?` (барьер поглотил ${soaked})`:''}${lost.length?': '+lost.join(', '):''}`));
  });
  const wasted=hops-route.length;
  log(L(`${who} fired a ${cr}-crystal bolt: ${lines.join(' → ')}${wasted>0?`. No more enemy tiles to jump to: ${wasted} crystal${wasted>1?'s':''} wasted`:''}.`,
        `${who} выпустили молнию (${cr} крист.): ${lines.join(' → ')}${wasted>0?`. Дальше прыгать некуда, потеряно кристаллов: ${wasted}`:''}.`),'warn',tn.id,[...pids]);
  (G.shocks=G.shocks||[]).push({path:[f.node,...route],owner:f.owner,fid:f.id});
  if(!f.keep)f.bombard=null;
}
function fireDeathTurrets(){
  // (each tile a death turret hits pulses red next turn)
  for(const n of G.nodes)for(const s of n.stations){
    if(s.type!=='death'||s.state!=='done'||s.aim==null||s.charge>0||n.owner==null)continue;
    const t=G.nodes[s.aim];s.aim=null;
    if(!canPayAt(n.owner,n.id,{xeno:10})||!payEnergy(n.owner,n.id,5)){log(L(`The death turret at ${lc(nodeName(n))} could not fire: it needs 5 energy and 10 Xenocrystal.`,`Турель смерти на ${lc(nodeName(n))} не выстрелила: нужно 5 энергии и 10 кристаллов.`),'warn',n.id,[n.owner]);continue;}
    payAt(n.owner,n.id,{xeno:10});s.charge=5;
    if(!REPLAY)(G.dtFx=G.dtFx||[]).push({from:n.id,to:t.id,owner:n.owner});
    const k=G.fleets.filter(f=>f.node===t.id&&f.cls!=='spy').reduce((a,f)=>a+f.count,0)+G.workers.filter(w=>w.node===t.id).length;
    const spyK=G.fleets.filter(f=>f.node===t.id&&f.cls==='spy'&&isFoe(f.owner,n.owner)).reduce((a,f)=>a+f.count,0);
    const spyOwners=G.fleets.filter(f=>f.node===t.id&&f.cls==='spy').map(f=>f.owner);
    G.fleets=G.fleets.filter(f=>f.node!==t.id);G.workers=G.workers.filter(w=>w.node!==t.id);
    t.stations=t.stations.filter(x=>!isTurret(x.type));
    t.stations.forEach(x=>{x.state='destroyed';x.queue=[];x.hangar=emptyHangar();x.aim=null;});
    t.store={};t.estore=0;
    if(t.type==='core'&&t.coreHp>10)t.coreHp=10;
    const pids=[n.owner,...spyOwners];if(t.owner!=null)pids.push(t.owner);
    log(L(`${n.owner===ME?"Your":pShort(P(n.owner))} death turret fired at ${lc(nodeName(t))}: ${plural(k,'drone')} wiped out${spyK?`, ${plural(spyK,'enemy spy').replace('spys','spies')} destroyed`:''} and every station there destroyed.`,`Турель смерти (${n.owner===ME?'ваша':pShort(P(n.owner))}) выстрелила по: ${lc(nodeName(t))}. Уничтожено: ${cnt(k,'drone')}${spyK?`, ${cnt(spyK,'enemy spy')}`:''} и все станции.`),'battle',t.id,pids);
    G.flash.add(t.id);hitPulse(t.id,[n.owner],[]);
  }
}
// a core at 0 health: its owner is out, their territory goes neutral with every station destroyed,
// and the core waits for a worker to claim it, holding the loser's resources
function wreckStations(n){n.stations.forEach(s=>{s.state='destroyed';s.queue=[];s.hangar=emptyHangar();s.aim=null;s.charge=0;});}
function coreFall(c){
  const pid=c.coreOf,p=P(pid);if(!p.alive)return;p.alive=false;
  if(!REPLAY)(G.coreFx=G.coreFx||[]).push({node:c.id,color:p.color});
  G.workers=G.workers.filter(w=>w.owner!==pid);G.fleets=G.fleets.filter(f=>f.owner!==pid);
  for(const n of G.nodes)if(n.owner===pid){n.owner=null;wreckStations(n);n.store={};n.estore=0;n.cut=0;}
  c.type='deadcore';c.owner=null;c.coreHp=0;c.vault={...p.res};wreckStations(c);
  RES.forEach(r=>p.res[r]=0);p.energy=0;
  G.coreFell=true;
  log(pid===ME?L(`Your core fell. You are out of the game; your territory is now neutral. A worker can claim the fallen core to take its ${RES.reduce((a,r)=>a+c.vault[r],0)} stored resources.`,`Ваше ядро пало. Вы выбываете из игры, ваша территория теперь ничья. Рабочий может захватить павшее ядро и забрать ${RES.reduce((a,r)=>a+c.vault[r],0)} ресурсов.`):L(`${pName(p)}'s core fell. ${pShort(p)} is out of the game; their territory is now neutral. A worker can claim the fallen core to take its ${RES.reduce((a,r)=>a+c.vault[r],0)} stored resources.`,`Ядро пало: ${pName(p)}. ${pShort(p)} выбывает из игры, его территория теперь ничья. Рабочий может захватить павшее ядро и забрать ${RES.reduce((a,r)=>a+c.vault[r],0)} ресурсов.`),'battle',c.id,G.players.map(q=>q.id));
}

/* ---------- turn resolution ---------- */
function resolve(){
  G.log=[];G.flash=new Set();G.notice=null;G.rockets=[];G.shocks=[];G.stomps=[];G.battleFx=[];G.coreFx=[];G.dtFx=[];G.boomFx=[];G.healFx=[];G.ghost=null;G.pulses=[];G.coreFell=false;
  if(!G.tut)G.players.filter(p=>p.ai&&p.alive).forEach(aiTurn);
  for(const u of [...G.workers,...G.fleets])u.trail=[u.node];
  const wBefore=G.workers.map(w=>[w.id,w.owner]);
  G.battleAt=new Set();
  for(const f of G.fleets){f.viaFree=false;f.hopFree=f.freeHop;f.freeHop=null;}
  // 1. movement
  const movers=[];
  for(const w of G.workers)if(w.path.length)movers.push({u:w,kind:'w',steps:has(w.owner,'thrusters')?2:1});
  for(const f of G.fleets)if(f.path.length&&!stuck(f)&&!f.settled){
    let steps=DR[f.cls].spd;
    if(f.up&&f.cls==='bomber')steps=2;
    if(f.up&&f.cls==='interceptor'&&G.nodes[f.node].owner===f.owner)steps=3;
    if(f.sync)steps=Math.min(steps,f.sync);
    // a boomerang passing back through the tile it attacked last turn gets that hop for free
    if(f.cls==='boomerang'&&f.hopFree!=null&&f.path.includes(f.hopFree)){steps++;f.viaFree=true;}
    movers.push({u:f,kind:'f',steps});
  }
  const edges=new Map();
  for(const m of movers){if(m.kind!=='f'||m.u.cls==='spy')continue;const a=m.u.node,b=m.u.path[0];const k=Math.min(a,b)+'-'+Math.max(a,b);if(!edges.has(k))edges.set(k,[]);edges.get(k).push(m.u);}
  for(const [k,fl] of edges){
    if(new Set(fl.map(f=>f.node)).size<2||new Set(fl.map(f=>f.owner)).size<2)continue;
    const [a,b]=k.split('-').map(Number);
    fight(null,fl,L(`between ${lc(nodeName(G.nodes[a]))} and ${lc(nodeName(G.nodes[b]))}`,`между ${lc(nodeName(G.nodes[a]))} и ${lc(nodeName(G.nodes[b]))}`));
    G.flash.add(a);G.flash.add(b);
  }
  for(let s=0;s<3;s++){
   // workers may share an asteroid with enemy workers (Draft 6)
   for(const m of movers){
    const u=m.u;if(m.steps<=s||!u.path.length)continue;
    if(m.kind==='w'&&!G.workers.includes(u))continue;
    if(m.kind==='f'){
      if(!G.fleets.includes(u))continue;
      if(u.cls==='spy'){if(s>0&&enemyXray(u.owner,u.node))continue;}
      else if(s>0&&hostileAt(u.owner,u.node))continue;
      const nx=u.path[0];
      if(!planetOk(u.owner,u.cls,nx)){u.path=[];u.mergeInto=null;continue;}
      if(leviBlocks(u,nx)){u.path=[];u.mergeInto=null;continue;}
      if(tileCount(u.owner,nx,u.cls,u)+u.count>capFor(u.owner,u.cls)){u.path=[];u.mergeInto=null;log(L(`${dN(u.cls)} squadron stopped at ${lc(nodeName(G.nodes[u.node]))}: the next asteroid already holds the drone cap.`,`Эскадрилья «${dN(u.cls)}» остановился на: ${lc(nodeName(G.nodes[u.node]))}. На следующем астероиде уже предел дронов.`),'warn',u.node,[u.owner]);continue;}
    }
    u.node=u.path.shift();u.trail.push(u.node);if(!u.path.length)u.sync=null;
    if(m.kind==='w'){explore(u.owner,u.node);if(!u.path.length&&u.then){u.task=u.then.task;u.ref=u.then.ref;u.tech=u.then.tech||null;u.then=null;}}
    else{
      if(u.cls==='spy'&&enemyXray(u.owner,u.node))u.path=[];
      if(!u.path.length&&u.mergeInto){const t=G.fleets.find(g=>g.id===u.mergeInto&&g.node===u.node&&g.owner===u.owner&&g.cls===u.cls&&g.up===u.up);u.mergeInto=null;if(t){mergeFleets(t,u);t.trail=u.trail;}}
    }
   }
  }
  captureGhost();
  // 1b. stompers that moved this turn shake the planet tiles around where they landed (Draft 12)
  stompAll();
  // 2. death turrets, catapults, battles
  fireDeathTurrets();
  bombardAll();
  // artillery fires for one turn unless the player has turned on continuous fire in Settings
  for(const f of G.fleets)if(f.bombard!=null&&!f.keep)f.bombard=null;
  for(const n of G.nodes){
    const fl=G.fleets.filter(f=>f.node===n.id&&f.cls!=='spy');if(!fl.length)continue;
    const owners=new Set(fl.map(f=>f.owner));
    const vsOwner=n.owner!=null&&fl.some(f=>isFoe(f.owner,n.owner))&&(liveTurrets(n).length||n.type==='core');
    if(![...owners].some(a=>[...owners].some(b=>isFoe(a,b)))&&!vsOwner)continue;
    fight(n,fl,L(`at ${lc(nodeName(n))}`,lc(nodeName(n))));
  }
  // drones docked in a charger are lost when enemy war drones are on its tile
  for(const f of G.fleets)if(f.cls==='charger'&&f.settled&&(f.dock||[]).length&&warFleetsAt(f.owner,f.node).length){log(L(`${plural(f.dock.length,'drone')} docked in ${whose(f.owner).toLowerCase()} charger at ${lc(nodeName(G.nodes[f.node]))} were destroyed by enemy squadrons.`,`Пристыкованные к зарядчику (${f.owner===ME?'ваш':pShort(P(f.owner))}) дроны на ${lc(nodeName(G.nodes[f.node]))} уничтожены: ${cnt(f.dock.length,'drone')}.`),'battle',f.node,[f.owner]);f.dock=[];}
  // boomerangs that won a battle fly back to the tile they attacked from; next turn that battle tile is a free hop
  for(const f of G.fleets)if(f.cls==='boomerang'&&f.trail&&f.trail.length>1&&G.battleAt.has(f.node)&&!hostileAt(f.owner,f.node)){
    const back=f.trail[f.trail.length-2];if(!REPLAY)(G.boomFx=G.boomFx||[]).push({fid:f.id,from:f.node,to:back});f.freeHop=f.node;f.node=back;f.trail.push(back);f.path=[];
  }
  // spies caught by enemy war drones or X-ray turrets
  for(const f of G.fleets.filter(f=>f.cls==='spy')){
    const wf=warFleetsAt(f.owner,f.node),xr=enemyXray(f.owner,f.node);
    if(!wf.length&&!xr)continue;
    f.hp=0;
    const killer=xr?G.nodes[f.node].owner:wf[0].owner;if(xr&&killer===ME)achUnlock(4);const by=xr?L('X-ray turret','рентген турель'):L('war drones','боевые дроны');
    const spies=plural(f.count,'spy').replace('spys','spies');
    const text=RU()?(killer===ME?`Ваша ${by} уничтожила вражеского шпиона (${pShort(P(f.owner))}) на: ${lc(nodeName(G.nodes[f.node]))}.`.replace('Ваша боевые дроны уничтожила','Ваши боевые дроны уничтожили').replace('вражеского шпиона',f.count>1?'вражеских шпионов: '+f.count:'вражеского шпиона')

    const full=resTotal(p)>=resCap(pid)-5;

    if(G.turn>=4&&count('kazarm')<1)wants.push('kazarm');

  // enough battery to get there (0.5 a turn off the network) with a point to spare
  const canReach=(f,path)=>{if(f.cls==='leviathan'||!path)return !!path;const off=path.filter(id=>!G.conn[pid].has(id)).length;const turns=Math.ceil(off/Math.max(1,DR[f.cls].spd));return Math.min(...f.en)>=turns*.5+.5;};
  const nearestEnemy=(f,needTurret)=>{const RS=routeSet(f,pid),d=distMap(f.node,RS);let best=null,bd=Infinity;for(const [id,dd] of d){const m=G.nodes[id];if(m.owner!=null&&m.owner!==pid&&(!needTurret||liveTurrets(m).length)&&dd<bd){best=id;bd=dd;}}return best;};

  if(goal==null&&army.length&&!threat&&total>=DF.attackAt){
    const d=distMap(p.core,K);let best=null,bs=-Infinity;
    for(const [id,dd] of d){const m=G.nodes[id];if(!isFoe(pid,m.owner)||(p.aiSkip[id]||0)>G.turn)continue;const ep=enemyPower(id);if(ep*1.25>armyPow)continue;
      // enemy cores first, then planet centres, then anything with turrets, then plain land; closer is better
      const v=(m.type==='core'?40:m.center?25:liveTurrets(m).length?12:6)-dd*2;if(v>bs){bs=v;best=id;}}
    goal=best;
  }
  p.aiGoal=goal;
  // gather on the last tile of our own network on the way, so batteries stay charged while the army assembles
  const goalPath=goal!=null?findPath(p.core,goal,K):null;
  let stage=p.core;if(goalPath)for(const id of goalPath.slice(0,-1))if(G.conn[pid].has(id))stage=id;
  const atStage=army.filter(f=>f.node===stage);
  const stagePow=pw(atStage.reduce((a,f)=>a+DR[f.cls].dmg*poweredDrones(f),0),atStage.reduce((a,f)=>a+f.hp,0));
  const strike=goal!=null&&stagePow>=enemyPower(goal)*1.25;
  for(const f of myF){
    if(f.path.length||f.cls==='spy'||f.settled||stuck(f))continue;
    const n=G.nodes[f.node],RS=routeSet(f,pid);
    if(DR[f.cls].ground){aiRover(f,pid);continue;}
    // just pulled back from a stronger enemy: hold for a few turns instead of walking straight back in (no back-and-forth)
    if(f.cool&&G.turn<f.cool&&!threat)continue;
    // low batteries off the network: head home to recharge
    if(f.cls!=='leviathan'&&!fleetOnGrid(f)&&Math.min(...f.en)<=2){const h=homeOf(f);if(h!=null){f.path=findPath(f.node,h,RS)||[];f.bombard=null;}continue;}
    // a stronger enemy next door: fall back towards the core
    const danger=n.nbr.filter(id=>enemyPower(id)>ownPower(f.node)*1.2);
    if(danger.length&&f.node!==p.core&&f.cls!=='leviathan'&&!(strike&&f.node===stage)){f.path=findPath(f.node,p.core,RS)||[];f.bombard=null;f.cool=G.turn+3;continue;}
    if(f.cls==='repair'){const lead=myF.filter(g=>g.cls!=='repair'&&g.cls!=='charger').sort((a,b)=>b.count-a.count)[0];if(lead&&lead.node!==f.node)f.path=findPath(f.node,lead.node,RS)||[];continue;}
    if(f.cls==='charger')continue;
    if(threat&&f.node!==p.core){f.path=findPath(f.node,p.core,RS)||[];f.bombard=null;continue;}
    if(f.cls==='catapult'){
      const t=nearestEnemy(f,true);if(t==null)continue;
      if(n.nbr.includes(t)){if(f.cls==='ballista'){const cr=Math.min(maxCharge(f),Math.floor(p.res.xeno/2));if(cr<1)continue;f.charge=cr;}f.bombard=t;continue;}
      const path=findPath(f.node,t,RS);if(path&&path.length>1&&canReach(f,path))f.path=path.slice(0,-1);
      continue;
    }
    // on an enemy tile: wait there while one of our workers is on its way to claim it (at most 5 turns), otherwise move on
    if(isFoe(pid,n.owner)&&ws.some(w=>(w.path.at(-1)??w.node)===n.id)&&(f.hold=(f.hold||0)+1)<=5)continue;
    f.hold=0;
    if(threat)continue;
    // part of the army: gather at the staging tile, then strike together
    if(goal!=null&&army.includes(f)){
      // already on the goal: stay there (a worker comes to claim it) instead of walking back to the staging tile
      if(f.node===goal)continue;
      // leviathans can't share a tile, so they never gather: each one strikes alone when it is strong enough
      if(f.cls==='leviathan'){const own=pw(DR.leviathan.dmg,f.hp);if(own>=enemyPower(goal)*1.1){const path=findPath(f.node,goal,RS);if(path){f.path=path;continue;}}
        const near=G.nodes[goal].nbr.filter(id=>!leviBlocks(f,id)&&RS.has(id)).sort((a,b)=>hexDist(G.nodes[a],G.nodes[f.node])-hexDist(G.nodes[b],G.nodes[f.node]))[0];
        if(near!=null&&near!==f.node){const path=findPath(f.node,near,RS);if(path){f.path=path;continue;}}
        continue;}
      const to=strike&&f.node===stage?goal:stage;
      if(f.node!==to){const path=findPath(f.node,to,RS);if(path&&canReach(f,path)&&(to===goal||tileCount(pid,to,f.cls,f)+f.count<=capFor(pid,f.cls))){f.path=path;continue;}}
      else continue;
    }
    if(total<DF.attackAt)continue;
    // attack the nearest enemy tile we expect to beat; otherwise explore
    const d=distMap(f.node,RS);let t=null,bd=Infinity;
    for(const [id,dd] of d){const m=G.nodes[id];if(dd===0||dd>=bd)continue;
      const hostile=(m.owner!=null&&m.owner!==pid)||G.fleets.some(g=>g.owner!==pid&&g.node===id&&g.cls!=='spy'&&V.has(id));
      if(!hostile)continue;
      if(enemyPower(id)*1.4>=pw(myF.filter(g=>g.node===f.node&&g.cls!=='spy').reduce((a,g)=>a+DR[g.cls].dmg*poweredDrones(g),0),myF.filter(g=>g.node===f.node).reduce((a,g)=>a+g.hp,0)))continue;
      bd=dd;t=id;}
    if(t==null){for(const [id,dd] of d)if(!p.explored.has(id)&&dd>0&&dd<bd&&tileCount(pid,id,f.cls,f)+f.count<=capFor(pid,f.cls)){bd=dd;t=id;}}
    if(t!=null){const path=findPath(f.node,t,RS);if(canReach(f,path))f.path=path;}
  }
  // keep a planet centre clear of our squadrons while our leviathan is being built on it
  for(const n of G.nodes)if(n.owner===pid&&n.stations.some(x=>x.type==='levi'))for(const f of G.fleets.filter(f=>f.owner===pid&&f.node===n.id&&!f.settled)){
    const to=n.nbr.find(id=>routeSet(f,pid).has(id)&&!G.fleets.some(g=>g.owner===pid&&g.node===id&&g.cls===f.cls));if(to!=null){f.path=[to];f.bombard=null;}}
  // workers keep away from enemy war fleets: on or next to one without an escort or a turret, they pull back
  const dangerW=new Set();for(const f of G.fleets)if(f.owner!==pid&&f.cls!=='spy'&&DR[f.cls].dmg>0&&V.has(f.node)){dangerW.add(f.node);if(!DR[f.cls].ground)for(const x of G.nodes[f.node].nbr)dangerW.add(x);}
  const guardedW=id=>G.fleets.some(f=>f.owner===pid&&f.node===id&&DR[f.cls].dmg>0)||(G.nodes[id].owner===pid&&armed(G.nodes[id]));
  for(const w of ws){
    const at=w.path.length?w.path[w.path.length-1]:w.node;
    if(!dangerW.has(at)||guardedW(at)||(w.task==='research'&&w.node===p.core))continue;
    const d=distMap(w.node,K);let best=null,bd=Infinity;
    for(const [id,dd] of d)if(!dangerW.has(id)&&G.conn[pid].has(id)&&dd<bd){bd=dd;best=id;}
    if(best==null)best=p.core;
    const path=best===w.node?[]:findPath(w.node,best,K);
    if(path){w.path=path;w.task='idle';w.then=null;w.ref=null;w.tech=null;}
  }
  const targeted=new Set(ws.filter(w=>w.then||w.path.length).map(w=>w.path.length?w.path[w.path.length-1]:w.node));
  const minedHere=id=>ws.some(w=>w.node===id&&(w.task==='mine'||(w.then&&w.then.task==='mine')));
  const researchers=ws.filter(w=>w.task==='research'||(w.then&&w.then.task==='research')).length;
  const send=(w,id,task,ref,tech)=>{if(dangerW.has(id)&&!guardedW(id))return false;if(w.node===id){w.task=task;w.ref=ref??null;w.tech=tech||null;w.then=null;w.path=[];}else{const path=findPath(w.node,id,K);if(!path)return false;w.path=path;w.task='idle';w.then={task,ref:ref??null,tech:tech||null};}targeted.add(id);return true;};
  const miningOf=r=>ws.some(w=>(w.task==='mine'&&G.nodes[w.node].res===r)||(w.then&&w.then.task==='mine'&&G.nodes[w.path.at(-1)??w.node].res===r));
  const scarce=['iron','copper','silicon'].find(r=>p.res[r]<12&&!miningOf(r));
  if(scarce&&!ws.some(w=>w.task==='idle'&&!w.path.length)){
    const rich=ws.filter(w=>w.task==='mine'&&!w.path.length).sort((a,b)=>p.res[G.nodes[b.node].res]-p.res[G.nodes[a.node].res])[0];
    if(rich&&p.res[G.nodes[rich.node].res]>(workerTotal(p)<4?10:DF.reserve<10?18:40))rich.task='idle';
    // short of workers and of a basic resource: the starium miner switches to it (starium can wait)
    else if(workerTotal(p)<5){const gm=ws.find(w=>w.task==='mine'&&!w.path.length&&G.nodes[w.node].center);if(gm)gm.task='idle';}
  }
  // stop mining resources that are already full
  for(const w of ws)if(w.task==='mine'&&!G.nodes[w.node].center&&resTotal(p)>=resCap(pid))w.task='idle';
  // conquest: claim every reachable planet centre and keep one worker mining starium on each one we own
  for(const pl of G.planets||[]){
    const c=G.nodes[pl.center];
    if(!K.has(c.id)||targeted.has(c.id)||warFleetsAt(pid,c.id).length)continue;
    const mining=ws.some(w=>(w.node===c.id&&w.task==='mine')||(w.then&&w.then.task==='mine'&&w.path.at(-1)===c.id));
    if(c.owner===pid&&mining)continue;
    if(c.owner===pid&&scarce&&workerTotal(p)<5)continue; // basic resources first while we are short of workers
    if(c.owner!=null&&c.owner!==pid)continue;
    const d=distMap(c.id,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research'&&!(G.nodes[w.node].center&&w.task==='mine')).sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=12)send(w,c.id,c.owner===pid?'mine':'claim');
  }
  // link owned planet centres to the core network by claiming the free tiles on the shortest route
  for(const pl of G.planets||[]){
    const c=G.nodes[pl.center];if(c.owner!==pid||conn.has(c.id))continue;
    const route=findPath(p.core,c.id,new Set(G.nodes.filter(n=>K.has(n.id)&&(n.owner==null||n.owner===pid)).map(n=>n.id)));if(!route)continue;
    const gap=route.find(id=>G.nodes[id].owner==null&&!targeted.has(id)&&!warFleetsAt(pid,id).length);if(gap==null)continue;
    const d=distMap(gap,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research'&&!(G.nodes[w.node].center&&w.task==='mine')).sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=10)send(w,gap,'claim');
  }
  // reconnect cut-off land that our workers mine: claim the free gap tiles back to the core's network
  {const cut=[...new Set([...ws.filter(w=>!w.path.length&&w.task==='mine'&&!conn.has(w.node)&&G.nodes[w.node].owner===pid).map(w=>w.node),...G.nodes.filter(n=>n.owner===pid&&!conn.has(n.id)&&(n.res||n.stations.length||n.center)).map(n=>n.id)])];
   for(const id of cut.slice(0,2)){
    const route=findPath(p.core,id,new Set(G.nodes.filter(n=>K.has(n.id)&&(n.owner==null||n.owner===pid)).map(n=>n.id)));if(!route)continue;
    const gap=route.find(x=>G.nodes[x].owner==null&&!targeted.has(x)&&!warFleetsAt(pid,x).length);if(gap==null)continue;
    const d=distMap(gap,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research').sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&send(w,gap,'claim'))targeted.add(gap);}}
  // a miner on cut-off land with no storage room there stops, so it can be sent somewhere useful
  for(const w of ws)if(w.task==='mine'&&!w.path.length&&!conn.has(w.node)&&!G.nodes[w.node].center&&!clusterOf(pid,w.node).some(x=>storeCap(x)>storeHeld(x)))w.task='idle';
  // pull the nearest worker off its job to claim a fallen core within 8 hops
  for(const n of G.nodes){
    if(n.type!=='deadcore'||!K.has(n.id)||targeted.has(n.id)||warFleetsAt(pid,n.id).length)continue;
    const d=distMap(n.id,K);
    const w=ws.filter(w=>!w.path.length&&!w.then&&w.task!=='research').sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
    if(w&&(d.get(w.node)??99)<=8)send(w,n.id,'claim');
  }
  const idle=ws.filter(w=>!w.path.length&&!w.then&&(w.task==='idle'||w.task==='claim')&&rnd()<DF.think);
  // a planned build site needs a worker standing on it before the station can be started
  if(p.aiGo!=null){
    const g=p.aiGo;
    if(ws.some(w=>w.node===g&&!w.path.length)||G.nodes[g].owner!==pid)p.aiGo=null;
    else if(!targeted.has(g)){
      const d=distMap(g,K);
      const pool=idle.length?idle:ws.filter(w=>!w.path.length&&!w.then&&w.task==='mine');
      const w=pool.sort((a,b)=>(d.get(a.node)??99)-(d.get(b.node)??99))[0];
      if(w&&send(w,g,'idle')){const k=idle.indexOf(w);if(k>=0)idle.splice(k,1);}
    }
  }
  if(researchers<(G.turn>=12?DF.research:1)&&G.turn>=DF.resAt){const t=aiNextTech(p);const w=t&&(idle.shift()||null);if(w)send(w,p.core,'research',null,t);}
  for(const {n,s} of unfinished){while(idle.length&&buildersOn(s.uid)<s.work){if(!send(idle.shift(),n.id,'build',s.uid))break;}}
  for(const n of G.nodes){if(n.owner!==pid)continue;for(const s of n.stations)if(s.state==='destroyed'&&idle.length&&!ws.some(w=>w.ref===s.uid||(w.then&&w.then.ref===s.uid)))send(idle.shift(),n.id,'fix',s.uid);}
  // the economy comes first: every resource that is running low gets a miner before anyone goes claiming
  for(const r of ['iron','copper','silicon','xeno']){
    if(p.res[r]>=15||miningOf(r)||!idle.length)continue;
    if(r==='xeno'&&p.res.xeno>=6)continue;
    let pick=null;
    for(const w of idle){const d=distMap(w.node,K);for(const [id,dd] of d){const n=G.nodes[id];if(n.owner===pid&&n.res===r&&conn.has(id)&&!minedHere(id)&&!targeted.has(id)&&!warFleetsAt(pid,id).length&&(!pick||dd<pick.dd))pick={w,id,dd};}}
    // none of ours: claim the nearest free one of that kind
    if(!pick)for(const w of idle){const d=distMap(w.node,K);for(const [id,dd] of d){const n=G.nodes[id];if(n.owner==null&&n.res===r&&!targeted.has(id)&&!warFleetsAt(pid,id).length&&!dangerW.has(id)&&(!pick||dd<pick.dd))pick={w,id,dd,claim:true};}}
    if(pick&&send(pick.w,pick.id,pick.claim?'claim':'mine')){idle.splice(idle.indexOf(pick.w),1);targeted.add(pick.id);}
  }
  for(const w of idle){
    if(rnd()<DF.idle)continue;
    const d=distMap(w.node,K);
    let best=null,bd=Infinity,task=null;
    for(const [id,dd] of distMap(w.node,K)){
      const n=G.nodes[id];
      if(n.owner!=null&&isFoe(pid,n.owner)&&(n.type==='res'||n.type==='empty'||n.type==='captured'||n.type==='planet')&&!liveTurrets(n).length&&G.fleets.some(f=>f.node===id&&f.owner===pid&&DR[f.cls].dmg>0)&&!warFleetsAt(pid,id).length&&dd<bd){best=id;bd=dd;task='claim';}
      // a fallen core is a prize: claim it before anyone else does
      if(n.type==='deadcore'&&!warFleetsAt(pid,id).length&&!targeted.has(id)&&dd-6<bd){best=id;bd=dd-6;task='claim';}
    }
    if(best==null)for(const [id,dd] of d){
      const n=G.nodes[id];
      if(!n.res&&n.owner==null&&n.planet==null&&n.type==='empty'&&!targeted.has(id)&&!warFleetsAt(pid,id).length&&n.nbr.some(x=>conn.has(x))&&n.nbr.some(x=>G.nodes[x].res&&G.nodes[x].owner==null)&&dd+3<bd){best=id;bd=dd+3;task='claim';continue;}
      if(!n.res||targeted.has(id)||warFleetsAt(pid,id).length)continue;

      if(n.owner===pid&&!minedHere(id)&&(conn.has(id)||clusterOf(pid,id).some(x=>storeCap(x)>storeHeld(x)))&&dw<bd){best=id;bd=dw;task='mine';}
      else if(n.owner==null){const link=n.nbr.some(x=>conn.has(x))?0:n.nbr.some(x=>G.nodes[x].owner===pid)?2:6;if(dw+.5+link<bd){best=id;bd=dw+.5+link;task='claim';}}
    }
    const guarded=id=>{const m=G.nodes[id];return m.owner!=null&&m.owner!==pid&&liveTurrets(m).length>0;};
    if(best==null&&rnd()<.5)for(const [id,dd] of d){if(!p.explored.has(id)&&!targeted.has(id)&&!guarded(id)&&dd<bd){best=id;bd=dd;task='idle';}}
    if(best!=null)send(w,best,task);

/* ---------- player orders ---------- */
const humanWorkersAt=(id,pid=ME)=>G.workers.filter(w=>w.owner===pid&&w.node===id);
function setTask(w,task,ref){w.path=[];w.then=null;w.task=task;w.ref=ref??null;if(task!=='research')w.tech=null;}
function startStation(pid,nid,type){
  const n=G.nodes[nid];if(!n||!ST[type])return false;
  const why=canBuild(pid,n,type);if(why)return deny(why);
  const ws=humanWorkersAt(nid,pid).filter(w=>!w.path.length);if(!ws.length)return deny(L('You need a worker on this asteroid to build.','Для строительства нужен рабочий на этом астероиде.'));
  const pc=stCost(pid,type);payAt(pid,nid,pc);if(ST[type].gold)P(pid).gold-=ST[type].gold;const s=newStation(n,type,{paid:pc,gold:ST[type].gold||0});n.stations.push(s);
  setTask(ws.find(w=>w.task==='idle')||ws[0],'build',s.uid);
  toast(L(`${sN(type)} started.`,`Стройка начата: ${sN(type)}.`));
  return true;
}
// rovers can only travel across the tiles of the planet they are on
function groundSet(id){const pl=G.nodes[id].planet;return new Set(pl==null?[id]:G.planets[pl].ids);}
// tiles a squadron may route through: known tiles; planets only with Planet movement (rovers stay on their planet);
// and never through a tile where it would end up next to its own leviathan (or, for a leviathan, its own squadrons)
const routeSet=(f,pid)=>{const k=known(pid);let r;
  if(!DR[f.cls].ground){r=f.cls==='leviathan'||has(pid,'planetmove')?k:new Set([...k].filter(x=>x===f.node||G.nodes[x].planet==null));}
  else{const g=groundSet(f.node);r=new Set([...g].filter(x=>k.has(x)||P(pid).ai));}
  return new Set([...r].filter(x=>x===f.node||!leviBlocks(f,x)));};
// a route traced by hand: each tile next to the one before, no tile twice, only tiles in `allowed`
function checkPath(from,path,allowed){
  if(!Array.isArray(path)||!path.length||path.length>60)return null;
  let cur=from;const seen=new Set([from]),out=[];
  for(const x of path){const id=+x;if(!G.nodes[id]||!G.nodes[cur].nbr.includes(id)||seen.has(id)||(allowed&&!allowed.has(id)))return null;seen.add(id);out.push(id);cur=id;}
  return out;
}
function orderFleetMove(f,id,manual){
  const pid=f.owner;if(!G.nodes[id])return false;f.sync=null;
  if(DR[f.cls].ground&&!groundSet(f.node).has(id))return deny(L('Rovers cannot leave their planet.','Роверы не могут покинуть свою планету.'));
  const path=manual?checkPath(f.node,manual,routeSet(f,pid)):findPath(f.node,id,routeSet(f,pid));
  if(!path||(manual&&path[path.length-1]!==id))return deny(L('No known route to that asteroid.','Нет известного пути к этому астероиду.'));
  if(id!==f.node&&leviBlocks(f,id))return deny(f.cls==='leviathan'?L("Your leviathan can't share a tile with your other squadrons.",'Левиафан не может стоять на одной клетке с вашими эскадрильями.'):L("Your squadrons can't share a tile with your leviathan.",'Ваши эскадрильи не могут стоять на одной клетке с левиафаном.'));
  if(id!==f.node&&tileCount(pid,id,f.cls,f)+f.count>capFor(pid,f.cls))return deny(L(`That asteroid can hold only ${tileCap(pid)} of your ${dCount(2,f.cls).replace(/^\d+ /,'')}. Split the squadron first.`,`На этом астероиде поместится не больше: ${dCount(tileCap(pid),f.cls)}. Сначала разделите эскадрилью.`));
  f.path=path;f.bombard=null;f.mergeInto=null;return true;
}
function orderMerge(pid,srcId,tgtId){
  const s=G.fleets.find(f=>f.id===srcId&&f.owner===pid),t=G.fleets.find(f=>f.id===tgtId&&f.owner===pid);
  if(!s||!t||s===t)return false;
  if(s.cls!==t.cls)return deny(L('Only squadrons of the same drone type can merge.','Объединять можно только эскадрильи одного типа.'));
  if(s.up!==t.up)return deny(L('Upgraded drones cannot merge with regular ones.','Улучшенные дроны нельзя объединить с обычными.'));
  if(s.node===t.node){mergeFleets(t,s);toast(L(`${dN(t.cls)} squadrons merged: ${t.count} drones.`,`Эскадрильи объединены: ${dCount(t.count,t.cls)}.`));return true;}
  const path=findPath(s.node,t.node,routeSet(s,pid));if(!path)return deny(L('No known route to that squadron.','Нет известного пути к этой эскадрилье.'));
  if(tileCount(pid,t.node,t.cls,s)+s.count>tileCap(pid))return deny(L(`Merging would put more than ${tileCap(pid)} ${dCount(2,t.cls).replace(/^\d+ /,'')} on one asteroid. Split the squadron first.`,`После объединения на астероиде будет больше ${tileCap(pid)}. Сначала разделите эскадрилью.`));
  s.path=path;s.bombard=null;s.mergeInto=t.id;

function upgradeOne(f){

  if(!canPayAt(pid,n.id,DR[f.cls].cost))return human?deny(L('Not enough resources for the upgrade.','Не хватает ресурсов на улучшение.')):false;

    case 'bomb':{const f=F(c.f);if(!f||!ARTY(f.cls))return false;if(stuck(f))return deny(L("Drones in this squadron have no energy, so it can't fire.",'В этой эскадрилье есть дроны без энергии, он не может стрелять.'));if(!G.nodes[f.node].nbr.includes(+c.to))return deny(L('Artillery can only fire at a neighbouring tile.','Артиллерия стреляет только по соседней клетке.'));

      {const V=vis(pid),tn=+c.to;f.blind=f.cls==='catapult'&&!G.fleets.some(g=>g.node===tn&&isFoe(pid,g.owner)&&V.has(tn)&&g.cls!=='spy')&&!G.workers.some(w=>w.node===tn&&isFoe(pid,w.owner));}

    case 'disf':{const f=F(c.f);if(!f)return false;const n=G.nodes[f.node];if(n.owner!==pid||!live(n,DR[f.cls].ground?'rbarracks':'kazarm').length)return false;

      const d=st.s.hangar[c.c].find(d=>!d.up&&!d.upg);if(!d)return deny(L('Dock a drone of this type here first.','Сначала пристыкуйте сюда дрона этого типа.'));

    case 'sqleave':{const q=(p.squads||[]).find(q=>q.ids.includes(+c.f));if(!q)return false;q.ids=q.ids.filter(x=>x!==+c.f);const f=F(c.f);if(f)f.sync=null;if(q.ids.length<2)p.squads=p.squads.filter(x=>x!==q);return true;}

    case 'resign':if(!p.alive)return false;coreFall(G.nodes[p.core]);return true;
  }
  return false;
}
// the one way the interface changes the match
function order(c){
  if(!G||(G.over&&!G.spectate))return false;
  if(G.waiting)return deny(L('Waiting for the other players to end the turn…','Ждём, пока другие игроки завершат ход…'));
  const ok=applyCmd(ME,c);
  if(ok&&G.online)myCmds.push(c);
