<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jopium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oxanium:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-screen tactical map with a slim top bar, a dock of icon buttons on the right and modal sheets for every menu. Deliberately single dark theme (deep space). */
:root{
  --bg:#060911; --panel:#0c1120; --panel2:#121a2d; --line:#223050; --fg:#dde6f5; --muted:#8190ab;
  --accent:#4da3ff; --warn:#ffb547; --bad:#ff5d6c; --good:#5fd38d; --volt:#ffd84d;
  --f-display:'Oxanium','Segoe UI',system-ui,sans-serif;
  --f-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);overflow:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:grid;grid-template-rows:1fr;height:100%}
#top{position:absolute;top:max(8px,env(safe-area-inset-top,0px));left:0;right:0;margin:0 auto;width:fit-content;z-index:5;max-width:calc(100% - 24px);background:rgba(12,17,32,.92);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#hudbar{position:relative;background:none;border:0;display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:4px 12px;padding:6px 14px;border-radius:12px}
#hudmore{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;max-height:0;opacity:0;overflow:hidden;padding:0 10px;transition:max-height .28s ease,opacity .22s ease,padding .28s ease}
#top.open #hudmore{max-height:90px;opacity:1;padding:2px 10px 9px}
.dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
#bottombar{position:absolute;bottom:max(14px,env(safe-area-inset-bottom,0px));left:0;right:0;margin:0 auto;width:fit-content;display:flex;align-items:center;gap:10px;z-index:5}
#empireBtn{width:44px;height:40px;padding:0;display:grid;place-items:center;background:rgba(18,26,45,.92);border-radius:10px}
#empireBtn svg{width:22px;height:22px}
#timer{background:rgba(12,17,32,.85);border:1px solid var(--line);border-radius:8px;padding:5px 8px}
#alarm{position:fixed;inset:0;pointer-events:none;z-index:40;box-shadow:inset 0 0 80px 18px rgba(255,40,55,.6);opacity:0;transition:opacity .3s}
#alarm.on{opacity:1;animation:alarm 1s ease-in-out infinite}
@keyframes alarm{50%{box-shadow:inset 0 0 50px 10px rgba(255,40,55,.4)}}
.stat{font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.stat b{color:var(--fg);font-weight:500}
.res{display:flex;flex-wrap:wrap;gap:4px 12px}
.chip{display:inline-flex;align-items:center;gap:5px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rb{display:inline-block;width:5px;height:12px;border-radius:1px;flex:none;vertical-align:-1px}
.ico{width:13px;height:13px;flex:none;vertical-align:-2px}
.spacer{flex:1}
.btn{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.seg button,.dname,h3,.mbtns .btn,#hint span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dbtns .btn{min-width:0;padding-left:4px;padding-right:4px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#04101f;font-weight:600}
.btn.small{padding:2px 8px;font-size:12px}
.btn.quiet{background:transparent}
.btn.danger{border-color:#5a2a35;color:#ffb3bb}
#endturn{font:700 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase;padding:9px 12px;white-space:nowrap;width:150px}
#timer.low b{color:var(--warn)}
#mapwrap{position:relative;min-width:0;min-height:0;overflow:hidden}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#map.moving{cursor:crosshair}
.mapctl{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:64px;flex-direction:column;display:flex;gap:6px}
.mapctl .btn{width:34px;height:34px;padding:0;font:600 16px var(--f-mono)}
#hint{position:absolute;left:50%;top:70px;transform:translateX(-50%);background:var(--accent);color:#04101f;border-radius:6px;padding:6px 8px 6px 12px;font-weight:600;font-size:13px;max-width:calc(100% - 140px);display:flex;gap:10px;align-items:center}
#hint button{background:rgba(4,16,31,.15);border:0;border-radius:4px;padding:2px 8px;font-weight:600}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 14px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.4)}
#toast.bad{border-color:var(--bad);color:#ffc7cd}
.badge{display:inline-block;min-width:16px;padding:0 4px;border-radius:8px;background:var(--warn);color:#1a1000;font:600 11px var(--f-mono);text-align:center}
#modal{position:fixed;inset:0;background:rgba(3,5,10,.55);z-index:15;display:grid;place-items:center;padding:16px;overflow:auto}
.sheet{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(560px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px 20px 24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 60px rgba(0,0,0,.55)}
.sheet.wide{width:min(680px,100%)}
h2{font:700 19px var(--f-display);letter-spacing:.03em;margin:0;padding-right:40px;text-wrap:balance}
h3{font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
.sub{color:var(--muted);font-size:13px}
.sec{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 9px;background:var(--panel2);border:1px solid var(--line);border-radius:6px}
.row .grow{flex:1;min-width:0}
.row .acts{display:flex;gap:4px;flex-wrap:wrap}
.row.click{cursor:pointer}
.row.click:hover{border-color:var(--accent)}
.row.drop{border-color:var(--accent);background:#16233d}
.full{flex-basis:100%;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.handle{cursor:grab;touch-action:none;user-select:none;color:var(--muted);font:600 16px var(--f-mono);padding:0 4px}
.dragghost{position:fixed;pointer-events:none;opacity:.85;z-index:70;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{display:inline-block;padding:0 7px;border-radius:9px;font:500 11px var(--f-mono);border:1px solid currentColor}
.good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)} .muted{color:var(--muted)}
.cost{display:inline-flex;flex-wrap:wrap;gap:2px 8px;font:12px var(--f-mono);align-items:center}
.cost span{display:inline-flex;align-items:center;gap:4px}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar.hp i{background:var(--good)}
.heart{color:#ff6b81}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
select{background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:5px;padding:3px 4px;font:12px var(--f-body)}
select option:disabled{color:#56627a}
input[type=range]{accent-color:var(--accent);width:100%;min-width:0}
.log{display:flex;flex-direction:column;gap:6px}
.log .e{padding:7px 9px;border-left:3px solid var(--line);background:var(--panel2);border-radius:0 6px 6px 0;font-size:13px;cursor:pointer}
.log .e.battle{border-left-color:var(--bad)} .log .e.warn{border-left-color:var(--warn)} .log .e.good{border-left-color:var(--good)} .log .e.info{border-left-color:var(--accent)}
.notice{padding:9px 11px;border:1px solid var(--warn);border-radius:6px;background:#2a1f0c;color:#ffd79a;font-size:13px}
.x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:6px;background:none;border:1px solid var(--line);color:var(--muted);font-size:16px;z-index:1}
.x:hover{color:var(--fg);border-color:var(--accent)}
/* tech web */
.web{position:relative;width:100%;max-width:600px;aspect-ratio:1;margin:0 auto}
.web svg{position:absolute;inset:0;width:100%;height:100%}
.tn{position:absolute;transform:translate(-50%,-50%);width:14%;aspect-ratio:1;border-radius:50%;border:2px solid #39486a;background:#0f1628;color:var(--muted);font:600 clamp(8px,1.7vw,11px)/1.15 var(--f-display);letter-spacing:.02em;display:grid;place-items:center;text-align:center;padding:4px;box-sizing:border-box}
.tn.avail{border-color:var(--accent);color:var(--fg)}
.tn.done{border-color:var(--good);background:#0f2a1d;color:#c9f5da}
.tn.on{box-shadow:0 0 0 3px rgba(77,163,255,.45)}
.tn.core{width:13%;border-color:var(--accent);background:radial-gradient(circle,#2a5d99,#0f1628);color:var(--fg)}
.tdetail{min-height:72px}
/* star-map tech tree: full screen, a bright core in the middle, techs as stars in constellations */
#techscr{position:fixed;inset:0;z-index:16;overflow:hidden;background:#060911;touch-action:none;cursor:grab}
#techbg{position:absolute;inset:0;width:100%;height:100%}
#techstage{position:absolute;left:50%;top:50%;width:min(100vw,100vh);height:min(100vw,100vh);transform:translate(-50%,-50%);transform-origin:50% 50%;will-change:transform}
#techstage svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.tcore{position:absolute;left:50%;top:50%;width:10%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;border:0;padding:0;background:radial-gradient(circle,#fff 0 52%,#eef4ff 62%,rgba(210,225,255,.55) 70%,rgba(170,200,255,0) 72%);box-shadow:0 0 28px 8px rgba(255,255,255,.55),0 0 90px 30px rgba(140,180,255,.32);color:#24305a;font:700 clamp(8px,1.5vmin,12px) var(--f-display);letter-spacing:.16em;text-transform:uppercase}
.tcore:focus-visible{outline:2px solid #fff;outline-offset:6px}
.tcore::after{content:'';position:absolute;inset:-60%;border-radius:50%;background:radial-gradient(circle,rgba(170,200,255,.35),rgba(140,180,255,0) 65%);animation:corepulse 3.4s ease-in-out infinite;pointer-events:none;will-change:opacity}
@keyframes corepulse{50%{opacity:.35}}
.star{position:absolute;transform:translate(-50%,-50%);background:none;border:0;padding:0;width:13%;height:10%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;color:inherit}
.star i{display:block;width:5px;height:5px;border-radius:50%;background:#d6e4ff;box-shadow:0 0 6px 2px rgba(170,200,255,.55);animation:twinkle 2.8s ease-in-out infinite;position:relative;will-change:transform,opacity}
.star.locked i{background:#7f8fb2;box-shadow:0 0 3px 1px rgba(120,140,190,.3)}
.star.prog i{width:7px;height:7px;background:#fff;box-shadow:0 0 9px 3px rgba(190,215,255,.7)}
.star.done i{width:12px;height:12px;background:#fff;box-shadow:0 0 12px 4px rgba(255,255,255,.85),0 0 34px 12px rgba(150,190,255,.5);animation:shine 3.2s ease-in-out infinite;will-change:transform}
.star.done i::before,.star.done i::after{content:'';position:absolute;left:50%;top:50%;width:44px;height:1.5px;background:linear-gradient(90deg,transparent,#fff,transparent);transform:translate(-50%,-50%)}
.star.done i::after{transform:translate(-50%,-50%) rotate(90deg)}
.star.sel i{outline:1px solid rgba(255,255,255,.75);outline-offset:7px}
.star .lbl{font:600 clamp(8px,1.6vmin,12px)/1.1 var(--f-display);color:#9aacd2;letter-spacing:.04em;text-align:center;text-shadow:0 0 6px #000}
.star.done .lbl{color:#fff}
.star.locked .lbl{color:#59668a}
.star:focus-visible{outline:none}.star:focus-visible .lbl{color:#fff;text-decoration:underline}
@keyframes twinkle{0%,100%{opacity:.55;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
@keyframes shine{50%{transform:scale(1.18)}}
.cline{stroke:#fff;stroke-width:.32;stroke-linecap:round}
.cline.new{stroke-dasharray:60;stroke-dashoffset:60;animation:draw 1.8s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.cguide{stroke:#33426a;stroke-width:.16;stroke-dasharray:.5 1.1}
.cprog{fill:none;stroke:#bcd4ff;stroke-width:.3;stroke-linecap:round}
.blabel{fill:#56658c;font-size:2.1px;font-family:Oxanium,sans-serif;letter-spacing:.5px}
/* barracks cards and pop-ups */
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.dcard{display:flex;flex-direction:column;gap:6px;padding:9px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.dname{background:none;border:0;padding:0;text-align:left;font:700 14px var(--f-display);letter-spacing:.03em;color:var(--fg)}
.dname:hover span{color:var(--accent)}
.dbtns{display:flex;gap:6px;margin-top:2px}.dbtns .btn{flex:1}
.stats{display:inline-flex;gap:10px;font-size:12px;color:var(--fg);align-items:center}.stats span{display:inline-flex;align-items:center;gap:4px}
#popup{position:fixed;inset:0;z-index:25;display:grid;place-items:center;padding:16px;background:rgba(3,5,10,.45)}
.pcard{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(440px,100%);max-height:calc(100% - 8px);overflow:auto;padding:20px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#dronecv{width:100%;height:auto;border-radius:8px;border:1px solid var(--line);box-sizing:border-box;display:block}
.pcard{overflow-x:hidden}
/* menus */
#overlay{position:fixed;inset:0;background:rgba(3,5,10,.35);display:grid;place-items:center;padding:16px;z-index:30;overflow:auto}
#overlay.dim{background:rgba(3,5,10,.62)}
.card{position:relative;background:rgba(12,17,32,.94);border:1px solid var(--line);border-radius:10px;padding:24px;max-width:520px;width:100%;display:flex;flex-direction:column;gap:16px;box-sizing:border-box}
.card h1{font:800 26px var(--f-display);letter-spacing:.06em;margin:0}
.card p{color:var(--muted);margin:0}
.logo{font:800 clamp(44px,12vw,72px)/1 var(--f-display)!important;letter-spacing:.22em!important;text-align:center;background:linear-gradient(180deg,#e9f1ff,#4da3ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.tag{text-align:center;font:500 12px var(--f-mono)!important;letter-spacing:.2em;text-transform:uppercase}
.mbtns{display:flex;flex-direction:column;gap:10px}
.mbtns .btn{padding:12px;font:700 14px var(--f-display);letter-spacing:.12em;text-transform:uppercase;border-color:var(--accent);background:rgba(18,26,45,.6)}
.mbtns .btn.danger{border-color:var(--bad);color:#ffb3bb}
.mbtns .btn{transition:background .18s,box-shadow .18s,color .18s}
.mbtns .btn:hover:not(:disabled){background:rgba(77,163,255,.24);box-shadow:0 0 16px rgba(77,163,255,.5);color:#fff}
.mbtns .btn.danger:hover{background:rgba(255,93,108,.2);box-shadow:0 0 16px rgba(255,93,108,.45);color:#fff}
.mrow{display:flex;gap:10px}.mrow .btn{flex:1;min-width:0}
#ver{position:fixed;right:10px;bottom:6px;font:500 10px var(--f-mono);color:rgba(129,144,171,.38);z-index:31;pointer-events:none;letter-spacing:.04em}
.pchip{position:fixed;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));z-index:31;display:flex;flex-direction:column;align-items:center;gap:5px;background:rgba(12,17,32,.9);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.pchip:hover{border-color:var(--accent)}
.pchip .av{width:40px;height:40px}
.pchip .elo{font:500 11px var(--f-mono);color:var(--muted);text-align:center}
.av{border-radius:50%;background:#18233c center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.av svg{width:58%;height:58%;opacity:.55}
.avbig{width:96px;height:96px;cursor:pointer;margin:0 auto}
.avbig:hover{border-color:var(--accent)}
input.txt{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:8px 10px;color:var(--fg);font:14px var(--f-body);width:100%;box-sizing:border-box}
input.txt:focus{border-color:var(--accent);outline:none}
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slot{display:flex;align-items:center;gap:8px;padding:8px;border:1px dashed var(--line);border-radius:8px;min-height:44px;box-sizing:border-box;font-size:13px;color:var(--muted);min-width:0}
.slot.on{border-style:solid;border-color:var(--accent);color:var(--fg);background:var(--panel2)}
.slot .av{width:28px;height:28px}
#overlay[data-view=lobby]{background:#060911;align-items:end;place-items:end center}
#lobbycv.full{position:fixed;inset:0;width:100%;height:100%;border:0;border-radius:0;z-index:0}
.lobbyb{position:relative;z-index:1;width:min(560px,100%);display:flex;flex-direction:column;gap:12px;padding-bottom:max(12px,env(safe-area-inset-bottom,0px))}
.lobbyb h1{font:800 20px var(--f-display);letter-spacing:.06em;margin:0}
.lobbyb .opts{justify-content:center}.slot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lobbycv{width:100%;height:220px;border-radius:8px;border:1px solid var(--line);display:block;background:#060911}
.lcount{text-align:center;font:600 15px var(--f-mono);letter-spacing:.06em}
.lbrow{display:grid;grid-template-columns:40px 36px 1fr auto;align-items:center;gap:10px;padding:8px 10px;background:var(--panel2);border:1px solid var(--line);border-radius:8px}
.lbrow .rk{display:grid;place-items:center;height:32px;border-radius:6px;background:var(--accent);color:#04101f;font:700 15px var(--f-display)}
.lbrow .av{width:36px;height:36px}.lbrow b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lbhead{display:grid;grid-template-columns:40px 36px 1fr auto;gap:10px;padding:0 10px;font:600 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.empty{padding:28px 12px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:8px;font-size:13px}
.field{display:flex;flex-direction:column;gap:6px}
.field .lab{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
.field .lab b{color:var(--fg);font:500 13px var(--f-mono)}
.field .seg{align-self:flex-start}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:none;border:0;padding:7px 14px;color:var(--muted);font:500 13px var(--f-mono)}
.seg button.on{background:var(--accent);color:#04101f;font-weight:600}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.switch{position:relative;width:44px;height:24px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);padding:0;flex:none;transition:background .2s}
.switch i{position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .2s,background .2s}
.switch.on{background:var(--accent);border-color:var(--accent)}.switch.on i{transform:translateX(20px);background:#04101f}
@media (max-width:760px){
  #hudbar{gap:2px 8px;padding:5px 10px}
  #hudbar .chip,#hudbar .stat{font-size:12px;gap:3px}
  #res .chip.muted{display:none}
  .sheet{padding:16px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <div id="mapwrap">
    <canvas id="map" aria-label="Asteroid belt map"></canvas>

// longer Russian words never stretch a button or wrap it onto two lines: the text shrinks a little until it fits
function fitText(root){
  if(!root)return;
  for(const el of root.querySelectorAll('.btn,.seg button,.dname,h3,#hint span')){
    if(el.offsetParent===null)continue;
    el.style.fontSize='';
    const cs=getComputedStyle(el),room=el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);
    const rg=document.createRange();rg.selectNodeContents(el);
    let fs=parseFloat(cs.fontSize),min=Math.max(8,fs*.7);
    while(rg.getBoundingClientRect().width>room-.5&&fs>min){fs-=.5;el.style.fontSize=fs+'px';}
  }
}

const key=(q,r)=>q+','+r;
// target share of nodes by neighbour count (1..6): 3 and 4 common, 2 and 5 rare, 1 and 6 very rare
const DEG_TARGET=[0,.03,.12,.35,.35,.12,.03];
function growShape(target){
  // branching growth that favours cells touching 2-3 existing ones, so the map sprawls into
  // arms, thin chains and clumps with gaps, instead of one round blob
  const cells=new Map([[key(0,0),{q:0,r:0}]]);
  const nCount=(q,r)=>DIRS.reduce((a,[x,y])=>a+(cells.has(key(q+x,r+y))?1:0),0);
  const WK=[0,.8,1.8,.8,.2,.06,.03];
  const front=new Map();
  const addFront=(q,r)=>{for(const [x,y] of DIRS){const k=key(q+x,r+y);if(!cells.has(k))front.set(k,{q:q+x,r:r+y});}};
  addFront(0,0);
  while(cells.size<target){
    const list=[...front.values()];let tot=0;
    const w=list.map(c=>{const v=WK[nCount(c.q,c.r)]*(.4+rnd());tot+=v;return v;});
    let pick=rnd()*tot,i=0;while(i<w.length-1&&pick>w[i]){pick-=w[i];i++;}
    const c=list[i];const k=key(c.q,c.r);cells.set(k,c);front.delete(k);addFront(c.q,c.r);
  }
  return cells;
}
function degScore(cells){
  const h=[0,0,0,0,0,0,0];
  for(const {q,r} of cells.values())h[DIRS.reduce((a,[x,y])=>a+(cells.has(key(q+x,r+y))?1:0),0)]++;
  return h.reduce((a,v,i)=>a+Math.abs(v/cells.size-DEG_TARGET[i])*(i===1||i===6?2:1),0);
}
// conquest planets: 7 tiles each (a centre and 6 sections around it)
const PLANETS=[
  {name:'Stormus',r:'Стормус',c:'#c4483c',c2:'#7a1f1a',kind:'cracks'},
  {name:'Aqua',r:'Аква',c:'#3b8fd8',c2:'#164a85',kind:'bands'},
  {name:'Tauron',r:'Таурон',c:'#8d5f3c',c2:'#4a2d18',kind:'rift'},
  {name:'Regium',r:'Региум',c:'#9298a3',c2:'#4d525c',kind:'craters'},
  {name:'Urum',r:'Урум',c:'#4ea95c',c2:'#1f5b2b',kind:'patches'}
];
const GOLD_WIN=100;
const hexDist=(a,b)=>(Math.abs(a.q-b.q)+Math.abs(a.r-b.r)+Math.abs(a.q+a.r-b.q-b.r))/2;
// a jagged line across the planet, in ring-radius units around its centre
function jag(x0,y0,x1,y1,n,amp){const pts=[[x0,y0]];for(let i=1;i<n;i++){const t=i/n;pts.push([x0+(x1-x0)*t+(rnd()-.5)*amp,y0+(y1-y0)*t+(rnd()-.5)*amp]);}pts.push([x1,y1]);return pts;}
function planetLook(kind){
  const outline=[];for(let i=0;i<36;i++)outline.push(1.5+.1*Math.sin(i*.9+rnd())+rnd()*.06);
  const f={outline,lines:[],dots:[],blobs:[]};
  const rp=()=>{const a=rnd()*Math.PI*2,r=Math.sqrt(rnd())*1.15;return [Math.cos(a)*r,Math.sin(a)*r];};
  if(kind==='cracks')for(let i=0;i<6;i++){const [x,y]=rp(),a=rnd()*Math.PI*2,l=.4+rnd()*.5;f.lines.push({w:1.4,pts:jag(x,y,x+Math.cos(a)*l,y+Math.sin(a)*l,5,.12)});}
  if(kind==='rift'){const a=rnd()*Math.PI;f.lines.push({w:4,pts:jag(-Math.cos(a)*1.3,-Math.sin(a)*1.3,Math.cos(a)*1.3,Math.sin(a)*1.3,9,.22)});}
  if(kind==='craters')for(let i=0;i<10;i++){const [x,y]=rp();f.dots.push([x,y,.07+rnd()*.13]);}
  if(kind==='bands')for(let i=0;i<4;i++)f.blobs.push([(rnd()-.5)*1.4,-1+i*.6+rnd()*.2,.9+rnd()*.4,.12+rnd()*.08]);
  if(kind==='patches')for(let i=0;i<7;i++){const [x,y]=rp();f.blobs.push([x,y,.18+rnd()*.22,.14+rnd()*.14]);}
  return f;
}
function genMap(np,per,mode){
  const nPl=Math.min(5,np-1),target=per*np+np;
  for(let attempt=0;attempt<60;attempt++){
    // make many candidate shapes and keep the one closest to the target neighbour-count spread
    let cells=null,best=Infinity;
    for(let t=0;t<24;t++){const c=growShape(target+7*nPl);const s=degScore(c);if(s<best){best=s;cells=c;}}
    // planets: pick well-spread centres and complete the ring of 6 sections around each
    const plan=[];
    if(nPl){
      const filled=c=>DIRS.reduce((a,[x,y])=>a+(cells.has(key(c.q+x,c.r+y))?1:0),0);
      const cand=shuffle([...cells.values()]).sort((a,b)=>filled(b)-filled(a));
      for(const c of cand){
        if(plan.length===nPl)break;
        if(plan.some(p=>hexDist(p,c)<5))continue;
        plan.push(c);
      }
      if(plan.length<nPl)continue;
      for(const c of plan)for(const [x,y] of DIRS){const k=key(c.q+x,c.r+y);if(!cells.has(k))cells.set(k,{q:c.q+x,r:c.r+y});}
      // planets never count as asteroids: trim or grow the free cells until exactly target remain
      const pk=new Set();for(const c of plan){pk.add(key(c.q,c.r));for(const [x,y] of DIRS)pk.add(key(c.q+x,c.r+y));}
      const nb=(q,r)=>DIRS.map(([x,y])=>key(q+x,r+y)).filter(k=>cells.has(k));
      const connected=()=>{const first=cells.keys().next().value;const seen=new Set([first]);const st=[first];while(st.length){const k=st.pop();const c=cells.get(k);for(const m of nb(c.q,c.r))if(!seen.has(m)){seen.add(m);st.push(m);}}return seen.size===cells.size;};
      let free=cells.size-pk.size,guard=0;
      while(free>target&&guard++<4000){
        const cand=shuffle([...cells.keys()].filter(k=>!pk.has(k))).sort((a,b)=>nb(cells.get(a).q,cells.get(a).r).length-nb(cells.get(b).q,cells.get(b).r).length);
        let done=false;
        for(const k of cand.slice(0,12)){const c=cells.get(k);cells.delete(k);if(connected()){done=true;free--;break;}cells.set(k,c);}
        if(!done)break;
      }
      while(free<target&&guard++<8000){
        const fr=[];for(const c of cells.values())for(const [x,y] of DIRS){const k=key(c.q+x,c.r+y);if(!cells.has(k))fr.push({q:c.q+x,r:c.r+y});}
        const c=fr[Math.floor(rnd()*fr.length)];cells.set(key(c.q,c.r),c);free++;
      }
      if(free!==target)continue;
    }
    const nodes=[];const idx=new Map();
    for(const [k,{q,r}] of cells){const n={id:nodes.length,q,r,x:R*(q+r/2),y:R*(SQ3/2)*r,nbr:[],type:'empty',res:null,owner:null,coreOf:null,coreHp:0,stations:[],store:{},estore:0,cut:0,planet:null,center:false};n.shape=Array.from({length:7},()=>.75+rnd()*.45);idx.set(k,n.id);nodes.push(n);}
    for(const n of nodes)for(const [a,b] of DIRS){const k=key(n.q+a,n.r+b);if(idx.has(k))n.nbr.push(idx.get(k));}
    const looks=shuffle([0,1,2,3,4]).slice(0,nPl);
    const planets=plan.map((c,i)=>{
      const ci=idx.get(key(c.q,c.r));const ids=[ci,...DIRS.map(([x,y])=>idx.get(key(c.q+x,c.r+y)))];
      ids.forEach(id=>{const n=nodes[id];n.type='planet';n.planet=i;n.center=id===ci;});
      return {...PLANETS[looks[i]],center:ci,ids,look:planetLook(PLANETS[looks[i]].kind)};
    });
    const hops=from=>{const d=new Map([[from,0]]);const q=[from];while(q.length){const id=q.shift();for(const nb of nodes[id].nbr)if(!d.has(nb)){d.set(nb,d.get(id)+1);q.push(nb);}}return d;};
    const plD=planets.map(pl=>hops(pl.center));
    // cores: random asteroids at least 3 hops from each other and from planet centres, never on a dead end
    let cores=[];
    const coreOk=n=>n.nbr.length>=3&&n.planet==null&&plD.every(d=>d.get(n.id)>=3);
    const nearPl=id=>Math.min(...plD.map(d=>d.get(id)??99));
    for(let tries=0;tries<(nPl?60:1);tries++){
      cores=[];
      for(const n of shuffle(nodes.filter(coreOk))){
        if(cores.length===np)break;
        const d=hops(n.id);if(cores.every(c=>d.get(c)>=3))cores.push(n.id);
      }
      if(cores.length<np)break;
      if(!nPl)break;
      const ds=cores.map(nearPl);if(Math.max(...ds)-Math.min(...ds)<=1)break;
      cores=[];
    }
    if(cores.length<np)continue;
    const near=new Set();cores.forEach(c=>nodes[c].nbr.forEach(x=>near.add(x)));
    const free=nodes.filter(n=>!cores.includes(n.id)&&n.planet==null);
    const xenoN=Math.max(np,Math.round(free.length*.1));
    const xenoSpots=shuffle(free.filter(n=>!near.has(n.id))).slice(0,xenoN);
    xenoSpots.forEach(n=>{n.type='res';n.res='xeno';});
    const rest=shuffle(free.filter(n=>n.res!=='xeno'));
    const empties=Math.round(free.length*.25);
    rest.forEach((n,i)=>{if(i<empties){n.type='empty';n.res=null;}else{n.type='res';n.res=['iron','copper','silicon'][i%3];}});
    cores.forEach((c,pid)=>{
      const core=nodes[c];core.type='core';core.coreOf=pid;core.owner=pid;core.coreHp=CORE_HP;
      // fairness: every core gets iron and copper within 2 hops
      const d=hops(c);
      for(const r of ['iron','copper']){
        if([...d].some(([id,h])=>h>0&&h<=2&&nodes[id].res===r))continue;
        const cand=shuffle([...d].filter(([id,h])=>h>0&&h<=2&&!cores.includes(id)&&nodes[id].planet==null&&nodes[id].res!=='xeno'&&nodes[id].res!==(r==='iron'?'copper':'iron')).map(([id])=>nodes[id]));
        if(cand[0]){cand[0].type='res';cand[0].res=r;}
      }
    });
    return {nodes,cores,planets};
  }
  throw new Error('Could not build a map');
}

// every worker gets a name no other living worker on the map is using
function freshName(){
  const used=new Set(G.workers.map(w=>w.name));
  while(G.names.length){const n=G.names.pop();if(!used.has(n))return n;}
  const free=shuffle(NAMES.filter(n=>!used.has(n)));if(free.length)return free[0];
  for(let k=2;;k++){const n=NAMES.find(b=>!used.has(b+' '+k));if(n)return n+' '+k;}
}

  const s={uid:UID++,type,state:'build',work:ST[type].t,hp:0,maxHp:ST[type].hp||0,queue:[],hangar:emptyHangar(),charge:0,aim:null,ox:Math.cos(a)*STR,oy:Math.sin(a)*STR,bx:Math.cos(a)*STR,by:Math.sin(a)*STR};
  return Object.assign(s,extra||{});
}
const emptyHangar=()=>Object.fromEntries(CLS.map(c=>[c,[]]));
const newDrone=c=>({hp:DR[c].hp,en:BATT,up:false});
function newFleet(pid,cls,k,node,up){return {id:UID++,owner:pid,cls,count:k,hp:k*DR[cls].hp,en:Array(k).fill(BATT),node,path:[],up:!!up,bombard:null,mergeInto:null,trail:null,buf:0,dx:0,dy:0};}

/* ---------- queries ---------- */
function explore(pid,id){const p=P(pid);p.explored.add(id);if(has(pid,'deepscan'))G.nodes[id].nbr.forEach(x=>p.explored.add(x));}
function distMap(from,allowed,maxD){const d=new Map([[from,0]]);const q=[from];while(q.length){const id=q.shift();if(maxD!=null&&d.get(id)>=maxD)continue;for(const nb of G.nodes[id].nbr){if(d.has(nb)||(allowed&&!allowed.has(nb)))continue;d.set(nb,d.get(id)+1);q.push(nb);}}return d;}
function fleetSight(pid){const s=new Set();for(const f of G.fleets)if(f.owner===pid)distMap(f.node,null,f.cls==='spy'?2:1).forEach((d,id)=>s.add(id));return s;}
function vis(pid){if(pid===ME&&G.spectate)return new Set(G.nodes.map(n=>n.id));const p=P(pid);const s=new Set(p.explored);p.explored.forEach(id=>G.nodes[id].nbr.forEach(x=>s.add(x)));fleetSight(pid).forEach(id=>s.add(id));return s;}
const known=vis;
// a settled, upgraded charger on an unclaimed tile links that tile into its owner's network
const chargerLink=(pid,id)=>G.nodes[id].owner==null&&G.fleets.some(f=>f.owner===pid&&f.cls==='charger'&&f.up&&f.settled&&f.node===id);
function bfsOwned(pid,start){const s=new Set([start]);const q=[start];while(q.length){const id=q.shift();for(const nb of G.nodes[id].nbr)if(!s.has(nb)&&(G.nodes[nb].owner===pid||chargerLink(pid,nb))){s.add(nb);q.push(nb);}}return s;}
function connSet(pid){const p=P(pid);if(!p.alive)return new Set();return bfsOwned(pid,p.core);}
function findPath(from,to,allowed){
  if(from===to)return [];
  const prev=new Map([[from,-1]]);const q=[from];
  while(q.length){const id=q.shift();if(id===to)break;for(const nb of G.nodes[id].nbr){if(prev.has(nb))continue;if(allowed&&!allowed.has(nb))continue;prev.set(nb,id);q.push(nb);}}
  if(!prev.has(to))return null;
  const path=[];let c=to;while(c!==from){path.unshift(c);c=prev.get(c);}return path;
}
const tileCap=pid=>has(pid,'fleet10')?10:6;
function tileCount(pid,node,cls,ex){let k=0;for(const f of G.fleets)if(f.owner===pid&&f.node===node&&f.cls===cls&&f!==ex)k+=f.count;return k;}
const live=(n,t)=>n.stations.filter(s=>s.state==='done'&&s.type===t);
const liveTurrets=n=>n.stations.filter(s=>s.state==='done'&&isTurret(s.type)&&s.hp>0);
function armed(n){return (n.type==='core'&&n.coreHp>0)||liveTurrets(n).some(s=>s.type!=='death');}
const warFleetsAt=(pid,id)=>G.fleets.filter(f=>f.node===id&&f.owner!==pid&&f.cls!=='spy');
function hostileAt(pid,id){const n=G.nodes[id];return warFleetsAt(pid,id).length>0||(n.owner!=null&&n.owner!==pid&&armed(n));}
const enemyXray=(pid,id)=>{const n=G.nodes[id];return n.owner!=null&&n.owner!==pid&&live(n,'xray').some(s=>s.hp>0);};
function findStation(uid){for(const n of G.nodes)for(const s of n.stations)if(s.uid===uid)return {n,s};return null;}
function nodeName(n){
  const sh=q=>pShort(P(q));
  if(n.type==='core')return n.coreOf===ME?L('Your core','Ваше ядро'):L(sh(n.coreOf)+' core','Ядро '+sh(n.coreOf));
  if(n.type==='wreck')return L('Core wreck','Обломки ядра');
  if(n.type==='deadcore')return L('Fallen '+sh(n.coreOf)+' core','Павшее ядро '+sh(n.coreOf));
  if(n.type==='captured')return L('Captured '+sh(n.coreOf)+' core','Захваченное ядро '+sh(n.coreOf));
  if(n.planet!=null){const pl=G.planets[n.planet];return RU()?(n.center?'Центр планеты ':'Участок планеты ')+pl.r:pl.name+(n.center?' centre':' section');}
  if(n.res)return L(RINFO[n.res].n+' asteroid',RINFO[n.res].ra+' астероид');
  return L('Empty asteroid','Пустой астероид');
}
const lc=s=>s.charAt(0).toLowerCase()+s.slice(1);
function log(text,kind,node,pids){G.log.push({text,kind,node:node??null,pids:pids||[]});}

/* ---------- economy ---------- */
// Draft 9: the core holds 100 resources in total; each storage adds 30 and a captured core adds 100
function sharedCap(pid){let k=0;for(const id of G.conn[pid]||[]){const n=G.nodes[id];k+=30*live(n,'storage').length+(n.type==='captured'?100:0);}return k;}
const resTotal=p=>RES.reduce((a,r)=>a+p.res[r],0);
const resCap=pid=>BASE_RES+sharedCap(pid);
const overflow=p=>Math.max(0,resTotal(p)-resCap(p.id));
function addRes(p,r,amt){const room=Math.max(0,resCap(p.id)-resTotal(p));const a=Math.max(0,Math.min(amt,room));p.res[r]+=a;return a;}
function clipRes(p){const lost={};let over=resTotal(p)-resCap(p.id);while(over>0){const r=RES.reduce((a,b)=>p.res[a]>=p.res[b]?a:b);p.res[r]--;lost[r]=(lost[r]||0)+1;over--;}return lost;}
function energyCap(pid){let c=BASE_ENERGY;for(const id of G.conn[pid]||[])c+=30*live(G.nodes[id],'estorage').length;return c;}
// the core makes 10, each generator 5 and each captured core 10
function energyProd(pid){if(!P(pid).alive)return 0;let e=10;for(const id of G.conn[pid]||[]){const n=G.nodes[id];e+=5*live(n,'generator').length+(n.type==='captured'?10:0);}return e;}
// energy one drone of this fleet uses a turn: 0.5, or 1 for a war drone on a planet tile; leviathans and settled chargers use none
const droneUse=f=>f.cls==='leviathan'||f.settled?0:(!DR[f.cls].ground&&G.nodes[f.node].planet!=null?1:.5);
// fleets on their owner's connected network are powered by the core; spies always are
const fleetOnGrid=f=>f.cls==='spy'||(G.conn[f.owner]&&G.conn[f.owner].has(f.node));
const emptyDrones=f=>(f.en||[]).filter(e=>e<=0).length;
const poweredDrones=f=>f.cls==='leviathan'?f.count:f.count-emptyDrones(f);
// a fleet with an empty drone can't move or fire until it is recharged, or the empty drones blow themselves up
const stuck=f=>f.cls!=='leviathan'&&emptyDrones(f)>0;
const avgEn=f=>f.en&&f.en.length?Math.round(f.en.reduce((a,e)=>a+e,0)/f.en.length*10)/10:0;
function energyUse(pid){
  let u=0;const conn=G.conn[pid];
  for(const f of G.fleets)if(f.owner===pid&&fleetOnGrid(f))u+=droneUse(f)*f.count;
  for(const w of G.workers){if(w.owner!==pid||w.path.length||!conn.has(w.node))continue;
    if(w.task==='build')u+=1;if(w.task==='mine')u+=has(pid,'drills')?.5:1;}
  for(const id of conn)for(const st of live(G.nodes[id],'barrier'))if(!st.off)u+=1;
  return u;
}
// pay energy for something standing on tile id: from the core's grid, or from a cut-off cluster's own batteries
// a cut-off cluster's own energy: what its batteries hold, what it makes and what it uses a turn
function clusterEnergy(pid,id){
  const cl=clusterOf(pid,id),ids=new Set(cl.map(x=>x.id));
  const prod=cl.reduce((a,x)=>a+5*live(x,'generator').length+(x.type==='captured'?10:0),0);
  let use=0;for(const w of G.workers)if(w.owner===pid&&ids.has(w.node)&&!w.path.length){if(w.task==='build')use+=1;if(w.task==='mine')use+=has(pid,'drills')?.5:1;}
  for(const x of cl)for(const st of live(x,'barrier'))if(!st.off)use+=1;
  for(const f of G.fleets)if(f.owner===pid&&ids.has(f.node)&&!fleetOnGrid(f))use+=droneUse(f)*f.count;
  return {stored:cl.reduce((a,x)=>a+x.estore,0),cap:cl.reduce((a,x)=>a+30*live(x,'estorage').length,0),prod,use};
}
function payEnergy(pid,id,amt){
  const p=P(pid);if(G.conn[pid].has(id)){if(p.energy<amt)return false;p.energy=Math.round((p.energy-amt)*10)/10;return true;}
  if(G.nodes[id].owner!==pid)return false;
  const cl=clusterOf(pid,id);if(cl.reduce((a,x)=>a+x.estore,0)<amt)return false;
  let need=amt;for(const x of cl){const t=Math.min(need,x.estore);x.estore-=t;need-=t;if(need<=0)break;}return true;
}
const storeCap=n=>30*live(n,'storage').length+(n.type==='captured'?100:0);
const storeHeld=n=>Object.values(n.store).reduce((a,v)=>a+v,0);
function clusterOf(pid,id){return [...bfsOwned(pid,id)].map(x=>G.nodes[x]).filter(x=>x.owner===pid);}
function walletAt(pid,id){
  if(G.conn[pid].has(id))return {...P(pid).res};
  const t=Object.fromEntries(RES.map(r=>[r,0]));
  for(const n of clusterOf(pid,id))for(const r in n.store)t[r]+=n.store[r];
  return t;
}
const canPayAt=(pid,id,c)=>{const w=walletAt(pid,id);return Object.entries(c).every(([k,v])=>w[k]>=v);};
function payAt(pid,id,c){
  if(G.conn[pid].has(id)){const p=P(pid);for(const k in c)p.res[k]-=c[k];return;}
  for(const k in c){let need=c[k];for(const n of clusterOf(pid,id)){const t=Math.min(need,n.store[k]||0);n.store[k]=(n.store[k]||0)-t;need-=t;if(!need)break;}}
}
function refundAt(pid,id,c){
  if(G.conn[pid].has(id)){const p=P(pid);for(const k in c)addRes(p,k,c[k]);return;}
  for(const k in c){let left=c[k];for(const n of clusterOf(pid,id)){const room=storeCap(n)-storeHeld(n);const t=Math.min(left,room);if(t>0){n.store[k]=(n.store[k]||0)+t;left-=t;}}}
}
// disassembling returns 1 of each resource in the cost, except Xenocrystal
const oneEach=c=>Object.fromEntries(Object.keys(c).filter(k=>k!=='xeno').map(k=>[k,1]));
function workerCost(p){const k=Math.pow(1.25,p.workersBuilt+p.workerQueue-p.freeQ);return {iron:Math.ceil(6*k),copper:Math.ceil(4*k)};}
const workerTotal=p=>G.workers.filter(w=>w.owner===p.id).length+p.workerQueue;
function stCost(pid,type){
  const base=ST[type].cost;if(type!=='borehole')return base;
  return Object.fromEntries(Object.entries(base).map(([r,v])=>[r,v*(boreholes(pid)+1)]));
}
const boreholes=pid=>G.nodes.reduce((a,n)=>a+(n.owner===pid?n.stations.filter(s=>s.type==='borehole'&&s.state!=='destroyed').length:0),0);
const fitsHere=(n,type)=>ST[type].where==='planet'?n.planet!=null:ST[type].where==='centre'?!!n.center:true;
function canBuild(pid,n,type){
  if(n.owner!==pid)return L('Not your asteroid','Не ваш астероид');
  if(ST[type].tech&&!has(pid,ST[type].tech))return L(`Needs the ${tN(ST[type].tech)} tech`,`Нужна технология «${tN(ST[type].tech)}»`);
  if(!fitsHere(n,type))return ST[type].where==='centre'?L('Only on a planet centre','Только в центре планеты'):L('Only on a planet section','Только на участке планеты');
  if(type==='borehole'&&n.stations.some(x=>x.type==='borehole'))return L('Only one borehole per planet centre','Только одна скважина на центр планеты');
  if(type==='borehole'&&boreholes(pid)>=5)return L('You already have 5 boreholes','У вас уже 5 скважин');
  if(type==='levi'){
    if(G.mode==='conquest')return L('No leviathans in Conquest','В «Завоевании» левиафанов нет');
    if(P(pid).gold<ST.levi.gold)return L('Needs 100 stargold','Нужно 100 звёздного золота');
    if(n.stations.some(x=>x.type==='levi'))return L('A leviathan is already being built here','Здесь уже строится левиафан');
  }
  if(!ST[type].noSlot&&n.stations.filter(x=>!ST[x.type].noSlot).length>=SLOTS)return L('All 4 build slots are used','Все 4 места для станций заняты');
  if(!canPayAt(pid,n.id,stCost(pid,type)))return G.conn[pid].has(n.id)?L('Not enough resources','Не хватает ресурсов'):L('Not enough resources in this cut-off cluster','Не хватает ресурсов в этом отрезанном скоплении');
  return '';
}
const buildersOn=(uid,ex)=>G.workers.filter(w=>w!==ex&&((w.task==='build'&&w.ref===uid&&!w.path.length)||(w.then&&w.then.task==='build'&&w.then.ref===uid))).length;
const researchersOn=(pid,t,ex)=>G.workers.filter(w=>w!==ex&&w.owner===pid&&((w.task==='research'&&w.tech===t)||(w.then&&w.then.task==='research'&&w.then.tech===t))).length;
const techOpen=(p,t)=>!p.techs.has(t.id)&&(!t.req||p.techs.has(t.req));
const techLeft=(p,t)=>TECH[t].c-(p.prog[t]||0);
function mergeFleets(t,s){t.count+=s.count;t.hp+=s.hp;t.en=(t.en||[]).concat(s.en||[]);G.fleets=G.fleets.filter(f=>f!==s);}
// one charger per tile; everything else up to the fleet size limit
const capFor=(pid,cls)=>cls==='charger'||cls==='leviathan'?1:tileCap(pid);
// what each station takes in: barrack = drones (not chargers), rover barrack = rovers, upgrade station = both
const dockKinds=st=>st.type==='kazarm'?SPACE.filter(c=>c!=='charger'):st.type==='rbarracks'?ROVERS:st.type==='upgrade'?[...SPACE,...ROVERS].filter(c=>c!=='charger'):[];
// a leviathan can't enter a tile with your fleets (a settled charger is fine), and your fleets can't enter a leviathan's tile
const leviBlocks=(f,id)=>f.cls==='leviathan'?G.fleets.some(g=>g!==f&&g.owner===f.owner&&g.node===id&&!(g.cls==='charger'&&g.settled)):G.fleets.some(g=>g.owner===f.owner&&g.node===id&&g.cls==='leviathan');
const leviHere=(pid,node)=>G.fleets.some(g=>g.owner===pid&&g.node===node&&g.cls==='leviathan');
const stationBusy=st=>st.queue.length>0||CLS.some(c=>(st.hangar[c]||[]).some(d=>d.upg));
// take one drone out of a fleet, with its share of the fleet's health and its own battery
function takeDrone(f){const hp=f.hp/f.count,en=f.en.length?f.en.pop():BATT;f.hp-=hp;f.count--;if(f.count<=0)G.fleets=G.fleets.filter(g=>g!==f);return {hp,en,up:!!f.up};}
// docked drones go back on the map, joining a fleet of the same kind standing there
function launchDrones(pid,c,node,drones){
  for(const d of drones){
    let f=G.fleets.find(g=>g.owner===pid&&g.node===node&&g.cls===c&&g.up===!!d.up&&!g.path.length&&!g.settled);
    if(!f){f=newFleet(pid,c,0,node,!!d.up);f.hp=0;G.fleets.push(f);}
    f.count++;f.hp+=d.hp;f.en.push(d.en);
  }
}
// keep one battery entry per drone after the drone count changes
function fixEn(f){f.en=f.en||[];while(f.en.length>f.count)f.en.pop();while(f.en.length<f.count)f.en.push(BATT);}

/* ---------- combat ---------- */
function fleetMax(f){return f.count*DR[f.cls].hp;}
function syncFleet(f){if(f.hp>0){f.count=Math.ceil(f.hp/DR[f.cls].hp-1e-6);fixEn(f);}}
// Draft 9 damage order, first hit first. Turrets, workers and the core take their place in it.
const HIT_ORDER=['leviathan','stomper','tank','ballista','frigate','catapult','bomber','interceptor','siege','t:chain','t:turret','t:xray','t:death','boomerang','spy','repair','charger','worker','core'];
// the free tile next to n closest to pid's core, where a boomerang sends a rescued unit
function rescueTile(pid,n){
  const d=distMap(P(pid).core);let best=null,bd=Infinity;
  for(const id of n.nbr){if(hostileAt(pid,id))continue;const x=d.get(id)??99;if(x<bd){bd=x;best=id;}}
  return best;
}
function fight(n,fleets,where){
  // sides: each player present with war drones, plus the tile owner's turrets and core
  const sides=new Map();
  const side=pid=>{if(!sides.has(pid))sides.set(pid,{pid,fleets:[],turrets:[],core:null,workers:[],boom:0,rescued:false,saved:[]});return sides.get(pid);};
  for(const f of fleets)if(f.cls!=='spy')side(f.owner).fleets.push(f);
  const owner=n?n.owner:null;
  if(n&&owner!=null&&[...sides.keys()].some(p=>p!==owner)){
    const t=liveTurrets(n);const core=n.type==='core'&&n.coreHp>0?n:null;
    if(t.length||core){const s=side(owner);s.turrets=t;s.core=core;
      // each turret uses 1 energy per battle; without it, it can't fire
      for(const x of t)x.pw=x.type!=='death'&&payEnergy(owner,n.id,1);}
  }
  if(sides.size<2)return false;
  // workers on the tile take part for their side: 1 health, no damage
  if(n)for(const w of G.workers)if(w.node===n.id&&sides.has(w.owner))side(w.owner).workers.push({w,hp:1});
  for(const s of sides.values())s.boom=s.fleets.filter(f=>f.cls==='boomerang').reduce((a,f)=>a+f.count,0);
  const before=[...sides.values()].map(s=>({pid:s.pid,f:s.fleets.map(f=>[f,f.count]),t:s.turrets.map(t=>t),core:s.core?s.core.coreHp:null}));
  // barrier (first round only), minus barriers switched off by upgraded siege drones
  let barrier=0,off=0;
  if(n&&owner!=null&&sides.has(owner)){
    const b=live(n,'barrier').filter(x=>x.pw).length;
    const up=fleets.filter(f=>f.owner!==owner&&f.cls==='siege'&&f.up).reduce((a,f)=>a+f.count,0);
    off=Math.min(b,up);barrier=10*(b-off);
  }
  // upgraded frigates that held their ground this turn get extra health
  for(const s of sides.values())for(const f of s.fleets)if(f.cls==='frigate'&&f.up&&(!f.trail||f.trail.length<=1))f.buf=f.count;
  const alive=s=>s.fleets.some(f=>f.hp>0)||s.turrets.some(t=>t.hp>0)||(s.core&&s.core.coreHp>0);
  // a boomerang side that has lost every boomerang sends one unit per fallen boomerang to safety
  const rescue=s=>{
    const dest=rescueTile(s.pid,n);if(dest==null)return;
    for(let i=0;i<s.boom;i++){
      let ok=false;
      for(const c of ['charger','repair']){const f=s.fleets.find(f=>f.cls===c&&f.hp>0&&f.count>0);if(f){const d=takeDrone(f);f.saved=(f.saved||0)+1;if(f.count<=0)f.hp=0;launchDrones(s.pid,c,dest,[d]);s.saved.push(dN(c));ok=true;break;}}
      if(!ok){const w=s.workers.find(x=>x.hp>0);if(w){w.hp=0;w.saved=true;w.w.node=dest;w.w.path=[];w.w.task='idle';w.w.then=null;s.saved.push(w.w.name);ok=true;}}
      if(!ok){const f=G.fleets.find(f=>f.owner===s.pid&&f.node===n.id&&f.cls==='spy'&&f.count>0);if(f){const d=takeDrone(f);launchDrones(s.pid,'spy',dest,[d]);s.saved.push(dN('spy'));ok=true;}}
      if(!ok)break;
    }
  };
  let rounds=0;
  for(;rounds<60;rounds++){
    const act=[...sides.values()].filter(alive);
    if(act.length<2)break;
    const inc=new Map(act.map(s=>[s.pid,{gen:0,str:0,chain:0}]));
    let any=false;
    for(const s of act){
      const enemies=act.filter(o=>o!==s);
      const maxEnemy=Math.max(0,...enemies.flatMap(o=>o.fleets.filter(f=>f.hp>0).map(f=>f.count)));
      let gen=0,str=0,chain=0;
      for(const f of s.fleets){if(f.hp<=0)continue;const D=DR[f.cls];let d=D.dmg;if(f.cls==='bomber'&&maxEnemy>0&&f.count>maxEnemy)d=3;if(f.cls==='boomerang'&&f.up&&f.viaFree)d+=2;const k=poweredDrones(f);gen+=d*k;if(f.cls==='siege')str+=(D.sdmg-D.dmg)*k;}
      for(const t of s.turrets){if(t.hp<=0||!t.pw)continue;gen+=ST[t.type].dmg||0;if(t.type==='chain')chain++;}
      if(s.core&&s.core.coreHp>0)gen+=2;
      if(gen+str+chain>0)any=true;
      for(const o of enemies){const x=inc.get(o.pid);x.gen+=gen/enemies.length;x.str+=str/enemies.length;x.chain+=chain;}
    }
    if(!any)break;
    for(const s of act){
      const x=inc.get(s.pid);let gen=x.gen,str=x.str;
      if(rounds===0&&s.pid===owner&&barrier>0){const a=Math.min(barrier,gen);gen-=a;const b=Math.min(barrier-a,str);str-=b;}
      // chain turrets: 1 damage to each enemy fleet per chain turret
      if(x.chain)for(const f of s.fleets)if(f.hp>0){const d=Math.min(f.buf,x.chain);f.buf-=d;f.hp-=x.chain-d;}
      // everything on this side, in the order it takes damage; siege bonus damage only lands on turrets and the core
      const tg=[];
      for(const f of s.fleets)if(f.hp>0)tg.push({k:HIT_ORDER.indexOf(f.cls),f});
      for(const t of s.turrets)if(t.hp>0)tg.push({k:HIT_ORDER.indexOf('t:'+t.type),t});
      for(const w of s.workers)if(w.hp>0)tg.push({k:HIT_ORDER.indexOf('worker'),w});
      if(s.core&&s.core.coreHp>0)tg.push({k:HIT_ORDER.length-1,c:s.core});
      tg.sort((a,b)=>a.k-b.k);
      for(const t of tg){
        if(gen<=1e-9&&str<=1e-9)break;

const REV_PRI=DRONE_PRI.filter(c=>c!=='spy').reverse();

function bombardAll(){
  for(const f of G.fleets.filter(f=>ARTY(f.cls)&&f.bombard!=null)){
    if(!G.fleets.includes(f))continue;
    const tn=G.nodes[f.bombard];
    if(!G.nodes[f.node].nbr.includes(tn.id)){f.bombard=null;continue;}
    const foe=pid=>pid!=null&&pid!==f.owner;
    const p=P(f.owner),who=RU()?(f.cls==='ballista'?'Баллисты':'Катапульты')+' ('+(f.owner===ME?'ваши':pShort(p))+')':(f.owner===ME?'Your':pShort(p))+' '+(f.cls==='ballista'?'ballistas':'catapults');
    // bombard order: turrets, then rovers, then war drones (both in battle order), then workers (1 per catapult), then an enemy core
    const turrets=foe(tn.owner)?liveTurrets(tn).sort((a,b)=>TURRET_PRI.indexOf(a.type)-TURRET_PRI.indexOf(b.type)):[];
    const drones=G.fleets.filter(g=>g.node===tn.id&&foe(g.owner)&&g.cls!=='spy').sort((a,b)=>DRONE_PRI.indexOf(a.cls)-DRONE_PRI.indexOf(b.cls));
    const workers=G.workers.filter(w=>w.node===tn.id&&foe(w.owner));
    const core=tn.type==='core'&&foe(tn.coreOf)&&tn.coreHp>0;
    if(!turrets.length&&!drones.length&&!workers.length&&!core){if(f.owner===ME)log(L(`${who} had nothing to hit at ${lc(nodeName(tn))} and held fire.`,`${who}: не в кого стрелять на: ${lc(nodeName(tn))}.`),'info',f.node,[f.owner]);continue;}
    const per=f.up?.5:1;
    const shots=Math.min(poweredDrones(f),Math.floor(p.res.iron/per));
    if(!shots){log(L(`${who} ran out of Iron and could not fire at ${lc(nodeName(tn))}.`,`${who}: не хватило железа для обстрела: ${lc(nodeName(tn))}.`),'warn',f.node,[f.owner]);continue;}
    const iron=Math.ceil(shots*per);p.res.iron-=iron;
    const barrier=foe(tn.owner)?10*live(tn,'barrier').filter(x=>x.pw).length:0;
    const perShot=DR[f.cls].dmg;
    let dmg=Math.max(0,shots*perShot-barrier);
    const lost=[],pids=new Set([f.owner]);if(tn.owner!=null)pids.add(tn.owner);
    if(turrets.length){
      for(const t of turrets){if(dmg<=0)break;const d=Math.min(t.hp,dmg);t.hp-=d;dmg-=d;if(t.hp<=0)lost.push(lc(sN(t.type)));}
      tn.stations=tn.stations.filter(s=>!(isTurret(s.type)&&s.state==='done'&&s.hp<=0));
    }else if(drones.length){
      for(const g of drones){if(dmg<=0)break;pids.add(g.owner);const before=g.count;const d=Math.min(g.hp,dmg);g.hp-=d;dmg-=d;syncFleet(g);const k=g.hp<=0?before:before-g.count;if(k>0)lost.push(L(`${k} ${pShort(P(g.owner))} ${dCount(k,g.cls).replace(/^\d+ /,'')}`,`${dCount(k,g.cls)} (${pShort(P(g.owner))})`));}
      G.fleets=G.fleets.filter(g=>g.hp>0);
    }else if(workers.length){
      const k=Math.min(workers.length,shots,perShot>0?Math.ceil(dmg/perShot):0);
      const dead=shuffle([...workers]).slice(0,k);dead.forEach(w=>pids.add(w.owner));
      G.workers=G.workers.filter(w=>!dead.includes(w));
      if(dead.length)lost.push(L(`worker${dead.length>1?'s':''} ${dead.map(w=>w.name).join(', ')}`,`рабоч${dead.length>1?'ие':'ий'} ${dead.map(w=>w.name).join(', ')}`));

    if(spies.length)G.fleets=G.fleets.filter(g=>!spies.includes(g));

function fireDeathTurrets(){

    payAt(n.owner,n.id,{xeno:10});s.charge=5;

    const spyK=G.fleets.filter(f=>f.node===t.id&&f.cls==='spy'&&f.owner!==n.owner).reduce((a,f)=>a+f.count,0);

    let steps=DR[f.cls].spd;

   // workers may share an asteroid with enemy workers (Draft 6)
